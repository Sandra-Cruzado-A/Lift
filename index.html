  lvlkeep: () => { S.lvlSnooze = addDays(todayKey(),7); save(); render(); },
  chatmic: () => chatMic(),

  chatsend: () => { const t=$("#chatin"); if(t) chat.draft=t.value; if(chat.draft.trim()) chatSubmit([chat.draft]); },
  chatpeek: () => { const t=chat.sc.turns[chat.i]; chat.peek=true; chat.log.push({who:"note", ok:true, html:`💡 ${fb("forExample")}: <b>${esc(t.m)}</b> ${spk(t.m)}<br><span class="small">${fb("nowYou")}</span>`}); render(); scrollChat(); speak(t.m); },
  chatai: () => chatAIcheck(),

  wrdictate: () => dictateInto(wr, "text", "wrin"),
  wrcheck: () => wrCheck(),
  wrai: () => wrAI(),
  reset: () => { if(confirm("Se borrará todo tu progreso, racha y resultados. ¿Continuar?")){ S = defState(); save(); go("onboard"); } }
};
document.addEventListener("click", e => {

app.addEventListener("input", e => {
  const t = e.target, wc = $("#wc");

  if(t.id==="wrin" && wr){ wr.text = t.value; const btn=$('[data-act="wrcheck"]'); if(btn) btn.disabled = !t.value.trim(); if(wc) wc.textContent = wordCount(t.value)+" palabras"; }

app.addEventListener("change", e => {
  const t = e.target;
  if(t.dataset.iv){ iv = iv || {tech:false, useAI:true, offer:true}; iv[t.dataset.iv] = t.checked; return; }
  const k = t.dataset.set; if(!k || k==="rate") return;
  S.settings[k] = t.value; if(k==="tech"||k==="offer") S.daily = S.daily && S.daily.done ? S.daily : null; save(); render();
});
app.addEventListener("keydown", e => {
  const t = e.target;
  if(e.key==="Enter" && !e.shiftKey){
    if(t.id==="ans" && sess && !LONG_TYPES.includes(cur().type)){ e.preventDefault(); const btn=$('[data-act="check"]'); if(btn && !btn.disabled) btn.click(); }
    if(t.id==="chatin"){ e.preventDefault(); ACT.chatsend(); }

});

var installEvt = null;

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); installEvt = e; if(view==="home"||view==="progress") render(); });

}
function installHTML(){
  if(isInstalled()) return "";

}

/* ================= AVISOS DEL RETO DIARIO =================
   La dirección del servicio se lee de avisos.json, en la misma carpeta que esta app:
   {"url": "https://lift-avisos.TU-SUBDOMINIO.workers.dev"} */
var PUSH = {url:null, checked:false, loading:null, busy:false};
function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }
function pushState(){ if(!S.push) S.push = {on:false, times:["10:00","22:00"], id:null}; return S.push; }
function pushId(){ var p = pushState(); if(!p.id){ p.id = (self.crypto && crypto.randomUUID) ? crypto.randomUUID() : (Date.now().toString(36)+"-"+Math.random().toString(36).slice(2,14)); save(); } return p.id; }
function tzName(){ try{ return Intl.DateTimeFormat().resolvedOptions().timeZone || "Europe/Madrid"; }catch(e){ return "Europe/Madrid"; } }
function pushConfig(){
  if(PUSH.checked) return Promise.resolve(PUSH.url);
  if(typeof fetch!=="function"){ PUSH.checked = true; return Promise.resolve(null); }
  if(!PUSH.loading) PUSH.loading = fetch("./avisos.json", {cache:"no-store"}).then(function(r){ return r.ok ? r.json() : null; }).then(function(j){
      if(j && /^(https:\/\/|http:\/\/localhost)/.test(j.url||"")) PUSH.url = String(j.url).trim().replace(/\/+$/,"");
    }).catch(function(){}).then(function(){ PUSH.checked = true; pushWriteState(); if(view==="progress"||view==="home") render(); return PUSH.url; });
  return PUSH.loading;
}
function pushPost(path, body){
  return fetch(PUSH.url+path, {method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body)})
    .then(function(r){ if(!r.ok) throw new Error("HTTP "+r.status); return r.json(); });
}
function b64ToU8(b){ var pad = "=".repeat((4-b.length%4)%4), s = atob((b+pad).replace(/-/g,"+").replace(/_/g,"/")); return Uint8Array.from(s, function(c){ return c.charCodeAt(0); }); }
function u8ToB64(buf){ var s = "", a = new Uint8Array(buf); for(var i=0;i<a.length;i++) s += String.fromCharCode(a[i]); return btoa(s).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,""); }
async function pushSubscribe(){
  var p = pushState();
  if(!(await pushConfig())) throw new Error("noconfig");
  var reg = await navigator.serviceWorker.ready;
  var key = (await (await fetch(PUSH.url+"/vapid")).json()).key;
  var sub = await reg.pushManager.getSubscription();
  if(sub && sub.options && sub.options.applicationServerKey && u8ToB64(sub.options.applicationServerKey)!==key){ await sub.unsubscribe(); sub = null; }
  if(!sub) sub = await reg.pushManager.subscribe({userVisibleOnly:true, applicationServerKey:b64ToU8(key)});
  await pushPost("/subscribe", {id:pushId(), sub:sub.toJSON(), times:p.times, tz:tzName()});
  p.on = true; p.synced = todayKey(); save(); pushWriteState();
}
function pushWriteState(){
  try{ caches.open("lift-state").then(function(c){ return c.put("./state.json", new Response(JSON.stringify({lastDaily:S.lastDaily||null, streak:curStreak(), url:(PUSH&&PUSH.url)||null, id:(S.push&&S.push.id)||null}), {headers:{"Content-Type":"application/json"}})); }).catch(function(){}); }catch(e){}
}
function pushDone(){
  setTimeout(function(){
    pushWriteState();
    var p = pushState(); if(!p.on) return;
    pushConfig().then(function(url){ if(!url) return; return pushPost("/done", {id:pushId(), date:todayKey()}).then(function(){ p.doneSent = todayKey(); save(); }); }).catch(function(){});
  }, 0);
}
async function pushSync(){
  pushWriteState();
  var p = pushState(); if(!p.on || !pushSupported()) return;
  try{
    if(Notification.permission!=="granted"){ p.on = false; p.lost = true; save(); return; }
    var reg = await navigator.serviceWorker.ready, sub = await reg.pushManager.getSubscription();
    if(!sub){ p.on = false; p.lost = true; save(); return; }
    if(!(await pushConfig())) return;
    if(p.synced!==todayKey()){ await pushPost("/subscribe", {id:pushId(), sub:sub.toJSON(), times:p.times, tz:tzName()}); p.synced = todayKey(); save(); }
    if(S.daily && S.daily.done && S.daily.date===todayKey() && p.doneSent!==todayKey()) pushDone();
  }catch(e){}
}
function pushErrMsg(e){
  var m = String(e && e.message || e);
  if(m==="denied") return "No has dado permiso para los avisos. Puedes activarlo en los ajustes del móvil: Notificaciones → Lift (o Chrome).";
  if(m==="noconfig") return "Los avisos aún no están configurados en esta versión de la app.";
  return "No se han podido activar los avisos. Comprueba que tienes conexión y vuelve a intentarlo.";
}
function timesText(t){ return t.length===1 ? "a las "+t[0] : "a las "+t.slice(0,-1).join(", ")+" y a las "+t[t.length-1]; }
function pushPanelHTML(){
  if(!PUSH) return "";
  var p = pushState(), h = '<div class="panel sec"><h2>Avisos del reto diario</h2>';
  if(!pushSupported()){
    h += isIOS() && !isInstalled() ? '<p class="muted small" style="margin-top:6px">Para recibir avisos en el iPhone, primero añade Lift a la pantalla de inicio (botón Compartir de Safari → «Añadir a pantalla de inicio») y ábrela desde su icono.</p>'
      : '<p class="muted small" style="margin-top:6px">Este navegador no permite avisos. Prueba con Chrome en Android o con la app instalada.</p>';
    return h + '</div>';
  }
  if(!PUSH.checked){ pushConfig(); return h + '<p class="muted small" style="margin-top:6px">Comprobando…</p></div>'; }
  if(!PUSH.url) return h + '<p class="muted small" style="margin-top:6px">Los avisos aún no están configurados en esta versión de la app.</p></div>';
  h += '<p class="muted small" style="margin:6px 0 12px">' + (p.on ? "Activados: te avisaremos "+timesText(p.times)+" (hora de tu móvil) si aún no has hecho el reto." : "Te avisamos a las horas que elijas si aún no has hecho el reto de ese día.") + '</p>';
  if(p.lost && !p.on) h += '<p class="note">Los avisos se desactivaron porque el móvil retiró el permiso. Vuelve a activarlos si quieres seguir recibiéndolos.</p>';
  if(Notification.permission==="denied") h += '<p class="note">Las notificaciones están bloqueadas para Lift. Actívalas en los ajustes del móvil (Notificaciones → Lift o Chrome) y vuelve aquí.</p>';
  h += '<div class="stack">' + p.times.map(function(t,i){ return '<div class="row between" style="gap:10px"><label class="row" style="gap:10px;flex:1"><span>⏰ Aviso '+(i+1)+'</span><input type="time" class="inp time-inp" step="300" value="'+t+'" data-ptime="'+i+'"></label>'+(p.times.length>1?'<button class="icon-btn sm" data-act="pushdel" data-i="'+i+'" aria-label="Quitar este aviso">✕</button>':'')+'</div>'; }).join("") + '</div>';
  if(p.times.length<4) h += '<button class="link" style="margin-top:8px" data-act="pushadd">＋ Añadir otra hora</button>';
  h += '<div class="row" style="gap:10px;margin-top:12px;flex-wrap:wrap">' + (p.on
      ? '<button class="btn sm ghost" data-act="pushtest" '+(PUSH.busy?"disabled":"")+'>Enviar un aviso de prueba</button><button class="btn sm ghost" data-act="pushoff" '+(PUSH.busy?"disabled":"")+'>Desactivar avisos</button>'
      : '<button class="btn sm" data-act="pushon" '+(PUSH.busy?"disabled":"")+'>'+(PUSH.busy?"Activando…":"Activar avisos")+'</button>') + '</div>';
  return h + '</div>';
}
function pushHomeCard(){
  if(!PUSH) return "";
  var p = pushState();
  if(p.on || p.hideHint || !pushSupported() || !PUSH.url || Notification.permission==="denied" || !S.started) return "";
  return '<div class="panel sec"><h3>🔔 Recordatorios del reto</h3><p class="muted" style="margin:4px 0 12px">Te avisamos '+timesText(p.times)+' si aún no has hecho el reto. Puedes cambiar las horas en Progreso.</p>'
    + '<div class="row" style="gap:10px;flex-wrap:wrap"><button class="btn sm" data-act="pushon">Activar avisos</button><button class="btn sm ghost" data-act="pushhide">Ahora no</button></div></div>';
}
var pushSaveTimer = null;
function pushTimesChanged(){
  var p = pushState(); p.times = uniq(p.times.filter(Boolean)).sort(); save();
  if(!p.on) { render(); return; }
  clearTimeout(pushSaveTimer);
  pushSaveTimer = setTimeout(function(){ pushSubscribe().then(function(){ toast("Horas guardadas: "+p.times.join(" y ")+"."); render(); }).catch(function(e){ toast(pushErrMsg(e)); }); }, 600);
}

};
ACT.pushoff = async function(){

ACT.pushtest = async function(){

var backBtn = (to) => `<button class="icon-btn" data-act="xback" data-to="${to||"games"}" aria-label="Volver">←</button>`;
var pageHead = (title, to) => `<div class="row" style="gap:10px;align-items:center;margin-bottom:14px">${backBtn(to)}<h1 style="margin:0;font-size:1.35rem">${title}</h1></div>`;

/* ---------- voces de los personajes ---------- */
function enVoices(){ try{ return speechSynthesis.getVoices().filter(v => /^en(-|_|$)/i.test(v.lang)); }catch(e){ return []; } }
function speakAs(text, who, onend){
  try{
    const c = SERIES_CAST[who] || SERIES_CAST.narrator, u = new SpeechSynthesisUtterance(text), vs = enVoices();
    if(vs.length) u.voice = vs[c.voice % vs.length];
    u.lang = (u.voice && u.voice.lang) || S.settings.accent; u.pitch = c.pitch; u.rate = c.rate * (S.settings.rate||1);
    if(onend) u.onend = onend;
    speechSynthesis.speak(u);
  }catch(e){ if(onend) onend(); }
}

/* ---------- serie ---------- */
var sv = null;
function serState(){ if(!S.series) S.series = {done:[], at:{}, pick:{}}; return S.series; }
function chapterOpen(n){ const st = serState(); if(n===1) return true; const prev = st.at[n-1]; return !!prev && (prev < todayKey() || st.done.includes(n)); }
function nextChapter(){ const st = serState(); return SERIES.find(c => !st.done.includes(c.n)); }
function renderSeriesList(){
  const st = serState();
  const rows = SERIES.map(c => { const open = chapterOpen(c.n), done = st.done.includes(c.n);
    return `<button class="list-row" data-act="${open?"serplay":"serlocked"}" data-n="${c.n}"><span class="ic">${done?"✅":open?"▶️":"🔒"}</span><span style="flex:1;text-align:left"><b>${c.n}. ${esc(c.t)}</b><br><span class="small muted">${esc(c.es)} · ${LEVELS[c.lvl-1].code}</span></span></button>`; }).join("");

    <div class="panel sec stack">${rows}</div><p class="note">Los capítulos se escuchan con una voz distinta para cada personaje. Toca una frase para ver su traducción.</p></div>`;
}
function renderChapter(){
  const c = SERIES.find(x => x.n===sv.n), L = S.level, showAll = L<=2;
  let h = `<div class="wrap">${pageHead(`📺 ${c.n}. ${esc(c.t)}`, "series")}`;
  const shown = c.lines.slice(0, sv.i+1);

      <div class="ser-txt" data-act="sertr" data-i="${i}">${esc(ln[1])}${tr_?`<div class="small muted" style="margin-top:4px">${esc(ln[2])}</div>`:""}</div>
      <div class="row" style="gap:6px"><button class="icon-btn sm" data-act="sersay" data-i="${i}" aria-label="Escuchar">🔊</button>${ln[0]!=="narrator"?`<button class="icon-btn sm" data-act="savephr" data-en="${esc(ln[1])}" data-es="${esc(ln[2])}" data-src="Flat 4B" aria-label="Guardar frase">⭐</button>`:""}</div></div>`; }).join("") + `</div>`;
  if(sv.phase==="lines"){
    h += `<div class="row sec" style="gap:10px;flex-wrap:wrap">${sv.i < c.lines.length-1 ? `<button class="btn" data-act="sernext">Siguiente ▸</button><button class="btn ghost" data-act="serauto">▶️ Escuchar seguido</button>` : `<button class="btn" data-act="serchoice">Continuar ▸</button>`}</div>`;
  } else if(sv.phase==="choice"){

      ${sv.pick!=null ? `<p class="sec">${c.choice.o[sv.pick][1]?"✅":"💡"} ${esc(c.choice.o[sv.pick][2])}</p>${c.choice.o[sv.pick][1]?`<button class="btn sec" data-act="serquiz">Continuar ▸</button>`:""}` : ""}</div>`;
  } else if(sv.phase==="quiz"){

    h += `<div class="panel sec"><h3>❓ ${esc(q[0])}</h3><div class="opts" style="margin-top:10px">${sv.qorder.map(i => `<button class="opt ${sv.qa!=null ? (i===q[2]?"ok":(i===sv.qa?"bad":"")) : ""}" data-act="serq" data-i="${i}" ${sv.qa!=null?"disabled":""}>${esc(q[1][i])}</button>`).join("")}</div>
      ${sv.qa!=null ? `<button class="btn sec" data-act="serqnext">${sv.qi < c.quiz.length-1 ? "Siguiente pregunta ▸" : "Terminar el capítulo"}</button>` : ""}</div>`;

      ${nx ? `<p>${chapterOpen(nx.n)?`El capítulo ${nx.n} ya está disponible.`:`El capítulo ${nx.n}, «${esc(nx.t)}», se desbloquea mañana.`}</p>` : `<p>Has terminado la primera temporada. 🎉</p>`}
      <div class="row sec" style="gap:10px"><button class="btn" data-act="xback" data-to="series">Ver capítulos</button></div></div>`;
  }

function serStart(n){ sv = {n, i:0, phase:"lines", es:new Set(), pick:null, qi:0, qa:null, ok:0, xp:0}; view = "chapter"; render(); scrollTo(0,0); const c = SERIES.find(x=>x.n===n); speakAs(c.lines[0][1], c.lines[0][0]); }
function serQuizSetup(){ const c = SERIES.find(x=>x.n===sv.n); sv.qorder = shuffle([0,1,2], rng(hashStr(c.t+sv.qi))); sv.qa = null; }

  const st = serState(), c = SERIES.find(x=>x.n===sv.n);

/* ---------- misterio ---------- */
var mv = null;
function mystState(){ if(!S.myst) S.myst = {solved:[]}; return S.myst; }
function renderMysteryList(){
  const st = mystState();
  return `<div class="wrap">${pageHead("🕵️ Misterios")}<div class="panel"><p>Lee el caso y averigua qué pasó haciendo preguntas de <b>sí o no</b> en inglés: <i>Was…? Did…? Is…? Can…?</i></p><p class="small muted" style="margin-top:6px">Cuando creas que lo sabes, pulsa «Resolver».</p></div>
    <div class="panel sec stack">${MYSTERIES.map(m => `<button class="list-row" data-act="myplay" data-id="${m.id}"><span class="ic">${st.solved.includes(m.id)?"✅":"🔍"}</span><span style="flex:1;text-align:left"><b>${esc(m.t)}</b><br><span class="small muted">${esc(m.es)} · ${LEVELS[m.lvl-1].code}</span></span></button>`).join("")}</div></div>`;
}
function mAnswer(q, m){
  const s = " " + norm(q) + " ";
  if(!AUX_START.test(norm(q))) return {a:"?", r:"Ask me a yes/no question!", tip:"Haz preguntas de sí o no: empieza por Is, Was, Did, Does, Can… Por ejemplo: «Was it a party?»."};
  const facts = m.f.slice().sort((a,b) => b.k.length - a.k.length);
  const f = facts.find(f => f.k.every(g => g.some(w => s.includes(" "+w+" ") || s.includes(" "+w+"s ") || s.includes(" "+w+"ed "))));
  let tip = null; const n = norm(q);
  if(/^did\b/.test(n) && / (went|saw|took|came|made|broke|bought|stole|found|gave|left|ran|ate|drank|knew)\b|\b[a-z]{3,}ed\b/.test(n.replace(/^did /,""))) tip = "Después de «did», el verbo va en forma base: «Did he break…?», no «Did he broke…?».";
  if(!f) return {a:"–", r:"That isn't important.", tip};
  return {a:f.a, r:f.r, key:f.key ? m.f.indexOf(f) : null, tip};
}
function renderCase(){
  const m = MYSTERIES.find(x => x.id===mv.id), keys = m.f.map((f,i)=>f.key?i:-1).filter(i=>i>=0), found = keys.filter(i => mv.found.has(i)).length;
  let h = `<div class="wrap">${pageHead("🕵️ "+esc(m.t), "mystery")}<div class="panel"><p class="small muted">${esc(m.es)} · ${LEVELS[m.lvl-1].code}</p><p style="font-size:1.08rem;margin-top:6px"><b>${esc(m.story)}</b> ${spk(m.story)}</p>
    <p class="small sec">Pistas clave descubiertas: <b>${found} de ${keys.length}</b></p><div class="bar"><i style="width:${Math.round(100*found/keys.length)}%"></i></div></div>`;
  if(mv.solved){ h += `<div class="panel sec"><h2>🎉 ¡Caso resuelto!</h2><p style="margin-top:6px">${esc(m.sol)}</p><p class="small muted sec">Lo has resuelto con ${mv.log.length} preguntas.${mv.xp?` +${mv.xp} XP.`:""}</p><button class="btn sec" data-act="xback" data-to="mystery">Ver otros casos</button></div></div>`; return h; }
  h += `<div class="panel sec"><div class="row" style="gap:8px"><input id="myq" class="inp" placeholder="Was it…? Did she…? Is there…?" autocomplete="off" autocapitalize="sentences" lang="en" value="${esc(mv.draft||"")}" style="flex:1">${SRC && !micBlocked ? `<button class="icon-btn" data-act="mymic" aria-label="Dictar">${mv.listening?"⏺️":"🎙️"}</button>` : ""}</div>
    <div class="row" style="gap:10px;margin-top:10px;flex-wrap:wrap"><button class="btn" data-act="myask">Preguntar</button><button class="btn ghost" data-act="mysolve">Resolver</button>${mv.log.length>=5?`<button class="btn ghost" data-act="myhint">💡 Pista</button>`:""}</div></div>`;
  if(mv.solving){
    h += `<div class="panel sec"><h3>¿Qué pasó?</h3><div class="opts" style="margin-top:10px">${mv.opts.map((o,i) => `<button class="opt ${mv.wrongPick===i?"bad":""}" data-act="mypick" data-i="${i}">${esc(o)}</button>`).join("")}</div>${mv.wrongPick!=null?`<p class="sec">No es eso. Sigue preguntando para descubrir más pistas.</p>`:""}</div>`;
  }
  h += `<div class="stack sec">` + mv.log.slice().reverse().map(x => `<div class="my-q"><div class="small">🙋 ${esc(x.q)}</div><div><span class="my-a ${x.a}">${x.a==="y"?"Sí":x.a==="n"?"No":x.a==="?"?"¿?":"Da igual"}</span> ${esc(x.r)}</div>${x.tip?`<div class="small muted">💡 ${esc(x.tip)}</div>`:""}</div>`).join("") + `</div>`;
  return h + `</div>`;
}
function myAsk(){
  const inp = document.getElementById("myq"), q = (inp ? inp.value : mv.draft || "").trim(); if(!q) return;
  const m = MYSTERIES.find(x => x.id===mv.id), res = mAnswer(q, m);
  if(res.key!=null) mv.found.add(res.key);
  mv.log.push({q, a:res.a, r:res.r, tip:res.tip}); mv.draft = ""; speakAs(res.r, "narrator"); render();
  setTimeout(()=>{ const i = document.getElementById("myq"); if(i) i.focus(); }, 50);
}

/* ---------- viaje y postales ---------- */
function levelFrac(){ const lo = LEVELS[S.level-1].xp, hi = S.level<LEVELS.length ? LEVELS[S.level].xp : (typeof TOP_XP!=="undefined" ? TOP_XP : lo+1500); return Math.max(0, Math.min(1, (S.xp-lo)/Math.max(1,hi-lo))); }
function cardOpen(lvl, k){ if(S.level>lvl) return true; if(S.level<lvl) return false; return k<3 ? levelFrac() >= (k+1)*0.25 : false; }
function journeySVG(){
  const pts = JOURNEY.map(j => [j.x*3.2, j.y*1.8]), cur = Math.min(S.level, JOURNEY.length)-1, f = levelFrac();
  const nxt = pts[Math.min(cur+1, pts.length-1)], p0 = pts[cur];
  const plane = cur < pts.length-1 ? [p0[0]+(nxt[0]-p0[0])*f, p0[1]+(nxt[1]-p0[1])*f] : p0;
  const path = pts.map((p,i) => (i?"L":"M")+p[0].toFixed(1)+" "+p[1].toFixed(1)).join(" ");
  return `<svg viewBox="0 0 320 180" class="journey" role="img" aria-label="Mapa del viaje">
    <rect x="0" y="0" width="320" height="180" rx="16" fill="var(--chip)"/>
    <path d="M40 60 q30 -30 70 -10 t60 20 q-20 30 -60 30 t-70 -40z M150 40 q40 -20 70 0 q10 30 -20 40 q-40 0 -50 -40z M230 120 q30 -10 50 10 q0 25 -30 25 q-25 0 -20 -35z" fill="var(--surface)" opacity=".9"/>
    <path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-dasharray="5 6" stroke-linecap="round"/>
    ${pts.map((p,i) => `<g><circle cx="${p[0]}" cy="${p[1]}" r="${i<=cur?7:5}" fill="${i<cur?"var(--accent)":i===cur?"#fff":"var(--surface)"}" stroke="var(--accent)" stroke-width="2.5"/><text x="${p[0]}" y="${p[1]-11}" text-anchor="middle" font-size="10" font-weight="700" fill="var(--text)">${JOURNEY[i].flag} ${JOURNEY[i].city}</text></g>`).join("")}
    <text x="${plane[0]}" y="${plane[1]+5}" text-anchor="middle" font-size="16">✈️</text></svg>`;
}
function journeyHTML(full){
  const j = JOURNEY[Math.min(S.level, JOURNEY.length)-1], nx = JOURNEY[S.level] || null, got = JOURNEY.reduce((t,c) => t + c.cards.filter((_,k)=>cardOpen(c.lvl,k)).length, 0);
  let h = `<div class="panel sec"><h2>🗺️ Tu viaje</h2><p class="muted small" style="margin:4px 0 10px">Estás en <b>${j.flag} ${j.city}</b> (${LEVELS[S.level-1].code})${nx?`, camino de ${nx.flag} ${nx.city}`:""}. Postales: ${got} de ${JOURNEY.length*4}.</p>${journeySVG()}
    ${full ? "" : `<button class="btn sm ghost sec" data-act="xgo" data-to="journey">Ver postales</button>`}</div>`;
  if(full) h += JOURNEY.map(c => `<div class="panel sec"><h3>${c.flag} ${c.city} · ${LEVELS[c.lvl-1].code}</h3><div class="stack" style="margin-top:8px">${c.cards.map((cd,k) => cardOpen(c.lvl,k)
      ? `<div class="postcard"><b>✉️ ${esc(cd[0])}</b><p class="small" style="margin-top:4px">${esc(cd[1])}</p></div>`
      : `<div class="postcard locked"><b>🔒 Postal ${k+1}</b><p class="small muted">${k<3?`Llega al ${(k+1)*25} % de ${LEVELS[c.lvl-1].code}`:`Supera el examen de ${LEVELS[c.lvl-1].code}`}</p></div>`).join("")}</div></div>`).join("");
  return h;
}
function renderJourney(){ return `<div class="wrap">${pageHead("🗺️ Tu viaje", "progress")}${journeyHTML(true)}</div>`; }

/* ---------- ranking semanal y medallas (individual) ---------- */
var LEAGUES = [[0,"Bronce","🥉"],[150,"Plata","🥈"],[400,"Oro","🥇"],[800,"Diamante","💎"]];
function leagueOf(x){ const LG = (typeof LEAGUES!=="undefined" && LEAGUES) || [[0,"Bronce","🥉"],[150,"Plata","🥈"],[400,"Oro","🥇"],[800,"Diamante","💎"]]; let l = LG[0]; LG.forEach(g => { if(x>=g[0]) l = g; }); return l; }
function rankingHTML(){
  const m = weekXPMap(), wk = weekStart(todayKey()), cur = m[wk]||0, lg = leagueOf(cur), nxt = LEAGUES.find(g => g[0]>cur);
  const best = Object.entries(m).filter(([w]) => w!==wk).sort((a,b)=>b[1]-a[1]).slice(0,5);
  const fmtW = w => { const d = new Date(w+"T12:00:00"); return d.toLocaleDateString("es-ES",{day:"numeric",month:"short"}); };
  const recordWeek = best.length ? best[0][1] : 0;
  return `<div class="panel sec"><h2>🏁 Tu semana</h2><p style="margin-top:6px"><b>${lg[2]} Liga ${lg[1]}</b> · ${cur} XP esta semana</p>

    ${recordWeek ? `<p class="small sec">${cur>recordWeek?"🎉 ¡Esta es tu mejor semana!":`Tu récord es de ${recordWeek} XP en una semana.`}</p>` : ""}
    ${best.length ? `<h3 class="sec" style="font-size:1rem">Tus mejores semanas</h3><div class="stack" style="margin-top:6px">${best.map(([w,x],i) => `<div class="row between small"><span>${["🥇","🥈","🥉","4.º","5.º"][i]} Semana del ${fmtW(w)}</span><b>${x} XP</b></div>`).join("")}</div>` : `<p class="small muted sec">Tu ranking de semanas empieza a contar desde hoy.</p>`}
    <p class="note">La semana empieza el lunes. Compites solo contigo: cada semana intentas superar tus récords.</p></div>`;
}
function checkMedals(){
  S.medals = S.medals || {}; const fresh = [];
  MEDALS.forEach(md => { if(!S.medals[md[0]]){ let ok = false; try{ ok = md[4](S); }catch(e){} if(ok){ S.medals[md[0]] = todayKey(); fresh.push(md); } } });
  if(fresh.length){ save(); toast(fresh.length===1 ? `🏅 Nueva medalla: ${fresh[0][1]} ${fresh[0][2]}` : `🏅 ${fresh.length} medallas nuevas`); }
}
function medalsHTML(){
  const got = MEDALS.filter(m => S.medals && S.medals[m[0]]).length;

var CAP_Q = ["Tell me about yourself: who you are and what your typical week is like.","Describe your home and the place where you live.","What are your plans and dreams for the next few months?"];
var CAP_DAYS = 60;
var cv = null;
function capList(){ return S.capsules = S.capsules || []; }
function capDue(){ const c = capList(); if(!c.length) return true; return addDays(c[c.length-1].date, (typeof CAP_DAYS!=="undefined" && CAP_DAYS) || 60) <= todayKey(); }
function capNext(){ const c = capList(); return c.length ? addDays(c[c.length-1].date, CAP_DAYS) : todayKey(); }
function idb(){ return new Promise((ok, ko) => { const r = indexedDB.open("lift-capsule", 1); r.onupgradeneeded = () => r.result.createObjectStore("rec"); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function idbPut(k, v){ const db = await idb(); return new Promise((ok, ko) => { const t = db.transaction("rec","readwrite"); t.objectStore("rec").put(v, k); t.oncomplete = ok; t.onerror = () => ko(t.error); }); }
async function idbGet(k){ const db = await idb(); return new Promise((ok, ko) => { const r = db.transaction("rec").objectStore("rec").get(k); r.onsuccess = () => ok(r.result); r.onerror = () => ko(r.error); }); }
async function analyzeBlob(blob){
  try{
    const AC = window.AudioContext || window.webkitAudioContext, ctx = new AC(), buf = await ctx.decodeAudioData(await blob.arrayBuffer()); ctx.close && ctx.close();
    const x = buf.getChannelData(0), sr = buf.sampleRate, hop = Math.round(sr*0.02), db = [];
    for(let i=0;i+hop<=x.length;i+=hop){ let e = 0; for(let k=i;k<i+hop;k++) e += x[k]*x[k]; db.push(10*Math.log10(e/hop+1e-12)); }
    const sorted = db.slice().sort((a,b)=>a-b), thr = sorted[Math.floor(sorted.length*0.9)] - 22;
    let speak = 0, pauses = 0, run = 0, started = false;
    db.forEach(v => { if(v>=thr){ speak++; if(started && run*0.02>=1.0) pauses++; run = 0; started = true; } else run++; });
    return {dur:Math.round(buf.duration), speak:Math.round(speak*0.02), pauses};
  }catch(e){ return {dur:0, speak:0, pauses:0}; }
}

    if(c.length>=2){ const a = c[0], b = c[c.length-1], tot = cap => cap.items.reduce((t,i)=>t+(i.speak||0),0), pz = cap => cap.items.reduce((t,i)=>t+(i.pauses||0),0);

async function capStartRec(){
  try{
    if(typeof Mic!=="undefined") Mic.abort();
    const stream = await navigator.mediaDevices.getUserMedia({audio:true});
    const mr = new MediaRecorder(stream), chunks = [];
    mr.ondataavailable = e => { if(e.data && e.data.size) chunks.push(e.data); };
    mr.onstop = async () => { stream.getTracks().forEach(t=>t.stop()); clearInterval(cv.timer); const blob = new Blob(chunks, {type: mr.mimeType || "audio/webm"});
      const k = cv.id+":"+cv.qi; await idbPut(k, blob); const m = await analyzeBlob(blob); cv.items[cv.qi] = m; cv.recording = false;
      render(); };
    cv.mr = mr; cv.recording = true; cv.sec = 0; mr.start();
    cv.timer = setInterval(() => { if(!cv) return; cv.sec++; if(cv.sec>=90) capStopRec(); else if(view==="capsule"){ const p = app.querySelector(".panel .sec"); if(p) p.textContent = `⏺️ Grabando… ${cv.sec}s (máximo 90 s)`; } }, 1000);
    render();
  }catch(e){ toast("No se ha podido usar el micrófono. Revisa el permiso del micrófono para Lift."); }
}

/* escenas marcadas como «no coincide»: al terminar el reto se amplía el margen; si vuelve a fallar, se retira */
function applyClipFixes(){
  const fl = S.clipFlags || {}, ids = Object.keys(fl); if(!ids.length) return;
  S.clipFix = S.clipFix || {}; S.clipOff = S.clipOff || {}; let fixed = 0, off = 0;
  ids.forEach(id => { const fx = S.clipFix[id] || {n:0, pad:0}; fx.n++;
    if(fx.n>=2){ S.clipOff[id] = todayKey(); off++; } else { fx.pad += 1.5; fixed++; }
    S.clipFix[id] = fx; delete fl[id]; });
  S.clipFlags = {}; save();
  setTimeout(() => toast(`🔧 ${fixed ? `He corregido ${fixed} ${fixed===1?"escena":"escenas"} que marcaste` : ""}${fixed && off ? " y " : ""}${off ? `he retirado ${off} que seguía${off===1?"":"n"} sin coincidir` : ""}.`), 900);
}
/* ---------- copias de seguridad en tu servicio de Cloudflare ---------- */
function bkState(){ if(!S.backup) S.backup = {code:null, last:0, recs:{}}; return S.backup; }
function newBkCode(){ const a = "ABCDEFGHJKLMNPQRSTUVWXYZ23456789"; let c = ""; for(let i=0;i<12;i++){ c += a[Math.floor(Math.random()*a.length)]; if(i===3||i===7) c += "-"; } return c; }
function blobToB64(blob){ return new Promise(ok => { const r = new FileReader(); r.onload = () => ok(String(r.result).split(",")[1] || ""); r.readAsDataURL(blob); }); }
function b64ToBlob(b, type){ const s = atob(b), u = new Uint8Array(s.length); for(let i=0;i<s.length;i++) u[i] = s.charCodeAt(i); return new Blob([u], {type: type||"audio/webm"}); }
var bkBusy = false, bkTimer = null;
async function backupNow(silent){
  if(bkBusy || !roomURL()) return; bkBusy = true;
  try{
    const b = bkState(); if(!b.code) b.code = newBkCode();
    b.last = Date.now(); save();
    await roomCall("/backup/save", {code:b.code, data: JSON.stringify(S)});
    for(const cap of capList()) for(let qi=0; qi<cap.items.length; qi++){ const k = cap.id+":"+qi; if(b.recs[k]) continue;
      const blob = await idbGet(k).catch(()=>null); if(!blob) continue;
      await roomCall("/backup/rec", {code:b.code, key:k, type:blob.type||"audio/webm", data: await blobToB64(blob)}); b.recs[k] = 1; }
    save(); if(!silent) toast("☁️ Copia de seguridad hecha."); if(view==="progress") render();
  }catch(e){ if(!silent) toast("No se ha podido hacer la copia. Comprueba tu conexión."); }
  bkBusy = false;
}
function backupSoon(){ clearTimeout(bkTimer); bkTimer = setTimeout(() => backupNow(true), 4000); }
async function restoreFrom(code){
  code = String(code||"").trim().toUpperCase();
  if(!/^[A-Z0-9]{4}-[A-Z0-9]{4}-[A-Z0-9]{4}$/.test(code)) return toast("El código tiene este formato: ABCD-EFGH-JKLM.");
  try{
    const j = await roomCall("/backup/get?code="+encodeURIComponent(code));
    if(!j.data) return toast("No hay ninguna copia con ese código.");
    if(!confirm(`Copia del ${new Date(j.t).toLocaleString("es-ES")}. ¿Recuperarla? Se sustituirá lo que haya ahora en este móvil.`)) return;
    const st = JSON.parse(j.data);
    for(const cap of (st.capsules||[])) for(let qi=0; qi<cap.items.length; qi++){ const k = cap.id+":"+qi;
      try{ const r = await roomCall("/backup/rec?code="+encodeURIComponent(code)+"&key="+encodeURIComponent(k)); if(r.data) await idbPut(k, b64ToBlob(r.data, r.type)); }catch(e){} }
    st.backup = Object.assign({}, st.backup||{}, {code});
    localStorage.setItem(STORE_KEY, JSON.stringify(st));
    toast("✅ Copia recuperada. Reiniciando…"); setTimeout(() => location.reload(), 900);
  }catch(e){ toast("No se ha podido recuperar. Revisa el código y tu conexión."); }
}

/* ================= MAPA DE ERRORES Y MINILECCIONES ================= */
function errKeys(ex){
  const it = ex.it || {}, t = it.topic;
  if(t==="spanglish") return ["spanglish"];
  if(t==="vocab" || t==="interview" && it.kind==="v") return [/false|falso/i.test(String(it.d && it.d[3] || "")) ? "falsefriends" : "vocab"];
  if(t==="pron" || t==="shadow") return ["pron"];
  const text = String(ex.full || ex.sol || "");
  if(!text || !/[a-z]/i.test(text)) return [];
  const s = prepText(text), hits = new Set(), off = new Set(), keys = [];
  for(const r of RULES){
    if(off.has(r.id)) continue;
    let ok = false; try{ ok = r.t(s, text, hits); }catch(e){}
    if(!ok) continue;
    hits.add(r.id); (r.off||[]).forEach(o => off.add(o));
    if(LESSONS[r.id]) keys.push(r.id);
    if(keys.length>=2) break;
  }
  return keys;
}
function trackErrors(ex, ok){
  S.errMap = S.errMap || {};
  errKeys(ex).forEach(k => { const e = S.errMap[k] = S.errMap[k] || {m:0, h:0}; if(ok) e.h++; else { e.m++; e.last = todayKey(); } });
}
function errList(){
  return Object.entries(S.errMap||{}).filter(([k,e]) => LESSONS[k] && e.m>=1)
    .map(([k,e]) => ({k, m:e.m, h:e.h, rate:e.m/(e.m+e.h), score:e.m - 0.6*e.h}))
    .filter(x => x.score>0).sort((a,b) => b.score-a.score);
}
function topError(){ const l = errList(); return l.length && l[0].m>=2 ? l[0] : null; }
function renderErrMap(){
  const l = errList().slice(0, 10);
  let h = `<div class="wrap">${pageHead("🧭 Mapa de errores", lv && lv.from || "games")}<div class="panel"><p>Aquí ves qué puntos te cuestan más según tus respuestas. Cada fallo suma y cada acierto en ese punto lo compensa.</p></div>`;
  if(!l.length) return h + `<div class="panel sec"><p>Todavía no hay errores repetidos. ¡Sigue practicando!</p></div></div>`;
  h += `<div class="stack sec">` + l.map(x => `<div class="panel"><div class="row between" style="gap:8px;align-items:center"><div style="flex:1"><b>${esc(LESSONS[x.k][0])}</b><p class="small muted">${x.m} ${x.m===1?"fallo":"fallos"} · ${x.h} ${x.h===1?"acierto":"aciertos"}</p><div class="bar"><i style="width:${Math.round(100*x.rate)}%;background:var(--bad)"></i></div></div><button class="btn sm" data-act="lesson" data-k="${x.k}">Minilección</button></div></div>`).join("") + `</div>`;
  return h + `</div>`;
}
var lv = null;
function lessonItems(k){
  const cache = lessonItems.cache = lessonItems.cache || {};
  if(!cache.built){
    cache.built = true;
    const add = (key, it) => { (cache[key] = cache[key] || []).push(it); };
    const textOf = it => { const d = it.d; switch(it.topic){
      case "verbs": return String(d.s).replace("___", d.a[0]).replace(/\s*\([^)]*\)/,"");
      case "write": return it.kind==="t" ? d.a[0] : "";
      case "order": return d[0]; case "ask": return d.q[0];
      case "speak": return d.a ? d.a[0] : ""; default: return ""; } };
    ["verbs","write","order","ask","speak"].forEach(t => (POOL[t]||[]).forEach(it => { const tx = textOf(it); if(tx) errKeys({it, full:tx}).forEach(k2 => add(k2, it)); }));
    cache.spanglish = (POOL.spanglish||[]).slice(); cache.vocab = (POOL.vocab||[]).filter(it => it.lvl<=S.level+1).slice(0, 400);
    cache.falsefriends = (POOL.spanglish||[]).filter(it => /falso amigo/i.test(it.d[3])); cache.pron = (POOL.pron||[]).slice();
  }
  const all = cache[k] || [], near = all.filter(it => it.lvl>=S.level-1 && it.lvl<=S.level+1);
  return near.length>=4 ? near : all;
}

function examScore(){
  const e = EXAMS.find(x => x.id===xm.id), s = {};
  s.reading = e.reading.q.filter((q,i) => xm.a.reading[i]===q[2]).length;
  s.use = e.use.g.filter((g,i) => xm.a.use[i]===g[0]).length;
  s.listening = e.listening.q.filter((q,i) => xm.a.listening[i]===q[2]).length;
  const w = xm.writing || "", wc = (w.match(/[A-Za-z']+/g)||[]).length, low = " "+w.toLowerCase()+" ";
  const hits = e.writing.checks.filter(c => c[1].some(k => low.includes(k))).length, inRange = wc>=e.writing.words[0] && wc<=e.writing.words[1];
  s.writing = Math.round(5 * (hits + (inRange?1:0)) / (e.writing.checks.length + 1));
  if(wc < e.writing.words[0]*0.5) s.writing = Math.min(s.writing, 1); else if(wc < e.writing.words[0]) s.writing = Math.min(s.writing, 3);
  s.speaking = xm.speakSelf || 0;
  const max = {reading:e.reading.q.length, use:e.use.g.length, listening:e.listening.q.length, writing:5, speaking:5};
  const tot = EX_PARTS.reduce((t,p)=>t+s[p],0), mx = EX_PARTS.reduce((t,p)=>t+max[p],0);
  return {s, max, pct: Math.round(100*tot/mx), wc, hits};

function wTrack(ex, ok){
  const wk = weekStart(todayKey()); S.wlog = S.wlog || {}; const w = S.wlog[wk] = S.wlog[wk] || {ex:0, ok:0, topics:{}};
  w.ex++; if(ok) w.ok++; const t = ex.it.topic; const tt = w.topics[t] = w.topics[t] || [0,0]; tt[0]++; if(ok) tt[1]++;
  const ks = Object.keys(S.wlog).sort(); if(ks.length>16) delete S.wlog[ks[0]];
}
function weekReport(wk){
  const w = (S.wlog||{})[wk] || {ex:0, ok:0, topics:{}}, xp = weekXPMap()[wk] || 0;
  const days = Object.keys(S.days||{}).filter(d => weekStart(d)===wk).length;
  const prevK = addDays(wk, -7), pw = (S.wlog||{})[prevK], pxp = weekXPMap()[prevK] || 0;
  const tops = Object.entries(w.topics).filter(([t,v]) => v[0]>=3 && TOPICS[t]).map(([t,v]) => ({t, n:TOPICS[t].name, acc:Math.round(100*v[1]/v[0]), c:v[0]})).sort((a,b) => b.acc-a.acc);
  const medals = MEDALS.filter(m => S.medals && S.medals[m[0]] && weekStart(S.medals[m[0]])===wk);
  return {wk, ex:w.ex, acc: w.ex ? Math.round(100*w.ok/w.ex) : 0, xp, days, prevXP:pxp, prevAcc: pw && pw.ex ? Math.round(100*pw.ok/pw.ex) : null, best:tops[0]||null, worst:tops.length>1 ? tops[tops.length-1] : null, medals, league: leagueOf(xp)};
}

function cwWords(){
  const wk = weekStart(todayKey()), seen = Object.entries(S.seen||{}).filter(([id,d]) => d>=wk).map(([id]) => ITEM[id]).filter(Boolean), out = [], has = new Set();
  const push = (w, clue) => { w = String(w||"").toLowerCase(); if(!/^[a-z]{3,9}$/.test(w) || has.has(w) || !clue) return; has.add(w); out.push({w, clue}); };
  seen.forEach(it => { if(it.topic==="ivocab") push(it.d.w, it.d.es); else if(it.topic==="vocab" && Array.isArray(it.d)) push(it.d[0], it.d[1]); });
  const r = rng(hashStr("cw"+wk+S.level)), pool = shuffle(CORE.filter(c => /^[a-z]{4,8}$/i.test(c[0]) && CORE_ES[String(c[0]).toLowerCase()] && Math.abs(wordBand(String(c[0]).toLowerCase())-S.level)<=1), r);
  myInterests().forEach(k => shuffle(INTERESTS[k].w, r).slice(0,3).forEach(w => push(w[0], w[1])));
  for(const c of pool){ if(out.length>=16) break; push(c[0], CORE_ES[String(c[0]).toLowerCase()]); }
  return out.slice(0, 16);
}
function cwBuild(words){
  const N = 15, grid = Array.from({length:N}, () => Array(N).fill(null)), placed = [];
  const fits = (w, r0, c0, dir) => { let cross = 0;
    for(let i=0;i<w.length;i++){ const r = r0 + (dir?i:0), c = c0 + (dir?0:i); if(r<0||c<0||r>=N||c>=N) return -1; const g = grid[r][c];
      if(g!==null && g!==w[i]) return -1; if(g===w[i]){ cross++; continue; }
      const n1 = dir ? [r, c-1] : [r-1, c], n2 = dir ? [r, c+1] : [r+1, c];
      for(const [a,b] of [n1,n2]) if(a>=0&&b>=0&&a<N&&b<N && grid[a][b]!==null) return -1; }
    const before = dir ? [r0-1, c0] : [r0, c0-1], after = dir ? [r0+w.length, c0] : [r0, c0+w.length];
    for(const [a,b] of [before, after]) if(a>=0&&b>=0&&a<N&&b<N && grid[a][b]!==null) return -1;
    return cross; };
  const put = (o, r0, c0, dir) => { for(let i=0;i<o.w.length;i++) grid[r0+(dir?i:0)][c0+(dir?0:i)] = o.w[i]; placed.push(Object.assign({r:r0, c:c0, dir}, o)); };
  const ws = words.slice().sort((a,b) => b.w.length-a.w.length);
  if(!ws.length) return null;
  put(ws[0], 7, Math.floor((N-ws[0].w.length)/2), 0);
  for(const o of ws.slice(1)){ if(placed.length>=10) break; let best = null;
    for(const p of placed) for(let i=0;i<p.w.length;i++) for(let j=0;j<o.w.length;j++){ if(p.w[i]!==o.w[j]) continue;
      const dir = p.dir ? 0 : 1, r0 = p.r + (p.dir?i:0) - (dir?j:0), c0 = p.c + (p.dir?0:i) - (dir?0:j), f = fits(o.w, r0, c0, dir);
      if(f>0 && (!best || f>best.f)) best = {r0, c0, dir, f}; }
    if(best) put(o, best.r0, best.c0, best.dir); }
  let minR = N, minC = N, maxR = 0, maxC = 0; placed.forEach(p => { minR = Math.min(minR, p.r); minC = Math.min(minC, p.c); maxR = Math.max(maxR, p.r + (p.dir?p.w.length-1:0)); maxC = Math.max(maxC, p.c + (p.dir?0:p.w.length-1)); });
  placed.forEach(p => { p.r -= minR; p.c -= minC; });
  const starts = {}; let n = 0; placed.slice().sort((a,b) => a.r-b.r || a.c-b.c).forEach(p => { const k = p.r+","+p.c; if(!starts[k]) starts[k] = ++n; p.n = starts[k]; });
  return {rows:maxR-minR+1, cols:maxC-minC+1, words:placed.map(p => ({w:p.w, clue:p.clue, r:p.r, c:p.c, dir:p.dir, n:p.n}))};
}

var AN_STOP = new Set("the a an and or but so to of in on at for with my your his her our their i you he she it we they was were is are am be been have has had do did that this then very really just".split(" "));
function anCoverage(text, heard){

}

  if(an.result.cov>=50) addXP(10); save(); checkMedals(); gameStepDone("anecdote", an.result.cov>=40); render();
}

  let pool = vs.filter(v => ch.g==="f" ? fem.test(v.name) && !/\bmale\b/i.test(v.name) : mal.test(v.name) && !/female/i.test(v.name));
  if(!pool.length) pool = vs;
  const pref = pool.filter(v => v.lang && v.lang.replace("_","-").startsWith(S.settings.accent)); if(pref.length) pool = pref;

    <div class="row sec" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="jqa">Juntar y revisar</button>${AI===true && qa.result ? `<button class="btn ghost" data-act="jqaai" ${qa.busy?"disabled":""}>✨ Corregir con IA</button>` : ""}${qa.result && S.room && typeof roomURL==="function" && roomURL() ? `<button class="btn ghost" data-act="jshare2">💬 Enviar a la sala</button>` : ""}</div>`;
  if(qa.result) h += `<div class="sec"><p class="small muted">Tu texto:</p><p lang="en">${esc(qa.result)}</p>${correctionHTML(qa.result, {pastAll: qsPast(set[3])})}${qa.ai ? aiCorrectionHTML(qa.ai) : ""}</div>`;
  h += `</div>`;
  if(entries.length) h += `<div class="panel sec"><h3>Tus entradas (${entries.length})</h3><div class="stack" style="margin-top:8px">${entries.slice(0,20).map(j => `<details><summary class="small"><b>${esc(new Date(j.d+"T12:00:00").toLocaleDateString("es-ES",{day:"numeric",month:"short",year:"numeric"}))}</b> · ${esc(j.p)}</summary><p class="small" lang="en" style="margin-top:6px">${esc(j.fixed || j.text)}</p></details>`).join("")}</div></div>`;
  return h + `</div>`;
};
EXTRA_VIEWS.journal = renderJournal;
var AN_OLD_RENDER = renderAnecdote;
renderAnecdote = function(){
  const a = ANECDOTES.find(x => x.id===an.id), s = anState(a.id), qs = ANECDOTE_QS[a.id] || [a.q];
  if(an.mode==="tell") return AN_OLD_RENDER();
  if(!an.qaInit){ an.qaInit = true; qa = {set:"anec-"+a.id, answers:(s.answers||[]).slice(), listening:null, result:s.text||null, ai:null}; }
  const total = qaTotal();
  let h = `<div class="wrap">${pageHead("📝 "+esc(a.t), "anecdotes")}<div class="panel"><p class="small muted">${esc(a.tips)}</p>
    <p class="small muted" style="margin:6px 0 12px">Contesta cada pregunta con una frase corta. Juntamos las respuestas en tu historia (máximo ${WRITE_MAX} palabras) y luego practicas contarla.</p>
    ${qaInputs(qs)}
    <p class="small ${total>WRITE_MAX?"bad-txt":"muted"}" id="qawc">${total} de ${WRITE_MAX} palabras como máximo</p>
    <div class="row sec" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="aqa">Juntar y revisar</button>${AI===true && qa.result ? `<button class="btn ghost" data-act="aqaai" ${qa.busy?"disabled":""}>✨ Corregir con IA</button>` : ""}${s.text ? `<button class="btn ghost" data-act="anmode" data-m="tell">🗣️ Practicar sin mirar</button>` : ""}</div>`;
  if(qa.result) h += `<div class="sec"><p class="small muted">Tu historia:</p><p lang="en">${esc(qa.result)}</p>${correctionHTML(qa.result, {pastAll: qsPast(qs)})}${qa.ai ? aiCorrectionHTML(qa.ai) : ""}</div>`;
  return h + `</div></div>`;
};
EXTRA_VIEWS.anecdote = renderAnecdote;
function qaCollect(){ document.querySelectorAll(".qa-in").forEach(i => { qa.answers[+i.dataset.qa] = i.value; }); }
Object.assign(ACT, {
  qamic: b => { const i = +b.dataset.i; if(qa.listening===i){ Mic.stop(); return; } qaCollect(); qa.listening = i; render();
    Mic.start({long:false, onResult: alts => { qa.answers[i] = alts[0]; }, onError:()=>{}, onEnd:() => { qa.listening = null; render(); }}); },
  jqa: () => { qaCollect(); const t = joinAnswers(qa.answers), n = wc50(t), set = todaySet();
    if(n<3) return toast("Contesta al menos una pregunta."); if(n>WRITE_MAX) return toast(`Máximo ${WRITE_MAX} palabras: acorta alguna respuesta.`);
    qa.result = t; qa.ai = null; const res = correctText(t, {pastAll: qsPast(set[3])});
    S.journal = S.journal || []; const ex = S.journal.find(j => j.d===todayKey()), entry = {d:todayKey(), p:set[1], text:t, fixed:res.fixed, answers:qa.answers.slice()};
    if(ex) Object.assign(ex, entry); else { S.journal.push(entry); addXP(10); }
    save(); checkMedals(); if(typeof gameStepDone==="function") gameStepDone("journal", qa.answers.filter(x => String(x||"").trim()).length>=2); render(); },
  jqaai: async () => { qa.busy = true; render(); try{ qa.ai = await aiJSON(AI_FIX_PROMPT(LEVELS[S.level-1].code, qa.result), "default"); }catch(e){ toast("No se ha podido corregir ahora."); } qa.busy = false; render(); },
  jshare2: () => { if(!qa.result) return; roomCall("/room/send", {code:S.room.code, id:roomUser(), name:S.myName||"Yo", type:"text", text:"📓 "+qa.result}).then(() => toast("💬 Enviado a la sala")).catch(() => toast("No se ha podido enviar.")); },
  aqa: () => { qaCollect(); const t = joinAnswers(qa.answers), n = wc50(t);
    if(n<3) return toast("Contesta al menos una pregunta."); if(n>WRITE_MAX) return toast(`Máximo ${WRITE_MAX} palabras: acorta alguna respuesta.`);
    const s = anState(an.id), res = correctText(t, {pastAll: qsPast(ANECDOTE_QS[an.id] || [])}); qa.result = t; qa.ai = null; s.answers = qa.answers.slice(); s.original = t; s.text = res.fixed; save();
    toast("📝 Historia guardada. Practicarás la versión corregida."); if(typeof gameStepDone==="function" && qa.answers.filter(x => String(x||"").trim()).length>=3) gameStepDone("anecdote", true); render(); },
  aqaai: async () => { qa.busy = true; render(); try{ qa.ai = await aiJSON(AI_FIX_PROMPT(LEVELS[S.level-1].code, qa.result), "default"); if(qa.ai && qa.ai.corrected){ anState(an.id).text = qa.ai.corrected; save(); } }catch(e){ toast("No se ha podido corregir ahora."); } qa.busy = false; render(); }
});
(function(){ const _o = ACT.anopen; ACT.anopen = b => { _o(b); an.qaInit = false; render(); }; })();
app.addEventListener("input", e => { const t = e.target; if(t && t.classList && t.classList.contains("qa-in")){ qa.answers[+t.dataset.qa] = t.value; const el = document.getElementById("qawc"), n = qaTotal(); if(el){ el.textContent = `${n} de ${WRITE_MAX} palabras como máximo`; el.className = "small " + (n>WRITE_MAX ? "bad-txt" : "muted"); } } });
(function(){ const _x = EXTRA_GAME; EXTRA_GAME = function(id){ if(id==="journal"){ qa = {answers:[], listening:null, result:null, ai:null}; view = "journal"; render(); scrollTo(0,0); return true; } return _x(id); }; })();

/* ================= LÍMITE DE 50 PALABRAS EN TODO LO QUE SE ESCRIBE ================= */
WRITING.forEach(w => { w.min = Math.min(w.min||20, 30); });
EXAMS.forEach(e => { const m = {a2:[20,35], b1:[30,50], b2:[35,50], c1:[40,50]}[e.id]; if(m){ e.writing.words = m; e.writing.task = e.writing.task.replace(/\([^)]*palabras[^)]*\)/, `(${m[0]}-${m[1]} palabras)`).replace(/unas \d+-\d+ palabras/, `${m[0]}-${m[1]} palabras`); } });
(function(){ const _chk = ACT.check; ACT.check = function(){ const ex = sess && cur();
  if(ex && (ex.type==="compose" || ex.type==="open")){ const t = (typeof userText==="function" ? userText(ex, sess.st) : "") || ((document.getElementById("ans")||{}).value || ""); if(wc50(t)>WRITE_MAX){ toast(`Máximo ${WRITE_MAX} palabras: acórtalo un poco.`); return; } }
  return _chk.apply(this, arguments); }; })();
(function(){ const _w = ACT.wrcheck; if(_w) ACT.wrcheck = function(){ const a = document.getElementById("wrin"); if(a && wc50(a.value)>WRITE_MAX){ toast(`Máximo ${WRITE_MAX} palabras: acórtalo un poco.`); return; } return _w.apply(this, arguments); }; })();
(function(){ const _s = ACT.ivsubmit; if(_s) ACT.ivsubmit = function(){ const a = document.getElementById("ivans"); if(a && wc50(a.value)>WRITE_MAX && !iv.spoken){ toast(`Máximo ${WRITE_MAX} palabras: resume tu respuesta.`); return; } return _s.apply(this, arguments); }; })();
(function(){ const _n = ACT.xmnext; ACT.xmnext = function(){ const t = document.getElementById("xmw"); if(t && wc50(t.value)>WRITE_MAX){ toast(`Máximo ${WRITE_MAX} palabras.`); return; } return _n.apply(this, arguments); }; })();

</script>
