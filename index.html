<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="description" content="Aprende inglés hablando: conversaciones, entrevistas de trabajo, escritura y retos diarios.">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lift: inglés para hablar con soltura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7F0FF; --surface:#FFFFFF; --surface2:#F2F6FF; --ink:#0F1B4C; --muted:#56628F; --line:#CAD7F3;
  --accent:#FF5A1F; --accent-press:#E24812; --on-accent:#FFFFFF; --sun:#FFC928;
  --ok:#0E9F6E; --ok-bg:#DBF5E9; --bad:#D92D4B; --bad-bg:#FDE3E8; --chip:#E9F0FF; --focus:#2B6BFF; --deep:#0F1B4C;
  --wide:125%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1130; --surface:#141D46; --surface2:#19245A; --ink:#EAF0FF; --muted:#A6B2DD; --line:#27336B;
    --chip:#1C2860; --ok-bg:#0E3A2D; --bad-bg:#4A1624; --focus:#8DB2FF; --deep:#26358A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1130; --surface:#141D46; --surface2:#19245A; --ink:#EAF0FF; --muted:#A6B2DD; --line:#27336B;
  --chip:#1C2860; --ok-bg:#0E3A2D; --bad-bg:#4A1624; --focus:#8DB2FF; --deep:#26358A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
h1,h2,h3{font-stretch:var(--wide);line-height:1.1;margin:0}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.wrap{max-width:540px;margin:0 auto;padding:14px 16px 110px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.brand{font-stretch:var(--wide);font-weight:900;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:27px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:700}
.streak.off{color:var(--muted)}

/* progress card with bubbles */
.prog-card{background:var(--surface);border-radius:22px;padding:10px 10px 14px;border:1px solid var(--line)}
.band{background:var(--deep);border-radius:16px;padding:14px 6px 6px}
.bubbles{display:block;width:100%;height:auto}
.prog-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 6px 0}
.lvl-code{font-stretch:var(--wide);font-weight:900;font-size:2.1rem;line-height:1}
.lvl-name{font-weight:600}
.xp{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:10px 6px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}

/* sections */
.sec{margin-top:18px}
.panel{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line)}
.panel+.panel{margin-top:12px}
.daily{background:var(--deep);color:#fff;border:0;position:relative;overflow:hidden}
.daily .muted{color:#C3CCF2}
.daily h2{font-size:1.45rem}
.daily .chips{margin:12px 0 16px}
.daily .chip{background:rgba(255,255,255,.12);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8125rem;font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;
  font-weight:800;font-stretch:var(--wide);font-size:1rem;background:var(--accent);color:var(--on-accent);transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97);background:var(--accent-press)}
.btn:disabled{background:var(--line);color:var(--muted)}
.btn.ghost:disabled{background:transparent;opacity:.45}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:inherit;border:2px solid var(--line)}
.btn.ghost:active{background:var(--chip)}
.daily .btn.ghost{border-color:rgba(255,255,255,.3)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.875rem;border-radius:10px}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:var(--chip);font-size:1.1rem;flex:none}

/* word of the day */
.wod-word{font-stretch:var(--wide);font-weight:800;font-size:1.35rem}

/* games */
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.game:active{transform:scale(.98)}
.gi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--chip)}
.game .gi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;margin-bottom:4px}
.game h3{font-size:1rem;margin-bottom:3px}
.game p{font-size:.85rem;color:var(--muted)}
.game.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.game.locked{opacity:.55}

/* session */
.sess{max-width:600px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:10px 16px 0}
.sess-top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:9px;background:var(--line)}
.segs i.done{background:var(--ok)}
.segs i.miss{background:var(--bad)}
.segs i.cur{background:var(--accent)}
.sess-body{flex:1;padding-bottom:24px}
.q-tag{display:inline-flex;gap:6px;align-items:center;font-size:.8125rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.q-title{font-size:1.2rem;font-weight:700;margin-bottom:14px}
.big{font-stretch:var(--wide);font-weight:800;font-size:1.55rem;line-height:1.15;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sentence{font-size:1.25rem;font-weight:600;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.sentence mark{background:var(--sun);color:#0F1B4C;border-radius:6px;padding:0 4px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);margin:0 2px}
.sub{color:var(--muted);margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;font-size:1.02rem;min-height:54px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.inp{width:100%;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;resize:vertical;min-height:56px}
.inp:focus{outline:none;border-color:var(--accent)}
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:14px;border:2px dashed var(--line);margin-bottom:14px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.w{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;font-size:1.02rem}
.w.used{visibility:hidden}
.mic{width:100%;min-height:120px;border-radius:22px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700}
.mic .dot{width:58px;height:58px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:1.6rem}
.mic.on{border-color:var(--accent)}
.mic.on .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.heard{margin-top:12px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.note{font-size:.875rem;color:var(--muted);margin-top:10px}
.bar-actions{position:sticky;bottom:0;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.fb{border-radius:16px;padding:14px 16px;margin-bottom:12px}
.fb.ok{background:var(--ok-bg)}
.fb.bad{background:var(--bad-bg)}
.fb h3{margin-bottom:4px}
.fb.ok h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p+p{margin-top:6px}
.ai-out{margin-top:8px;font-size:.92rem}

/* summary */
.summary{text-align:left}
.result-num{font-stretch:var(--wide);font-weight:900;font-size:2.6rem;line-height:1}
.fact{background:var(--sun);color:#0F1B4C;border-radius:20px;padding:18px}
.fact h3{font-size:1.1rem;margin-bottom:6px}
.miss-list{display:grid;gap:8px}
.miss-list div{background:var(--surface2);border-radius:12px;padding:10px 12px}

/* flashcards */
.card-wrap{perspective:1200px;margin:10px 0 18px}
.fcard{position:relative;width:100%;min-height:260px;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface)}
.face.back{transform:rotateY(180deg);background:var(--deep);color:#fff}
.face .word{font-stretch:var(--wide);font-weight:900;font-size:1.8rem;line-height:1.1}
.face.back .muted{color:#C3CCF2}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{font-size:.92rem;aspect-ratio:1/1.05;border-radius:16px;background:var(--deep);color:#fff;font-weight:700;font-size:.92rem;padding:8px;display:grid;place-items:center;text-align:center;line-height:1.2;transition:transform .2s}
.mc.open{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.mc.en.open{font-stretch:var(--wide);font-weight:800}
.mc.done{background:var(--ok-bg);color:var(--ink);border:2px solid var(--ok)}
.mc.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* progress */
.lights{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:12px}
.lights i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.lights i.on{background:var(--sun);box-shadow:0 0 8px color-mix(in srgb,var(--sun) 70%,transparent)}
.lights i.today{outline:2px solid var(--accent);outline-offset:1px}
.topic{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.topic .bar{margin:6px 0 4px;height:8px}
.topic b{display:block;line-height:1.2}
.topic .bar>i{background:var(--ok)}
.topic .bar.mid>i{background:var(--sun)}
.topic .bar.low>i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi b{display:block;font-stretch:var(--wide);font-weight:900;font-size:1.5rem}
.kpi span{font-size:.8rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.facts-list{display:grid;gap:10px;margin-top:10px}
.facts-list div{background:var(--surface2);border-radius:12px;padding:12px}
select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px}
input[type=range]{width:100%;accent-color:var(--accent)}


/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:18px}
.chat.mini{padding-bottom:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.4;display:flex;align-items:flex-start;gap:8px}
.msg>span{flex:1}
.msg .icon-btn{width:34px;height:34px;font-size:.95rem;margin:-4px -6px -4px 0}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;font-size:1.08rem;font-weight:600}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px;font-weight:600}
.msg.note{align-self:stretch;max-width:100%;display:block;font-size:.92rem;border-radius:14px;padding:10px 12px}
.msg.note.ok{background:var(--ok-bg)}
.msg.note.bad{background:var(--bad-bg)}
.msg.note .icon-btn{width:30px;height:30px;font-size:.85rem;vertical-align:middle;margin:0 0 0 4px}
.msg.note .link{padding:2px 0;display:inline}
.msg .who{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.msg.typing{color:var(--muted);font-style:italic;font-weight:500}
.goal{background:color-mix(in srgb,var(--sun) 35%,var(--surface));color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:12px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer .inp{min-height:52px;font-size:1.05rem;padding:12px}
.composer .btn{flex:none}
.bar-actions .mic{min-height:96px}
.grow{flex:1;min-width:0}
.sess-top .grow b{display:block;line-height:1.2}

/* lists */
.list{padding:4px 12px}
.list-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row b{display:block;line-height:1.25}
.list-row .gi{width:40px;height:40px;font-size:1.25rem;border-radius:12px}
.list-row>span:last-child{color:var(--muted);font-size:1.4rem}
.talk-card .gi{width:48px;height:48px}

/* writing and interview */
.checks{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.checks li{font-weight:600;font-size:.95rem}
.checks li.ok{color:var(--ok)}
.checks li.bad{color:var(--bad)}
.tip{background:var(--surface2);border-radius:12px;padding:8px 12px}
.tip p{margin-top:4px;font-size:.95rem}
.chip-btn{border:1px solid var(--line);text-align:left;font-weight:600;padding:6px 10px}
.fb.neutral{background:var(--surface2);border:1px solid var(--line)}
.errs{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:.92rem}
label.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* onboarding */
.hero-title{font-size:2.1rem;font-weight:900;margin:18px 0 10px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
.timer{font-stretch:var(--wide);font-weight:900;font-size:1.6rem;font-variant-numeric:tabular-nums}
.flash-ok{animation:fok .35s}
.flash-bad{animation:fbad .35s}
@keyframes fok{0%{background:var(--ok-bg)}}
@keyframes fbad{0%{background:var(--bad-bg)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:600px){ .games{grid-template-columns:1fr 1fr 1fr} .game.wide{grid-column:1/-1} }

/* explicaciones */
.gloss{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-top:4px;font-stretch:normal}
.why{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line)}
.why b{display:block;font-size:.85rem;margin-bottom:4px}
.why ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.93rem;line-height:1.4}
.why-inline{display:grid;gap:4px;margin-top:6px;font-size:.88rem}
.fcard .face.back p{font-size:.92rem;line-height:1.4}

/* pronunciación */
.ipa{font-family:"Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Segoe UI",system-ui,sans-serif;color:var(--muted);font-size:.95rem;letter-spacing:.01em}
.big-ipa{font-size:1.1rem;margin:-4px 0 6px}
.fcard .face.front .ipa{display:block;margin:4px 0 10px;font-size:1.05rem}
.pron{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.pron > b{display:block;font-size:.85rem;margin-bottom:6px}
.pwords{line-height:2;margin:0 0 4px}
.pw{padding:2px 6px;border-radius:8px;font-weight:600}
.pw.ok{background:color-mix(in srgb,#1a9e6a 16%,transparent);color:inherit}
.pw.bad{background:color-mix(in srgb,#e0344f 18%,transparent);color:inherit;text-decoration:underline wavy color-mix(in srgb,#e0344f 70%,transparent);text-underline-offset:4px}
.pword{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pword ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px;font-size:.92rem}
.icon-btn.sm{width:34px;height:34px;font-size:.95rem}
.msg.note .pron{background:transparent}
.pron > .pword:first-child{border-top:0;padding-top:0;margin-top:0}

/* confirmar lo dicho antes de enviar */
.heard-card{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-top:8px}
.heard-card textarea{margin-top:6px;font-size:1.05rem}
.time-inp{width:auto;min-width:120px;padding:8px 10px;font-size:1.05rem}

/* resumen: tus respuestas */
.ans-your.bad{color:var(--bad);font-weight:600}
.ans-your.ok{color:var(--ok);font-weight:600}
.ans-mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.8rem;font-weight:800;margin-right:8px;vertical-align:middle}
.ans-mark.ok{background:var(--ok-bg);color:var(--ok)}
.ans-mark.bad{background:var(--bad-bg);color:var(--bad)}
.ans-mark.skip{background:var(--line);color:var(--muted)}
.all-answers summary{cursor:pointer;list-style:none}
.all-answers summary::after{content:" ▾";color:var(--muted)}
.all-answers[open] summary::after{content:" ▴"}

/* canciones de la radio (LyricsTraining) */
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
a.btn.full{display:flex}
.radio-link{font-size:.92rem;text-decoration:none}

/* canciones y escenas */

/* si algo impide arrancar la app, mostrar un aviso en vez de una pantalla en blanco */
(function(){ var errs = []; window.addEventListener("error", function(e){ errs.push(String((e && (e.message || (e.error && e.error.message))) || "error")); });
  setTimeout(function(){ var a = document.getElementById("app"); if(!a || a.innerHTML.replace(/\s/g,"").length) return;
    a.innerHTML = '<div style="padding:28px 22px;font-family:system-ui,sans-serif;line-height:1.5"><h2>Lift no ha podido arrancar</h2><p>Prueba a volver a cargar. Si sigue igual, pulsa «Reparar»: borra la copia guardada de la app (no tu progreso) y la descarga de nuevo.</p><p><button id="lr1" style="padding:10px 16px;margin-right:8px">Volver a cargar</button><button id="lr2" style="padding:10px 16px">Reparar</button></p><p style="font-size:12px;color:#888">' + (errs[0] ? String(errs[0]).replace(/</g,"&lt;") : "") + '</p></div>';
    document.getElementById("lr1").onclick = function(){ location.reload(); };
    document.getElementById("lr2").onclick = function(){ var p = (navigator.serviceWorker && navigator.serviceWorker.getRegistrations) ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
      p.then(function(rs){ for(var i=0;i<rs.length;i++) rs[i].unregister(); return window.caches ? caches.keys().then(function(ks){ return Promise.all(ks.map(function(k){ return caches.delete(k); })); }) : null; }).then(function(){ location.reload(); }); };
  }, 4000); })();
</script>

const SPELL = {colour:"color",fibre:"fiber",aluminium:"aluminum",cancelled:"canceled",metre:"meter",metres:"meters",
  kilometre:"kilometer",kilometres:"kilometers",centre:"center",realise:"realize",organise:"organize",analyse:"analyze",
  programme:"program",grey:"gray",favourite:"favorite",neighbour:"neighbor",behaviour:"behavior",aeroplane:"airplane",
  labour:"labor",modelling:"modeling",travelling:"traveling",defence:"defense",licence:"license",okay:"ok"};
const NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine",
  "10":"ten","11":"eleven","12":"twelve","20":"twenty","30":"thirty"};
function norm(s){
  s = String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”«»"]/g," ");
  s = s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not")
       .replace(/\bshan't\b/g,"shall not").replace(/n't\b/g," not").replace(/\bi'm\b/g,"i am")
       .replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
       .replace(/\blet's\b/g,"let us").replace(/'s\b/g," is");
  s = s.replace(/[^a-z0-9áéíóúñü' ]+/g," ").replace(/'/g,"");
  return s.split(/\s+/).filter(Boolean).map(w => SPELL[w]||NUM[w]||w).join(" ");
}
function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
function isTypo(a,b){
  if(a===b) return true;
  if(Math.min(a.length,b.length)<4) return false;
  const long=a.length>b.length?a:b, short=a.length>b.length?b:a;
  if(long.startsWith(short) && /^(s|es|ed|d|ing)$/.test(long.slice(short.length))) return false;
  return lev(a,b) <= (b.length>=8?2:1);
}
function grade(input, accepted, strict){
  const ni = norm(input);
  if(!ni) return {ok:false,typo:false,best:accepted[0]};
  const wi = ni.split(" ");
  let best=accepted[0], bestD=1e9, typoHit=null;
  for(const a of accepted){
    const na = norm(a);
    if(na===ni) return {ok:true,typo:false,best:a};
    const wa = na.split(" "), d = lev(wi,wa);
    if(d<bestD){ bestD=d; best=a; }
    if(!strict && !typoHit && wa.length===wi.length){
      let diffs=0, good=true;
      for(let k=0;k<wa.length;k++){ if(wa[k]!==wi[k]){ diffs++; if(!isTypo(wi[k],wa[k])){ good=false; break; } } }
      if(good && diffs<=2) typoHit=a;
    }
  }
  if(typoHit) return {ok:true,typo:true,best:typoHit};
  return {ok:false,typo:false,best};
}
function sim(a,b){
  const wa=norm(a).split(" ").filter(Boolean), wb=norm(b).split(" ").filter(Boolean);
  if(!wa.length||!wb.length) return 0;
  return 1 - lev(wa,wb)/Math.max(wa.length,wb.length);
}
function hasKeyword(text, kws){
  const t = " "+norm(text)+" ";
  return kws.some(k => { const n = norm(k); if(!n) return false; if(t.includes(" "+n+" ")) return true;
    const last = n.split(" ").pop(); if(last.length<4) return false;
    return new RegExp(" "+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:s|es|d|ed|ing|er|ers) ").test(t); });
}

function pickItems(spec, L, n, r, used=new Set(), exact=false){
  const [topic, kind] = spec.split(":");
  const pool = (POOL[topic]||[]).filter(it => !used.has(it.id) && (!kind || it.kind===kind));
  let c = pool.filter(it => exact ? it.lvl===L : (it.lvl<=L && it.lvl>=L-1));
  if(c.length<n) c = pool.filter(it => it.lvl<=L);
  if(c.length<n) c = pool.slice();
  const today = todayKey();
  return c.map(it => { const s=S.seen[it.id]; const age = s ? Math.min(30, dayDiff(s,today)) : 40;
      return {it, sc: age + (it.lvl===L?6:0) + r()*8}; })
    .sort((a,b)=>b.sc-a.sc).slice(0,n).map(x=>x.it);
}

/* ---------- estadísticas y experiencia ---------- */
function record(topic, ok){
  const s = S.stats[topic] || (S.stats[topic]={c:0,t:0,r:[]});
  s.t++; if(ok) s.c++; s.r.push(ok?1:0); if(s.r.length>20) s.r.shift();
  S.rec = S.rec || []; S.rec.push([S.level, ok?1:0]); if(S.rec.length>40) S.rec.shift();
}
/* ¿El nivel actual es demasiado alto? Mira los últimos ejercicios hechos en este nivel */
function levelStruggle(){
  if(S.level<=1) return null;
  const r = (S.rec||[]).filter(x=>x[0]===S.level); if(r.length<30) return null;
  const a = r.reduce((t,x)=>t+x[1],0)/r.length; return a<0.55 ? a : null;
}
function levelDown(){
  if(S.level<=1) return;
  const to = S.level-1, lo = LEVELS[to-1], hi = LEVELS[to];
  S.level = to; S.xp = Math.min(S.xp, Math.round(lo.xp + (hi.xp-lo.xp)/2));
  S.rec = []; S.lvlSnooze = null; if(S.daily && !S.daily.done) S.daily = null; save();
}
function acc(topic){ const s=S.stats[topic]; if(!s||!s.r.length) return null; return s.r.reduce((a,b)=>a+b,0)/s.r.length; }
function topicOpen(k){ return !(TOPICS[k].min && S.level<TOPICS[k].min) && !(k==="tech" && S.settings.tech==="never"); }
function weakest(){
  let w=null, wa=2;
  for(const k in TOPICS){ if(k==="game" || k==="reading" || !topicOpen(k)) continue; const s=S.stats[k]; if(!s||s.r.length<3) continue; const a=acc(k); if(a<wa){ wa=a; w=k; } }
  return wa<0.75 ? w : null;
}
function curStreak(){ if(!S.lastDaily) return 0; return dayDiff(S.lastDaily,todayKey())<=1 ? S.streak : 0; }
function addXP(n){ S.xp = Math.max(0, S.xp+Math.round(n)); if(n>0){ S.xpLog = S.xpLog || {}; const k = todayKey(); S.xpLog[k] = (S.xpLog[k]||0) + Math.round(n); } }
function checkrideReady(){ return S.level<5 && S.xp>=LEVELS[S.level].xp && masteryOK() && !(S.crWait && S.crWait>todayKey()); }
/* ---------- repaso de fallos, repartido entre los próximos retos ----------
   Cada fallo se guarda con el número de reto a partir del cual puede volver (due) y una caja:
   caja 1 = recién fallado (vuelve en uno de los próximos retos);
   caja 2 = acertado una vez (vuelve unos retos después para confirmarlo y, si se acierta, sale).
   En cada reto entran como mucho REVIEW_CAP repasos, y los más antiguos primero. */
const REVIEW_CAP = 3;
const revDue = v => (v && typeof v==="object") ? v.due : 0;
function reviewSlot(from){
  const count = {}; Object.values(S.review).forEach(v => { const d = revDue(v); count[d] = (count[d]||0)+1; });
  let d = from; while((count[d]||0) >= REVIEW_CAP) d++; return d;
}
function reviewMiss(id){ if(!ITEM[id]) return; delete S.review[id]; S.review[id] = {box:1, due: reviewSlot((S.dn||0)+1)}; }
function reviewHit(id){
  const v = S.review[id]; if(v==null) return;
  delete S.review[id];
  if(typeof v==="object" && v.box===1) S.review[id] = {box:2, due: reviewSlot((S.dn||0)+3)};
}
function dueReview(){ const n = S.dn||0; return Object.keys(S.review).filter(id => ITEM[id] && revDue(S.review[id])<=n).sort((a,b)=>revDue(S.review[a])-revDue(S.review[b])); }
function pendingReview(){ return Object.keys(S.review).filter(id => ITEM[id]).length; }
/* convierte los repasos antiguos (con fecha) al sistema por retos, repartiéndolos */
function migrateReview(){
  if(S.dn==null) S.dn = Object.keys(S.days||{}).length;
  const old = Object.entries(S.review).filter(([,v]) => typeof v!=="object" || v===null);
  if(!old.length) return;
  old.sort((a,b) => String(a[1]).localeCompare(String(b[1])));
  old.forEach(([id]) => delete S.review[id]);
  old.forEach(([id]) => { if(ITEM[id]) S.review[id] = {box:1, due: reviewSlot(S.dn)}; });
  save();
}
function levelPct(xp){
  const cur=LEVELS[S.level-1], next=LEVELS[S.level], top = next ? next.xp : TOP_XP;
  return Math.max(0, Math.min(1, (xp-cur.xp)/(top-cur.xp)));
}

const ES_STOP = new Set(["los","las","del","que","por","para","con","una","uno","unos","unas","sus","muy","como","sin","algo","ante","sobre","entre"]);
function esTokens(t){ return String(t||"").toLowerCase().replace(/\(.*?\)/g," ").split(/[^a-záéíóúüñ]+/).filter(w=>w.length>=3 && !ES_STOP.has(w)); }
function esWords(t){ return String(t||"").toLowerCase().replace(/\(.*?\)/g," ").split(/[^a-záéíóúüñ]+/).filter(w=>w.length>=2); }
function meaningOverlap(a,b){
  let A = esTokens(a), B = esTokens(b);
  if(!A.length || !B.length){ A = esWords(a); B = esWords(b); }
  const set = new Set(A); return B.some(t=>set.has(t));
}
function distract(it, n, field, r){
  const d0 = it.d;
  let pool = shuffle(POOL[it.topic].filter(x => x!==it && x.kind===it.kind), r).slice(0, 500);
  const scored = pool.map(x => { let k = Math.abs(x.lvl-it.lvl);
    if(it.kind==="c"){ if(x.d[4]!==d0[4]) k += 4; k += Math.min(3, Math.abs(x.d[5]-d0[5])/300); }
    else if((it.topic==="tech"||it.topic==="vocab") && it.kind!=="f" && x.d[3]!==d0[3]) k += 3;
    return {x, k: k + r()*1.5}; }).sort((a,b)=>a.k-b.k);
  const out = [], seen = new Set([String(d0[field]).toLowerCase()]);
  for(const {x} of scored){
    const v = x.d[field], lv = String(v).toLowerCase();
    if(seen.has(lv) || String(x.d[0]).toLowerCase()===String(d0[0]).toLowerCase() || meaningOverlap(d0[1], x.d[1])) continue;
    seen.add(lv); out.push(v); if(out.length>=n) break;
  }
  return out;
}

      accepted:uniq([w, w.replace(/^to /,""), "to "+w.replace(/^to /,"")]),sol:`${en} = ${es}`,full:w,ph:trI("La palabra en inglés","The English word")}; }

const DAILY_V = 7;
/* Tipos de reto: cada día toca uno distinto para que no sea siempre igual */
const DAILY_PLANS = {

function planSlots(p, L, r){

  const job = () => offerOn() ? pick(["interview:o","interview:o","interview:q"]) : (L>=2 ? "interview:q" : "write:c");

  const daily = () => r()<0.12 ? job() : pick(["write:c","conv","speak","listen"]);
  switch(p){
    case "talk": return ["vocab:c","conv","speak","conv",idiom(),"ask","conv","pron","listen","speak"];
    case "grammar": return ["vocab:c","verbs","order", L>=2?"conn":"ask","verbs","write:t","ask","conv","verbs","write:t"];
    case "voice": return ["vocab:c","listen","speak","pron","conv","listen","pron","speak","vocab:v","order"];
    case "words": return ["vocab:c","vocab:c","phrasal","vocab:v",idiom(),"vocab:c","conv","write:t","speak", r()<0.4?"vocab:f":"vocab:c"];
    case "work": return [offerOn()?"interview:w":"vocab:v","vocab:c",job(),"conv",offerOn()?"interview:w":"vocab:c","write:c","verbs","speak",job(),"listen"];
    default: return ["vocab:c","verbs","conv",idiom(),"speak",pick(["ask","order","conn","listen"]), r()<0.25?"vocab:f":"vocab:v","write:t","conv",daily(),"pron"];

/* ordena sin dejar dos ejercicios del mismo tema seguidos; empieza con algo sencillo */
function spreadOrder(ids, r){
  const rest = shuffle(ids.slice(1), r), out = [ids[0]];
  while(rest.length){
    const last = ITEM[out[out.length-1]].topic;
    let k = rest.findIndex(id => ITEM[id].topic!==last); if(k<0) k = 0;
    out.push(rest.splice(k,1)[0]);
  }
  return out;
}
function buildDaily(){
  const key = todayKey();
  if(S.daily && S.daily.date===key && (S.daily.done || S.daily.v===DAILY_V || (S.dailyRun && S.dailyRun.date===key))) return S.daily;
  const r = rng(hashStr(key+"|"+S.level)), L=S.level, used=new Set(), ids=[];
  /* tipo de reto de hoy: distinto al de ayer */
  const plans = Object.keys(DAILY_PLANS).filter(p => p!=="work" || offerOn() || L>=2);
  const prev = S.planLog && S.planLog.date!==key ? S.planLog.p : (S.planLog && S.planLog.prev);
  const avail = plans.filter(p => p!==prev), wt = p => ({mix:1.5, work:0.35}[p] || 1);
  let roll = r()*avail.reduce((t,p)=>t+wt(p),0), plan = avail[avail.length-1];
  for(const p of avail){ roll -= wt(p); if(roll<=0){ plan = p; break; } }
  S.planLog = {date:key, p:plan, prev};
  const base = planSlots(plan, L, r).map(t => t==="pron" ? (micBlocked ? "pron:m" : ["pron:m","pron:w","pron:s"][Math.floor(r()*3)]) : t);
  if(MEDIA_ON && r()<0.3) base.splice(Math.min(5, base.length), 0, "scene");
  if(r()<0.35) base.splice(Math.min(3, base.length), 0, "spanglish");
  if((S.phrases||[]).length>=3 && r()<0.3) base.push("mine");
  if(r()<0.35) base.push("culture");
  if(r()<0.2) base.splice(Math.min(4, base.length), 0, "proverb");
  if(r()<0.25) base.push("twister");
  if(MEDIA_ON && r()<0.2) base.push("shadow");
  if(typeof myInterests==="function" && myInterests().length && r()<0.75){ const mi = myInterests(); base.splice(Math.min(2, base.length), 0, "ivocab:"+mi[Math.floor(r()*mi.length)]); }
  if(S.settings.tech==="daily" || (S.settings.tech==="some" && r()<0.3)) base.splice(5,0,"tech");
  if(plan!=="work"){ if(offerOn() && r()<0.12) base.splice(2,0,"interview:w"); else if(L>=2 && r()<0.1) base.splice(2,0,"interview:v"); }
  const due = dueReview().slice(0, REVIEW_CAP);
  due.forEach(id=>used.add(id));
  let w = weakest(); if(w==="game") w = null;
  if(w && !due.length && r()<0.6) base.splice(4,0,w);
  /* evita repetir lo que salió en los últimos retos si hay alternativas */
  const recent = new Set((S.recentDaily||[]).flatMap(x => (x && x.ids) || []));
  /* conversaciones: casi siempre situaciones cotidianas, no de trabajo */
  const WORK_SC = new Set(["disagree","fault","client","network","supplier"]);
  const workConv = POOL.conv.filter(x => x.d && x.d.sc && WORK_SC.has(x.d.sc.id)).map(x => x.id);
  base.forEach(t => { const ex = (t==="conv" && plan!=="work" && r()<0.85) ? workConv : [];
    let it = pickItems(t,L,1,r,new Set([...used, ...recent, ...ex]))[0] || pickItems(t,L,1,r,new Set([...used, ...ex]))[0] || pickItems(t,L,1,r,used)[0];
    if(it){ used.add(it.id); ids.push(it.id); } });
  const order = spreadOrder(ids, r);
  [2,6,10].forEach((pos,k) => { if(due[k]) order.splice(Math.min(pos, order.length), 0, due[k]); });
  /* duración parecida cada día (~15 min): más ejercicios si son cortos, menos si son largos; y un juego distinto cada día */
  const steps = typeof dailyStepsPick==="function" ? dailyStepsPick(key) : [], stepSecs = steps.reduce((t,g) => t+g.sec, 0), BUDGET = 900 - stepSecs, keep = []; let secs = 0;
  let heavy = 0;
  const isWrite = id => { const it = ITEM[id]; return !!it && (["write","ask","listen"].includes(it.topic) || isHeavyWrite(it)); };
  /* se mantienen los ejercicios de escribir y los repasos; si sobra tiempo, se quitan antes los ejercicios rápidos */
  for(const id of order){ if(isHeavyWrite(ITEM[id]) && (heavy>=1 || itemSec(ITEM[id]) > BUDGET*0.55) && !due.includes(id)) continue; keep.push(id); secs += itemSec(ITEM[id]); if(isHeavyWrite(ITEM[id])) heavy++; }
  const removable = pass => keep.map((id,i) => ({id, i, sec:itemSec(ITEM[id])})).filter(x => !due.includes(x.id) && !x.id.startsWith("ivocab:") && (pass===0 ? !isWrite(x.id) : isWrite(x.id)));
  for(const pass of [0,1]){ while(secs > BUDGET+45 && keep.length>(pass===0 ? 4 : 3)){ const c = removable(pass); if(!c.length) break; const x = pass===0 ? c[c.length-1] : c.sort((p,q) => q.sec-p.sec)[0]; keep.splice(keep.indexOf(x.id), 1); secs -= x.sec; } }
  const FILL = ["vocab:c","verbs","conn","culture","phrasal","expr","ask","order","listen","spanglish","proverb"]; let guard = 0;
  while(secs < BUDGET-60 && guard++ < 25){ const spec = FILL[Math.floor(r()*FILL.length)], it = pickItems(spec,L,1,r,new Set([...used, ...recent]))[0] || pickItems(spec,L,1,r,used)[0];
    if(!it) continue; used.add(it.id); keep.splice(1 + Math.floor(r()*keep.length), 0, it.id); secs += itemSec(it); }
  if(steps[0] && ITEM["game:g"+steps[0].gid]) keep.splice(Math.ceil(keep.length*0.4), 0, "game:g"+steps[0].gid);
  if(steps[1] && ITEM["game:g"+steps[1].gid]) keep.push("game:g"+steps[1].gid);
  order.length = 0; keep.forEach(x => order.push(x));
  const dailyMins = Math.round((secs + stepSecs)/60);
  S.recentDaily = [...(S.recentDaily||[]).filter(x => x && x.d && x.d!==key), {d:key, ids:order.slice()}].slice(-3);
  S.daily = {date:key, v:DAILY_V, plan, ids:order, review:due, done:false, score:null, fact:null, mins:dailyMins, game:steps.map(g => g.gid).join(","), games:steps.map(g => g.gid)};
  if(S.dailyRun && S.dailyRun.date!==key) S.dailyRun = null;
  save();
  return S.daily;
}

function whyNotes(ex, shown){
  const L = S.level, en = inEn(), pick = n => en ? n.en : n.es, list = [];
  const item = en ? (ex.xe || ex.x) : ex.x;
  if(item) list.push(item);
  if(["vocab","tech","interview"].includes(ex.it.topic) && ex.type==="mcq") vocabNotes(ex.it).forEach(n=>list.push(pick(n)));
  if(ex.it.topic==="phrasal" && L<=2) list.push(tr("Un phrasal verb es un verbo + una partícula (up, out, off…). Juntos tienen un significado propio que a menudo no se deduce de las palabras sueltas.","A phrasal verb is a verb + a particle (up, out, off…). Together they have their own meaning, which often isn't obvious from the separate words."));
  if(ex.it.topic==="order" && L<=2) list.push(tr("Orden básico en inglés: sujeto + verbo + complemento + lugar + tiempo. En las preguntas, el auxiliar va delante del sujeto.","Basic English word order: subject + verb + object + place + time. In questions, the auxiliary goes before the subject."));
  const sentence = ["verbs","order","ask","speak","write","listen","conv"].includes(ex.it.topic) && !(ex.type==="speak" && ex.mode==="ans") && ex.type!=="compose" ? (shown||ex.full||ex.sol) : null;
  if(sentence){
    const {rules, irr} = sentenceNotes(sentence, item);
    const maxR = item ? 1 : L<=2 ? 3 : 2;
    rules.slice(0,maxR).forEach(n=>list.push(pick(n)));
    irr.filter(n => !list.some(x=>x.includes(n.forms))).slice(0, item ? 1 : 2).forEach(n=>list.push(pick(n)));
  }
  return uniq(list).slice(0,4);
}
function whyHTML(ex, shown){

}

function wordBand(w){ const r = CORE_RANK[w]; return r==null ? 5 : r<450 ? 1 : r<1050 ? 2 : r<1650 ? 3 : 4; }

const GAP_STOP = new Set(["the","a","an","and","of","to","in","on","is","be","for","with","his","her","its","our","their","that","this","as","at","by","or","but","so","was","are","am","ye","thy","thee","thou","la","fa"]);
/* elige qué palabras quitar según el nivel: en A1 palabras muy frecuentes; en C1, también las poco comunes */
function pickGaps(lines, L, r){
  const toks = [];
  lines.forEach((ln, li) => { ln.split(" ").forEach((t, ti) => {
    const w = t.replace(/^[^A-Za-z']+|[^A-Za-z']+$/g,""), lw = w.toLowerCase().replace(/^'|'$/g,"");
    if(lw.length<3 || GAP_STOP.has(lw) || !/^[a-z']+$/.test(lw)) return;
    toks.push({li, ti, w, lw, band: wordBand(lw)}); }); });
  const n = [0,1,1,2,3,4][Math.min(5,L)];
  const maxBand = L>=5 ? 5 : L>=4 ? 4 : L;
  let pool = toks.filter(t => t.band<=maxBand);
  if(L>=4) pool = pool.concat(toks.filter(t => t.band>=3)); /* en niveles altos, más peso a las menos frecuentes */
  if(pool.length<n) pool = toks.slice();
  const chosen = [], usedLines = new Set();
  for(const t of shuffle(pool, r)){
    if(chosen.length>=n) break;
    if(chosen.some(c => c.li===t.li && c.ti===t.ti)) continue;
    if(usedLines.has(t.li) && toks.length>n*2) continue;
    chosen.push(t); usedLines.add(t.li);
  }
  return chosen.sort((a,b) => a.li-b.li || a.ti-b.ti);
}
function gappedHTML(lines, gaps){
  let k = 0;
  return lines.map((ln, li) => ln.split(" ").map((t, ti) => {
    const g = gaps.find(x => x.li===li && x.ti===ti);
    if(!g) return esc(t);
    k++; const pre = t.slice(0, t.indexOf(g.w)), post = t.slice(t.indexOf(g.w)+g.w.length);
    return esc(pre) + GAP + (gaps.length>1 ? `<sup>${k}</sup>` : "") + esc(post);
  }).join(" ")).join("<br>");
}

}

      extraFB: `<div class="pron"><p><b>${esc(d.en)}</b> ${spk(d.en)}</p><p class="small muted">${credit}</p></div>`};

/* reproductor: canciones desde lift-audio; escenas desde YouTube con inicio y fin */
const Clip = { a:null,
  play(c, rate){
    this.stop(); const a = this.a = new Audio(); a.preload = "auto"; a.src = c.url;
    try{ a.preservesPitch = true; }catch(e){}
    a.addEventListener("loadedmetadata", () => { try{ a.currentTime = c.s; }catch(e){} a.playbackRate = rate || 1; a.play().catch(() => toast("No se ha podido reproducir el audio.")); }, {once:true});
    a.addEventListener("timeupdate", () => { if(a.currentTime >= c.e) this.stop(); });
    a.addEventListener("error", () => { if(this.a===a) toast("No se ha podido cargar el audio. Necesitas conexión a internet."); });
    a.load();
  },
  stop(){ if(this.a){ const a = this.a; this.a = null; try{ a.pause(); a.removeAttribute("src"); a.load(); }catch(e){} } }
};
function mediaHTML(ex){

  if(ex.yt) return `<div class="yt-wrap"><iframe id="ytframe" src="https://www.youtube-nocookie.com/embed/${ex.yt.id}?start=${ex.yt.s}&end=${ex.yt.e}&rel=0&playsinline=1&modestbranding=1" title="Escena" allow="autoplay; encrypted-media; picture-in-picture" allowfullscreen></iframe></div>
    <div class="row" style="gap:10px;margin:8px 0 14px"><button class="btn sm ghost" data-act="ytreplay">↺ ${tr("Ver la escena otra vez","Watch again")}</button></div>`;
  return "";
}

 did:["Did en pasado","En preguntas y negativas en pasado se usa did + verbo base: el pasado ya lo lleva did, así que el verbo no cambia.",[["Did you see the match?","¿Viste el partido?"],["I didn't go out.","No salí."],["Where did they stay?","¿Dónde se alojaron?"]]],
 pastSimple:["Pasado simple","Para acciones terminadas en el pasado. Regulares: -ed (worked). Irregulares: hay que aprenderlos (go – went, see – saw).",[["We visited Rome last year.","Visitamos Roma el año pasado."],["She bought a car.","Se compró un coche."],["I saw him yesterday.","Lo vi ayer."]]],
 presCont:["Presente continuo","am/is/are + -ing para lo que está pasando ahora o para planes ya organizados.",[["I'm cooking right now.","Estoy cocinando ahora mismo."],["She's working from home today.","Hoy trabaja desde casa."],["We're meeting at six.","Hemos quedado a las seis."]]],
 pastCont:["Pasado continuo","was/were + -ing para una acción en curso en un momento del pasado, a menudo interrumpida por otra en pasado simple.",[["I was reading when you called.","Estaba leyendo cuando llamaste."],["They were having dinner.","Estaban cenando."],["It was raining all day.","Estuvo lloviendo todo el día."]]],
 goingTo:["Going to","be going to + verbo para planes e intenciones ya decididos, o para algo que va a pasar porque se ve venir.",[["I'm going to study medicine.","Voy a estudiar medicina."],["Look at the sky! It's going to rain.","¡Mira el cielo! Va a llover."],["Are you going to come?","¿Vas a venir?"]]],
 will:["Will","will + verbo base (sin to) para predicciones, decisiones en el momento, ofrecimientos y promesas.",[["I'll call you later.","Te llamo luego."],["It will be cold tomorrow.","Mañana hará frío."],["Don't worry, I'll help you.","Tranquilo, te ayudo."]]],
 presPerf:["Present perfect","have/has + participio para experiencias sin decir cuándo, para algo reciente que importa ahora o para situaciones que siguen. Con un momento concreto del pasado (yesterday, in 2019) se usa pasado simple.",[["I've been to Paris twice.","He estado en París dos veces."],["She has lost her keys.","Ha perdido las llaves."],["We've lived here since 2020.","Vivimos aquí desde 2020."]]],
 forSince:["For y since","For + un periodo de tiempo (for three years). Since + el momento de inicio (since Monday, since 2019). Los dos suelen ir con present perfect.",[["I've worked here for five years.","Trabajo aquí desde hace cinco años."],["She's been ill since Friday.","Está enferma desde el viernes."],["We haven't met for ages.","Hace siglos que no nos vemos."]]],
 ppc:["Present perfect continuous","have/has been + -ing para algo que empezó en el pasado y sigue, destacando la duración. Equivale a «llevar + tiempo + gerundio».",[["I've been waiting for an hour.","Llevo una hora esperando."],["It's been raining all morning.","Lleva lloviendo toda la mañana."],["How long have you been learning English?","¿Cuánto tiempo llevas aprendiendo inglés?"]]],
 pastPerf:["Past perfect","had + participio para una acción anterior a otra acción del pasado.",[["When I arrived, the film had started.","Cuando llegué, la película había empezado."],["She had never flown before.","Nunca había volado antes."],["They had already eaten.","Ya habían comido."]]],
 passive:["La pasiva","be + participio cuando importa más la acción que quién la hace. Si se dice quién, va con by.",[["The bridge was built in 1890.","El puente se construyó en 1890."],["English is spoken here.","Aquí se habla inglés."],["The book was written by a teacher.","El libro lo escribió un profesor."]]],
 passModal:["Pasiva con modales","modal + be + participio: must be signed, can be done, should be checked.",[["The form must be signed.","Hay que firmar el formulario."],["It can be done today.","Se puede hacer hoy."],["This should be checked.","Esto debería revisarse."]]],
 cond1:["Primer condicional","if + presente, will + verbo: situaciones posibles en el futuro. Después de if nunca va will.",[["If it rains, we'll stay at home.","Si llueve, nos quedaremos en casa."],["If you study, you'll pass.","Si estudias, aprobarás."],["I'll call you if I'm late.","Te llamaré si llego tarde."]]],
 cond2:["Segundo condicional","if + pasado, would + verbo: situaciones imaginarias. Con be se suele usar were para todas las personas.",[["If I had more time, I would travel.","Si tuviera más tiempo, viajaría."],["If I were you, I'd accept.","Yo que tú, aceptaría."],["What would you do if you won?","¿Qué harías si ganaras?"]]],
 cond3:["Tercer condicional","if + had + participio, would have + participio: un pasado imaginario que ya no se puede cambiar.",[["If I had known, I would have come.","Si lo hubiera sabido, habría venido."],["If we'd left earlier, we wouldn't have missed it.","Si hubiéramos salido antes, no lo habríamos perdido."],["She would have passed if she'd studied.","Habría aprobado si hubiera estudiado."]]],
 wish:["Wish","wish + pasado para deseos sobre el presente; wish + had + participio para lamentar el pasado.",[["I wish I had a car.","Ojalá tuviera coche."],["I wish I were taller.","Ojalá fuera más alto."],["I wish I had studied more.","Ojalá hubiera estudiado más."]]],
 usedTo:["Used to","used to + verbo base para hábitos o situaciones del pasado que ya no existen (= solía).",[["I used to play the piano.","Antes tocaba el piano."],["She used to live in Paris.","Antes vivía en París."],["Did you use to have long hair?","¿Antes tenías el pelo largo?"]]],
 beUsedTo:["Be used to + -ing","be used to + -ing = estar acostumbrado a algo. No confundir con used to + infinitivo.",[["I'm used to getting up early.","Estoy acostumbrado a madrugar."],["She isn't used to the cold.","No está acostumbrada al frío."],["You'll get used to it.","Te acostumbrarás."]]],
 modal:["Los verbos modales","can, could, should, must, might… van seguidos del verbo base sin to y nunca añaden -s.",[["She can swim very well.","Nada muy bien."],["You should rest.","Deberías descansar."],["It might rain later.","Puede que llueva luego."]]],
 polite:["Pedir con educación","Could you…? y Could I…? suenan más educados que Can. I'd like… es más amable que I want.",[["Could you help me, please?","¿Podrías ayudarme, por favor?"],["Could I have the bill?","¿Me trae la cuenta?"],["I'd like a table for two.","Quería una mesa para dos."]]],
 indirect:["Preguntas indirectas","Después de Could you tell me…? o Do you know…?, el verbo va en orden normal y sin do/does/did.",[["Do you know where the station is?","¿Sabes dónde está la estación?"],["Could you tell me what time it opens?","¿Podría decirme a qué hora abre?"],["I wonder if she's coming.","Me pregunto si vendrá."]]],
 compar:["Comparativos","Adjetivos cortos: -er + than (cheaper than). Largos: more + adjetivo + than (more expensive than). Irregulares: better, worse.",[["Madrid is bigger than Teruel.","Madrid es más grande que Teruel."],["This is more interesting than I thought.","Es más interesante de lo que pensaba."],["Today is better than yesterday.","Hoy está mejor que ayer."]]],
 superl:["Superlativos","the + adjetivo + -est (the cheapest) o the most + adjetivo (the most expensive). Con lugares se usa in: the best in the city.",[["It's the tallest building in the city.","Es el edificio más alto de la ciudad."],["She's the most patient person I know.","Es la persona más paciente que conozco."],["That was the worst film ever.","Fue la peor película de la historia."]]],
 gerund:["Verbos + -ing","Después de enjoy, avoid, finish, mind, suggest, keep o de una preposición, el verbo va en -ing.",[["I enjoy reading.","Disfruto leyendo."],["Thanks for helping me.","Gracias por ayudarme."],["Do you mind waiting?","¿Te importa esperar?"]]],
 thereIs:["There is / there are","«Hay»: there is + singular, there are + plural. En pasado: there was / there were.",[["There's a bank near here.","Hay un banco cerca."],["There are two problems.","Hay dos problemas."],["Was there anybody at home?","¿Había alguien en casa?"]]],
 freqAdv:["Adverbios de frecuencia","always, usually, often, never… van delante del verbo principal, pero detrás de be.",[["I usually get up at seven.","Normalmente me levanto a las siete."],["She's always late.","Siempre llega tarde."],["We never eat out.","Nunca comemos fuera."]]],
 an:["A y an","an delante de sonido vocálico (an apple, an hour); a delante de sonido consonántico (a university, a car).",[["She's an engineer.","Es ingeniera."],["It takes an hour.","Se tarda una hora."],["He works at a university.","Trabaja en una universidad."]]],
 lookFwd:["Look forward to + -ing","Look forward to va seguido de -ing porque «to» aquí es preposición.",[["I look forward to hearing from you.","Quedo a la espera de su respuesta."],["We're looking forward to seeing you.","Tenemos muchas ganas de verte."],["She's looking forward to the holidays.","Está deseando que lleguen las vacaciones."]]],
 tooTo:["Too… to / not… enough","too + adjetivo + to = demasiado… para; adjetivo + enough + to = lo bastante… para.",[["It's too hot to drink.","Está demasiado caliente para bebérselo."],["He isn't old enough to drive.","No tiene edad para conducir."],["The box is too heavy to carry.","La caja pesa demasiado para llevarla."]]],
 spanglish:["Errores típicos de hispanohablantes","Muchos fallos vienen de traducir palabra por palabra: «tener 30 años» es «be 30», «explicar algo a alguien» es «explain something to someone» y «la gente» va en plural (people are).",[["I'm 30 years old.","Tengo 30 años."],["Can you explain it to me?","¿Me lo explicas?"],["People are very friendly.","La gente es muy simpática."]]],
 falsefriends:["Falsos amigos","Palabras que se parecen al español pero significan otra cosa: actually (en realidad), embarrassed (avergonzado), library (biblioteca), sensible (sensato).",[["Actually, I live in Madrid.","En realidad, vivo en Madrid."],["I felt embarrassed.","Me dio vergüenza."],["She's a sensible person.","Es una persona sensata."]]],
 vocab:["Vocabulario","Para fijar palabras: apréndelas dentro de una frase, repítelas en voz alta y úsalas en un mensaje propio. Guarda las difíciles en Mis frases.",[["I need to make a decision.","Tengo que tomar una decisión."],["She's in charge of the team.","Está a cargo del equipo."],["It depends on the weather.","Depende del tiempo."]]],
 pron:["Pronunciación","Los sonidos que más cuestan son la th, la v frente a la b, la h aspirada y las vocales largas y cortas (ship / sheep). Escucha, repite despacio y exagera al principio.",[["Thank you, I think so.","Gracias, creo que sí."],["Very good, Victor.","Muy bien, Víctor."],["Have a happy holiday.","Que pases unas felices vacaciones."]]]
};

  listening:{script:"Interviewer: Today I'm talking to Elena, who swam across the Strait of Gibraltar last summer. Elena, why did you decide to do it?\nElena: Honestly, it started as a joke. A friend said I'd never manage it, and I wanted to prove her wrong. But as I trained, it became something much more personal.\nInterviewer: What was the hardest part?\nElena: Not the distance, surprisingly, but the currents. At one point I was swimming as hard as I could and hardly moving at all. That was mentally exhausting.\nInterviewer: And what would you say to someone thinking of trying it?\nElena: Prepare properly, and never do it alone. The support boat isn't just for safety; the people on it keep you going when you want to give up.",

  reading:{text:"Few inventions have been as quietly transformative as the shipping container. Before its adoption in the 1950s, loading a cargo ship was a labour-intensive process that could take weeks, with goods handled individually by teams of dockworkers. The standardised steel box changed all that. Because containers could be moved seamlessly between ships, trains and lorries, the cost of transporting goods fell dramatically, making it economically viable to manufacture products on one continent and sell them on another. Critics point out that this efficiency came at a price: traditional port communities were decimated as jobs disappeared, and the ease of long-distance trade has contributed to the environmental footprint of global consumption. Nevertheless, it is difficult to imagine the modern economy without it. The humble container, largely invisible to consumers, underpins almost every object we own.",
   q:[["¿Cómo era la carga de barcos antes del contenedor?",["Lenta y con mucha mano de obra","Rápida pero cara","Totalmente automatizada"],0],["¿Qué hizo posible el contenedor?",["Fabricar en un continente y vender en otro de forma rentable","Eliminar el transporte por carretera","Reducir el consumo"],0],["¿Qué critican algunos?",["La pérdida de empleo en los puertos y el impacto ambiental","El precio de los contenedores","Su tamaño"],0],["¿Qué sugiere la última frase?",["Que el contenedor está detrás de casi todo lo que tenemos","Que los consumidores conocen bien el contenedor","Que el contenedor ya no se usa"],0]]},
  use:{text:"The notion that creativity is an innate gift, [1] only to a fortunate few, is increasingly being called into [2] . Research suggests that creative thinking can be cultivated, [3] the right conditions are in place. Paradoxically, constraints often [4] rise to more original solutions than complete freedom. Faced with a limited budget, for instance, designers are forced to think [5] the box. It would be [6] to conclude, however, that pressure always produces better results.",

  listening:{script:"Today I'd like to challenge a widespread assumption: that we make most of our decisions rationally. In reality, a large proportion of our everyday choices are made automatically, based on habits and mental shortcuts. This isn't necessarily a bad thing. If we had to deliberate over every decision, from which route to take to work to what to have for breakfast, we would be exhausted by mid-morning. The problem arises when these shortcuts lead us astray in situations that genuinely require careful thought, such as financial decisions. One practical strategy is to introduce a deliberate pause: before committing to anything important, ask yourself whether you would make the same choice tomorrow.",

 ["En Reino Unido alguien te saluda con «You alright?». ¿Qué te está preguntando?",["Nada: es un saludo, como «¿qué tal?»","Si te encuentras mal","Si necesitas ayuda"],0,"«You alright?» es un saludo informal. Basta con responder «Yeah, you?». Si contestas contando cómo estás de salud, se sorprenderán.","🇬🇧",1],
 ["En un pub británico, ¿cómo se pide normalmente?",["Se va a la barra a pedir y pagar","Se espera a que venga un camarero","Se pide con una app obligatoria"],0,"En los pubs tradicionales no hay servicio de mesa: pides y pagas en la barra. Esperar sentado a que te atiendan puede hacer que no te atienda nadie.","🇬🇧",1],
 ["Estás en un pub con amigos británicos y uno paga bebidas para todos. ¿Qué se espera de ti?",["Que pagues la siguiente ronda","Que le devuelvas el dinero","Nada, es un regalo"],0,"Es el sistema de «rounds»: cada uno paga una ronda para todo el grupo por turnos. Irse sin pagar tu ronda está muy mal visto.","🇬🇧",2],
 ["¿Cuál es el tema estrella de conversación para romper el hielo en Reino Unido?",["El tiempo","La política","El sueldo"],0,"Hablar del tiempo es casi un ritual: «Lovely day, isn't it?». No es aburrimiento, es una forma segura y amable de empezar a hablar.","🇬🇧",1],
 ["¿Qué es «Big Ben»?",["La campana grande de la torre","La torre del reloj","El reloj entero"],0,"Big Ben es el nombre de la campana. La torre se llama Elizabeth Tower desde 2012; antes se la conocía como Clock Tower.","🇬🇧",2],
 ["El metro de Londres, «the Tube», es…",["El más antiguo del mundo (1863)","El más largo del mundo","El único gratis de Europa"],0,"El primer tramo se inauguró en 1863, con trenes de vapor. Hoy mueve millones de viajeros al día.","🇬🇧",2],
 ["¿Qué se celebra en Reino Unido el 5 de noviembre?",["Bonfire Night, con hogueras y fuegos artificiales","El cumpleaños del rey","El fin del verano"],0,"Recuerda el fallido intento de Guy Fawkes de volar el Parlamento en 1605. Se celebra con hogueras y fuegos artificiales.","🇬🇧",2],
 ["En Reino Unido, si un amigo te dice que tu idea es «quite good», probablemente piensa que…",["Está bien, pero no le entusiasma","Es buenísima","Es malísima"],0,"Es el famoso «understatement» británico: se suaviza todo. «Quite good» suele ser «está bien, sin más», y «not bad» puede ser un gran elogio.","🇬🇧",3],
 ["Si alguien en Reino Unido empieza diciendo «With all due respect…», lo más probable es que…",["Vaya a llevarte la contraria","Vaya a felicitarte","Vaya a despedirse"],0,"Es una forma educada de anunciar un desacuerdo. Cuanto más educada suena la frase, más fuerte puede ser la crítica.","🇬🇧",3],
 ["¿Por qué los británicos dicen tanto «sorry»?",["Lo usan para todo: pedir paso, interrumpir o incluso cuando les empujan","Porque siempre se sienten culpables","Porque es obligatorio por ley"],0,"«Sorry» sirve para pedir paso, para no haber oído algo («Sorry?») y hasta cuando otra persona te pisa. Es puro hábito de cortesía.","🇬🇧",1],
 ["En Gales, las señales de tráfico están…",["En galés y en inglés","Solo en inglés","Solo en galés"],0,"El galés es lengua oficial en Gales junto al inglés, y muchos niños estudian en galés en el colegio.","🏴",2],
 ["En Escocia, los billetes de libra…",["Los emiten también bancos escoceses, con diseños propios","Son iguales que en Inglaterra","No existen: usan euros"],0,"Tres bancos escoceses imprimen sus propios billetes. Son libras de curso legal, aunque en algunas tiendas inglesas te los miran dos veces.","🏴",3],
 ["¿Qué es el «Pancake Day» en Reino Unido?",["El martes de Carnaval, cuando se comen tortitas","Un día de dieta","El cumpleaños de la reina Victoria"],0,"Es el martes antes de la Cuaresma (Shrove Tuesday). Se comen tortitas y en algunos pueblos se hacen carreras dándoles la vuelta en la sartén.","🇬🇧",2],
 ["¿Qué es «Boxing Day»?",["El 26 de diciembre, día festivo","Un día de combates de boxeo","El día de hacer mudanzas"],0,"Es festivo en Reino Unido y otros países de la Commonwealth. Hoy es famoso por las rebajas y los partidos de fútbol.","🇬🇧",2],
 ["En un restaurante de EE. UU., ¿cuánta propina se espera?",["Entre el 15 y el 20 %","Nada, va incluida","Un euro por persona"],0,"Los camareros dependen en gran parte de las propinas. Dejar menos del 15 % se interpreta como una queja por el servicio.","🇺🇸",1],
 ["En una tienda de EE. UU., el precio de la etiqueta…",["Normalmente no incluye el impuesto, que se suma al pagar","Siempre incluye todos los impuestos","Es negociable"],0,"El impuesto sobre las ventas cambia según el estado y se añade en caja. Por eso pagas más de lo que ponía en la etiqueta.","🇺🇸",2],
 ["En EE. UU. te preguntan «How are you?» al entrar en una tienda. ¿Qué respondes?",["«Good, thanks! How are you?»","Le cuentas cómo te va la semana","Nada, no hace falta responder"],0,"Es un saludo, no una pregunta real. Se responde algo breve y positivo y se devuelve la pregunta.","🇺🇸",1],
 ["¿Cuándo se celebra Thanksgiving en EE. UU.?",["El cuarto jueves de noviembre","El 4 de julio","El último domingo de octubre"],0,"Es una de las fiestas más importantes: cena familiar con pavo y millones de personas viajando para reunirse.","🇺🇸",2],
 ["En EE. UU., la fecha 03/04/2027 significa…",["4 de marzo de 2027","3 de abril de 2027","3 de marzo de 2027"],0,"En EE. UU. se escribe primero el mes y luego el día. En Reino Unido, como en España, primero el día.","🇺🇸",2],
 ["Si en EE. UU. el tiempo dice 100 °F, hace…",["Muchísimo calor (unos 38 °C)","Un frío terrible","Una temperatura agradable"],0,"0 °C son 32 °F y 100 °F son unos 38 °C. Truco rápido: resta 30 y divide entre 2.","🇺🇸",2],
 ["En EE. UU., ¿cómo se pregunta por el baño en un restaurante?",["«Where's the restroom?»","«Where's the WC?»","«Where's the toilet room?»"],0,"«Restroom» o «bathroom» suenan naturales. «Toilet» se entiende, pero allí suena demasiado directo.","🇺🇸",1],
 ["En la mayoría de los estados de EE. UU., con el semáforo en rojo…",["Se puede girar a la derecha tras detenerse, salvo señal","Nunca se puede avanzar","Se puede seguir recto si no viene nadie"],0,"«Right turn on red»: después de parar del todo, puedes girar a la derecha si no viene nadie y no hay una señal que lo prohíba.","🇺🇸",3],
 ["En muchos restaurantes de EE. UU., los refrescos…",["Se rellenan gratis («free refills»)","Se cobran por cada vaso","Solo se sirven con la comida"],0,"Es muy común pedir un refresco y que te lo rellenen sin coste. En Europa suele sorprender.","🇺🇸",1],
 ["En un instituto de EE. UU., un «sophomore» es…",["Un estudiante de segundo curso","Un profesor sustituto","El mejor alumno de la clase"],0,"Los cuatro cursos son freshman, sophomore, junior y senior. Los mismos nombres se usan en la universidad.","🇺🇸",3],
 ["En EE. UU. dicen «first floor». ¿Qué planta es?",["La planta baja","El primer piso, encima de la planta baja","El sótano"],0,"En EE. UU. la planta baja es el «first floor». En Reino Unido es el «ground floor», y el «first floor» es el primer piso.","🇺🇸",2],
 ["En Reino Unido, si dices que te has manchado los «pants»…",["Estás hablando de tu ropa interior","Estás hablando de tus pantalones","Estás hablando de tus zapatos"],0,"En Reino Unido «pants» es ropa interior y los pantalones son «trousers». En EE. UU., «pants» sí son pantalones.","🇬🇧",2],
 ["¿Qué se celebra el 17 de marzo en Irlanda?",["San Patricio, el día nacional","El día de la independencia","El fin del invierno"],0,"Hay desfiles, música y mucho verde en todo el mundo. En Irlanda es festivo nacional.","🇮🇪",1],
 ["¿Cuál es la primera lengua oficial de Irlanda según su Constitución?",["El irlandés (gaélico)","El inglés","Las dos por igual, sin orden"],0,"El irlandés es la primera lengua oficial y el inglés la segunda, aunque en la vida diaria la mayoría habla inglés.","🇮🇪",3],
 ["¿Qué moneda se usa en la República de Irlanda?",["El euro","La libra esterlina","La libra irlandesa"],0,"Irlanda usa el euro, pero Irlanda del Norte forma parte de Reino Unido y usa la libra. Al cruzar la frontera cambia la moneda.","🇮🇪",2],

 ["¿Cuál es la capital de Australia?",["Canberra","Sídney","Melbourne"],0,"Sídney y Melbourne competían por ser la capital, y en 1908 se eligió construir una ciudad nueva entre las dos: Canberra.","🇦🇺",2],
 ["Un australiano dice que va al «servo». ¿Adónde va?",["A la gasolinera","Al médico","Al supermercado"],0,"«Servo» viene de «service station». Los australianos acortan casi todo: «Maccas» es McDonald's y «brekkie», el desayuno.","🇦🇺",3],
 ["En Australia, unas «thongs» son…",["Chanclas","Ropa interior","Gafas de sol"],0,"En Australia «thongs» son las chanclas. En Reino Unido o EE. UU. significa tanga: cuidado con el contexto.","🇦🇺",3],

 ["¿Cuántas lenguas oficiales tiene Canadá a nivel federal?",["Dos: inglés y francés","Una: inglés","Tres: inglés, francés y español"],0,"Los productos llevan las etiquetas en inglés y en francés, y en Quebec la lengua principal es el francés.","🇨🇦",2],

 ["¿Qué es lo primero que hace mucha gente al entrar en una casa de Canadá?",["Quitarse los zapatos","Dar dos besos","Abrir la nevera"],0,"Con la nieve y la lluvia, quitarse los zapatos al entrar es muy habitual. Si dudas, mira si los demás lo hacen.","🇨🇦",2],

 ["¿De qué NO conviene hablar con alguien que acabas de conocer en un país anglosajón?",["Del sueldo","Del tiempo","De viajes"],0,"Preguntar cuánto gana alguien, su edad o su peso se considera muy personal. El tiempo, los viajes o las series son temas seguros.","🇬🇧",2],
 ["Un compañero estadounidense te dice «We should have lunch sometime!». Probablemente…",["Es una frase amable, no una invitación concreta","Quiere quedar esta semana sin falta","Espera que le invites tú hoy"],0,"Es una fórmula de cortesía. Si de verdad quiere quedar, propondrá un día concreto.","🇺🇸",3],
 ["Te invitan a una fiesta en Reino Unido y pone «BYOB». ¿Qué significa?",["Que lleves tu propia bebida","Que lleves un regalo","Que vayas bien vestido"],0,"BYOB es «Bring Your Own Bottle» (o Beer). Es muy normal llevar algo de beber a una fiesta en casa.","🇬🇧",2],
 ["En comparación con España, en Reino Unido y EE. UU. se cena…",["Mucho antes: sobre las 18:00-19:00","Más tarde: sobre las 23:00","A la misma hora"],0,"Cenar a las 21:30 puede parecer tardísimo allí. En algunos sitios, la cocina de los restaurantes cierra pronto.","🇬🇧",1],
 ["En el norte de Inglaterra, si te invitan a «tea» a las seis de la tarde, te están invitando a…",["Cenar","Tomar solo un té","Un desayuno tardío"],0,"En partes del norte de Inglaterra «tea» es la comida de la tarde-noche. En el sur suele llamarse «dinner».","🇬🇧",3],
 ["En una reunión de trabajo en Reino Unido o EE. UU., llegar 10 minutos tarde…",["Se considera poco profesional","Es lo normal","Es señal de importancia"],0,"La puntualidad en el trabajo es muy importante. En cambio, a una fiesta en casa llegar 10 o 15 minutos tarde suele estar bien.","🇬🇧",1],
 ["¿Por qué un hispanohablante puede sonar brusco en inglés sin querer?",["Porque en inglés se usan mucho más «please», «could you…?» y «thanks»","Porque habla demasiado bajo","Porque usa palabras largas"],0,"«Dame un café» suena normal en España, pero «Give me a coffee» suena seco en inglés. Mejor: «Could I have a coffee, please?».","🇬🇧",1],
 ["La palabra «goodbye» viene de…",["«God be with ye» (Dios esté contigo)","«Good buy» (buena compra)","«Go by» (pasar de largo)"],0,"Con los siglos, «God be with ye» se fue acortando hasta convertirse en «goodbye».","🌍",3],
 ["¿Qué letra es la más frecuente en inglés?",["La E","La A","La S"],0,"La E es la letra más usada en inglés escrito. Por eso, en muchos juegos de palabras, conviene probarla pronto.","🌍",1],
 ["¿Cómo se pronuncia «colonel» (coronel)?",["Como «kernel»","Como se escribe: «co-lo-nel»","Como «colonial»"],0,"Su ortografía viene del italiano, pero la pronunciación del francés antiguo. Es uno de los casos más raros del inglés.","🌍",4],

 ["¿Tiene el inglés una academia oficial como la RAE?",["No: los diccionarios recogen el uso, pero nadie lo regula","Sí, en Londres","Sí, en Washington"],0,"No existe ningún organismo oficial que fije las normas. Diccionarios como el Oxford o el Merriam-Webster describen cómo se usa la lengua.","🌍",3],

 ["En las escaleras mecánicas del metro de Londres…",["Te quedas a la derecha y dejas libre la izquierda","Te quedas a la izquierda","Da igual, cada uno va donde quiere"],0,"«Stand on the right». Bloquear el lado izquierdo en hora punta es de lo que más molesta a los londinenses.","🇬🇧",2],
 ["¿En qué lado de la carretera se conduce en Reino Unido, Irlanda, Australia y Nueva Zelanda?",["A la izquierda","A la derecha","Depende de la ciudad"],0,"Como peatón, mira primero a la derecha antes de cruzar. En Londres lo pone pintado en el suelo: «Look right».","🇬🇧",1],

 ["En Halloween, en EE. UU., los niños dicen «Trick or treat!». ¿Qué significa?",["«¿Truco o trato?»: o les das caramelos o te gastan una broma","«¡Feliz Halloween!»","«¡Qué miedo!»"],0,"Van de puerta en puerta disfrazados pidiendo caramelos. Las casas que participan suelen dejar una luz o una calabaza encendida.","🇺🇸",1],
 ["En Reino Unido, la expresión «I'll bear it in mind» en una reunión suele significar…",["Que probablemente no lo hará","Que lo hará enseguida","Que está muy de acuerdo"],0,"Es una frase educada para no decir que no directamente. Otro clásico: «That's an interesting idea» puede significar «no me convence».","🇬🇧",4],

/* tiempo estimado de cada ejercicio: el real de tu alumno cuando ya hay datos; si no, un valor por defecto realista */
function itemSec(it){
  if(!it) return 30; if(it.topic==="game") return it.d.sec;
  const key = itemKey(it), def = SEC_DEF[key] || 35, a = (S.secAvg||{})[key];
  return a && a.n>=3 ? Math.round(Math.max(def*0.5, Math.min(def*3, a.s))) : def;
}

function dailyGameOK(g){

  return true;
}
function dailyGamePick(key, r){
  const prev = S.gameLog && S.gameLog.date!==key ? S.gameLog.g : (S.gameLog && S.gameLog.prev);
  const avail = DAILY_GAMES.filter(g => g.gid!==prev && dailyGameOK(g));
  let roll = r()*avail.reduce((t,g)=>t+g.w,0), pick = avail[avail.length-1];
  for(const g of avail){ roll -= g.w; if(roll<=0){ pick = g; break; } }
  S.gameLog = {date:key, g:pick.gid, prev};
  return pick;
}

const BW=[34,46,58,70,84], BH=[26,36,46,58,72];
function bubbleD(x,y,w,h){ const r=9; return `M${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x+21}L${x+8} ${y+h+9}L${x+11} ${y+h}H${x+r}Q${x} ${y+h} ${x} ${y+h-r}V${y+r}Q${x} ${y} ${x+r} ${y}Z`; }

function bubblesSVG(xp){

    const w=BW[i], h=BH[i], y=86-h, st = i<S.level-1 ? "done" : i===S.level-1 ? "cur" : "todo", d = bubbleD(x,y,w,h);

      <path d="${d}" fill="rgba(255,255,255,.14)"/><path d="${d}" fill="#FF5A1F" clip-path="url(#${id})"/><path d="${d}" fill="none" stroke="#FFC928" stroke-width="2"/>`;

function animateProgress(from, to){

  const w = +r.dataset.w, p0 = levelPct(from), p1 = levelPct(to);
  const set = (p,x)=>{ r.setAttribute("width",(w*p).toFixed(1)); if(el) el.textContent = fmt(x)+" XP"; };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || from===to){ set(p1,to); return; }

function gradeEx(ex, st){

    case "compose": return checkCompose(st.answer, ex.checks, ex.min);
    case "speak": {

      if(ex.mode==="ans") return {ok: cands.some(c=>hasKeyword(c, ex.keywords))};

    }

    return st.heard.reduce((b,a) => sim(a, ex.sol||"") > sim(b, ex.sol||"") ? a : b, st.heard[0]);

        <textarea id="chatheard" class="inp" rows="2" autocapitalize="sentences" autocomplete="off" spellcheck="false" lang="en">${esc(c.pending.text)}</textarea>
        <div class="row" style="gap:8px;margin-top:8px;flex-wrap:wrap"><button class="btn sm ghost" data-act="chatretry">🎙️ Volver a decirlo</button><button class="btn sm ghost" data-act="chatmore">➕ Seguir hablando</button></div>
        <button class="btn full" style="margin-top:10px" data-act="chatconfirm">Enviar</button></div>`;
      else bar += `<button class="mic ${c.listening?"on":""}" data-act="chatmic"><span class="dot">🎙️</span>${c.listening?"Te escucho. Tómate tu tiempo y toca cuando termines":"Toca y habla"}</button>`;
    }
    if(c.micErr) bar += `<p class="note">${esc(c.micErr)}</p>`;
    bar += `<div class="row" style="gap:14px;justify-content:center;flex-wrap:wrap;margin-top:6px">`;
    if(SRC && !micBlocked) bar += `<button class="link" data-act="chattoggle">${c.typing?"🎙️ Hablar":"⌨️ Escribir"}</button>`;

function chatMic(append){
  if(Mic.on){ Mic.stop(); return; }
  chat.heard = null;
  const prev = append && chat.pending ? chat.pending : null;
  const ok = Mic.start({ long:false,
    onResult: alts => { chat.heard = alts; },
    onError: code => { chat.micErr = MIC_ERR[code] || MIC_ERR.start; if(micBlocked) chat.typing = true; },
    onEnd: () => { chat.listening = false; if(view!=="chat") return;
      if(chat.heard && chat.heard[0]){
        /* no se envía solo: se muestra lo que hemos entendido para que el alumno lo revise y lo envíe */
        if(prev){ const base = prev.text.trim(); chat.pending = {alts: chat.heard.map(h=>base+" "+h), text: base+" "+chat.heard[0], orig: base+" "+chat.heard[0], edited: prev.text.trim()!==prev.orig.trim()}; }
        else chat.pending = {alts: chat.heard, text: chat.heard[0], orig: chat.heard[0], edited:false};
      } else if(prev) chat.pending = prev;
      render(); scrollChat(); } });
  chat.listening = ok; if(ok) chat.micErr = null; else chat.typing = true;
  render();
}
function chatConfirm(){
  const t = $("#chatheard"), p = chat.pending; if(!p) return;
  const text = (t ? t.value : p.text).trim(); if(!text) return;
  chat.pending = null;
  const same = !p.edited && text.replace(/\s+/g," ")===p.orig.trim().replace(/\s+/g," ");
  chatSubmit(same ? p.alts : [text], same);
}
function chatSubmit(cands, voice=false){
  cands = cands.map(s=>String(s||"").trim()).filter(Boolean); if(!cands.length) return;
  chat.voice = voice; chat.pending = null;
  chat.draft = ""; chat.micErr = null;
  chat.log.push({who:"me", text:cands[0]}); chat.last = cands;
  if(chat.mode==="free") return freeTurn();
  const turn = chat.sc.turns[chat.i];
  if(cands.some(c => turn.k.every(g=>hasKeyword(c,g)))) return guidedOk(cands[0]);
  chat.tries++;
  if(chat.tries>=2){ chat.log.push({who:"note", ok:false, html:`${fb("oneWay")}: <b>${esc(turn.m)}</b> ${spk(turn.m)}${noteWhy(turn.m)}${chatPron(turn)}`}); record("conv",false); nextTurn(); }
  else chat.log.push({who:"note", ok:false, html:`${esc(fb("almost"))}${chatPron(turn)}${AI?` <button class="link" data-act="chatai">¿Mi frase vale? Preguntar a Claude</button>`:""}`});
  render(); scrollChat();
}
function guidedOk(text){
  const turn = chat.sc.turns[chat.i], first = chat.tries===0 && !chat.peek;
  if(first) chat.score++;
  record("conv", first); addXP(first?20:0);
  chat.log.push({who:"note", ok:true, html:`✓ ${fb("good")}${sim(text,turn.m)<0.9?` ${fb("other")}: <b>${esc(turn.m)}</b> ${spk(turn.m)}`:""}${noteWhy(turn.m)}${chatPron(turn)}`});
  nextTurn(); render(); scrollChat();
}
function nextTurn(){
  chat.i++; chat.tries=0; chat.peek=false;
  if(chat.i < chat.sc.turns.length){ const b = chat.sc.turns[chat.i].b; chat.log.push({who:"bot", text:b}); setTimeout(()=>speak(b), 350); }
  else { chat.done = true; if(typeof taskHook==="function") taskHook("scenario", chat.sc.id); addXP(chat.score/chat.sc.turns.length>=0.6 ? 30 + (chat.score===chat.sc.turns.length?20:0) : 0); save(); }
}
async function chatAIcheck(){
  if(!AI || !chat.last || chat.busy) return;
  const turn = chat.sc.turns[chat.i];
  chat.busy = true; render(); scrollChat();
  const prompt = `You are a friendly English teacher. In a role-play (${chat.sc.title}), the other person says: "${turn.b}". The student's goal is: "${inEn()?turn.tE:turn.t}".
The student said: "${chat.last[0]}"
Did the student achieve the goal with understandable, reasonably correct English? Other natural wordings are fine.
Reply with JSON only, no markdown: {"correct": true or false, "feedback": "one short sentence in ${expLang()}", "better": "a natural way to say it"}`;
  try{
    const j = await aiJSON(prompt,"quick");
    chat.busy = false;
    if(j && j.correct===true){ chat.log.push({who:"note", ok:true, html:`Claude la da por buena. ${esc(j.feedback||"")}`}); chat.tries = 0; guidedOk(chat.last[0]); return; }
    chat.log.push({who:"note", ok:false, html:`${esc((j&&j.feedback)||"No termina de cumplir el objetivo.")}${j&&j.better?` Prueba: <b>${esc(j.better)}</b> ${spk(j.better)}`:""}`});
  }catch(e){ chat.busy = false; chat.log.push({who:"note", ok:false, html:esc(aiErr(e))}); }
  render(); scrollChat();
}
function transcript(){ return chat.log.filter(m=>m.who!=="note").slice(-20).map(m=>(m.who==="bot"?"Character":"Student")+": "+m.text).join("\n"); }
async function freeTurn(){
  chat.userTurns++; chat.busy = true; render(); scrollChat();
  const L = lvlCode();
  const prompt = `You are role-playing to help a Spanish speaker practise conversational English (CEFR level ${L}).
You are ${chat.sc.role}. The student is ${chat.sc.you}. Stay in character and never mention that you are an AI or a teacher.
Conversation so far:
${transcript()}

1. Reply in character with one or two short, natural sentences suited to level ${L}. Keep the conversation going, usually with a question.
2. Check the student's last message for grammar or vocabulary mistakes or clearly unnatural phrasing.
Return JSON only, no markdown: {"reply": "your in-character reply", "correction": "a short explanation in ${expLang()} of the main mistake, or an empty string if there was none", "better": "a more natural version of the student's last message, or an empty string if it was already natural", "end": false}
Set "end" to true only if the conversation has clearly reached its natural end.`;
  try{
    const j = await aiJSON(prompt,"quick");
    const fixed = !!(j.correction && j.correction.trim());
    if(fixed || (j.better && sim(j.better, chat.last[0])<0.9)) chat.log.push({who:"note", ok:!fixed, html:`${fixed?"💡 "+esc(j.correction):"✓ Se entiende bien."}${j.better?` Más natural: <b>${esc(j.better)}</b> ${spk(j.better)}`:""}`});
    if(j.reply){ chat.log.push({who:"bot", text:j.reply}); setTimeout(()=>speak(j.reply), 200); }
    record("conv", !fixed); addXP(fixed?3:12); save();
    chat.busy = false;
    if(j.end || chat.userTurns>=10){ render(); return endFree(); }
  }catch(e){ chat.busy = false; chat.log.push({who:"note", ok:false, html:esc(aiErr(e))}); }
  render(); scrollChat();
}
async function endFree(){
  Mic.abort();
  chat.done = true; chat.final = {loading:true}; render(); scrollChat();
  const prompt = `You are an English speaking coach. Below is a role-play between a Spanish-speaking learner (CEFR level ${lvlCode()}), labelled Student, and a character (${chat.sc.role}).
${transcript()}

Return JSON only, no markdown: {"score": integer 1-10, "summary": "two sentences in ${expLang()} on how the student did", "tips": ["up to 3 short, concrete tips in ${expLang()}"], "phrases": ["3 useful English phrases for this kind of conversation"]}`;
  try{ const j = await aiJSON(prompt,"default"); chat.final = Object.assign({ai:true}, j); addXP(Math.round(4*Math.min(10, +j.score||0))); save(); }
  catch(e){ chat.final = {err: aiErr(e)}; }
  if(view==="chat") { render(); scrollChat(); }
}

  h += `<div class="panel sec"><h2>Curiosidades</h2><p class="muted small" style="margin-top:6px">Has descubierto ${S.facts.length} de ${FACTS.length}. Aparecen al terminar algunos retos diarios.</p>

  const se = S.settings, opt = (v,l,cur) => `<option value="${v}" ${cur===v?"selected":""}>${l}</option>`;

const TAB_VIEWS = ["home","talk","games","progress"];

  applyTheme();

    deck:renderDeck, flash:renderFlash, memory:renderMemory, timed:renderTimed, radio:renderRadio, chat:renderChat, ivintro:renderIvIntro, interview:renderInterview, writer:renderWriter, ...(typeof EXTRA_VIEWS!=="undefined"?EXTRA_VIEWS:{})};

  pick: b => { const ex=cur(); if(sess.st.checked) return; sess.st.answer = ex.opts[+b.dataset.i]; render(); },
  word: b => { sess.st.built.push(+b.dataset.i); render(); },

  cont: () => doContinue(false),
