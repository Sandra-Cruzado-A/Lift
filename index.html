<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="description" content="Aprende inglés hablando: conversaciones, entrevistas de trabajo, escritura y retos diarios.">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lift: inglés para hablar con soltura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7F0FF; --surface:#FFFFFF; --surface2:#F2F6FF; --ink:#0F1B4C; --muted:#56628F; --line:#CAD7F3;
  --accent:#FF5A1F; --accent-press:#E24812; --on-accent:#FFFFFF; --sun:#FFC928;
  --ok:#0E9F6E; --ok-bg:#DBF5E9; --bad:#D92D4B; --bad-bg:#FDE3E8; --chip:#E9F0FF; --focus:#2B6BFF; --deep:#0F1B4C;
  --wide:125%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1130; --surface:#141D46; --surface2:#19245A; --ink:#EAF0FF; --muted:#A6B2DD; --line:#27336B;
    --chip:#1C2860; --ok-bg:#0E3A2D; --bad-bg:#4A1624; --focus:#8DB2FF; --deep:#26358A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1130; --surface:#141D46; --surface2:#19245A; --ink:#EAF0FF; --muted:#A6B2DD; --line:#27336B;
  --chip:#1C2860; --ok-bg:#0E3A2D; --bad-bg:#4A1624; --focus:#8DB2FF; --deep:#26358A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
h1,h2,h3{font-stretch:var(--wide);line-height:1.1;margin:0}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.wrap{max-width:540px;margin:0 auto;padding:14px 16px 110px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.brand{font-stretch:var(--wide);font-weight:900;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:27px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:700}
.streak.off{color:var(--muted)}

/* progress card with bubbles */
.prog-card{background:var(--surface);border-radius:22px;padding:10px 10px 14px;border:1px solid var(--line)}
.band{background:var(--deep);border-radius:16px;padding:14px 6px 6px}
.bubbles{display:block;width:100%;height:auto}
.prog-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 6px 0}
.lvl-code{font-stretch:var(--wide);font-weight:900;font-size:2.1rem;line-height:1}
.lvl-name{font-weight:600}
.xp{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:10px 6px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}

/* sections */
.sec{margin-top:18px}
.panel{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line)}
.panel+.panel{margin-top:12px}
.daily{background:var(--deep);color:#fff;border:0;position:relative;overflow:hidden}
.daily .muted{color:#C3CCF2}
.daily h2{font-size:1.45rem}
.daily .chips{margin:12px 0 16px}
.daily .chip{background:rgba(255,255,255,.12);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8125rem;font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;
  font-weight:800;font-stretch:var(--wide);font-size:1rem;background:var(--accent);color:var(--on-accent);transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97);background:var(--accent-press)}
.btn:disabled{background:var(--line);color:var(--muted)}
.btn.ghost:disabled{background:transparent;opacity:.45}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:inherit;border:2px solid var(--line)}
.btn.ghost:active{background:var(--chip)}
.daily .btn.ghost{border-color:rgba(255,255,255,.3)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.875rem;border-radius:10px}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:var(--chip);font-size:1.1rem;flex:none}

/* word of the day */
.wod-word{font-stretch:var(--wide);font-weight:800;font-size:1.35rem}

/* games */
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.game:active{transform:scale(.98)}
.gi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--chip)}
.game .gi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;margin-bottom:4px}
.game h3{font-size:1rem;margin-bottom:3px}
.game p{font-size:.85rem;color:var(--muted)}
.game.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.game.locked{opacity:.55}

/* session */
.sess{max-width:600px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:10px 16px 0}
.sess-top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:9px;background:var(--line)}
.segs i.done{background:var(--ok)}
.segs i.miss{background:var(--bad)}
.segs i.cur{background:var(--accent)}
.sess-body{flex:1;padding-bottom:24px}
.q-tag{display:inline-flex;gap:6px;align-items:center;font-size:.8125rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.q-title{font-size:1.2rem;font-weight:700;margin-bottom:14px}
.big{font-stretch:var(--wide);font-weight:800;font-size:1.55rem;line-height:1.15;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sentence{font-size:1.25rem;font-weight:600;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.sentence mark{background:var(--sun);color:#0F1B4C;border-radius:6px;padding:0 4px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);margin:0 2px}
.sub{color:var(--muted);margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;font-size:1.02rem;min-height:54px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.inp{width:100%;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;resize:vertical;min-height:56px}
.inp:focus{outline:none;border-color:var(--accent)}
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:14px;border:2px dashed var(--line);margin-bottom:14px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.w{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;font-size:1.02rem}
.w.used{visibility:hidden}
.mic{width:100%;min-height:120px;border-radius:22px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700}
.mic .dot{width:58px;height:58px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:1.6rem}
.mic.on{border-color:var(--accent)}
.mic.on .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.heard{margin-top:12px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.note{font-size:.875rem;color:var(--muted);margin-top:10px}
.bar-actions{position:sticky;bottom:0;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.fb{border-radius:16px;padding:14px 16px;margin-bottom:12px}
.fb.ok{background:var(--ok-bg)}
.fb.bad{background:var(--bad-bg)}
.fb h3{margin-bottom:4px}
.fb.ok h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p+p{margin-top:6px}
.ai-out{margin-top:8px;font-size:.92rem}

/* summary */
.summary{text-align:left}
.result-num{font-stretch:var(--wide);font-weight:900;font-size:2.6rem;line-height:1}
.fact{background:var(--sun);color:#0F1B4C;border-radius:20px;padding:18px}
.fact h3{font-size:1.1rem;margin-bottom:6px}
.miss-list{display:grid;gap:8px}
.miss-list div{background:var(--surface2);border-radius:12px;padding:10px 12px}

/* flashcards */
.card-wrap{perspective:1200px;margin:10px 0 18px}
.fcard{position:relative;width:100%;min-height:260px;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface)}
.face.back{transform:rotateY(180deg);background:var(--deep);color:#fff}
.face .word{font-stretch:var(--wide);font-weight:900;font-size:1.8rem;line-height:1.1}
.face.back .muted{color:#C3CCF2}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{font-size:.92rem;aspect-ratio:1/1.05;border-radius:16px;background:var(--deep);color:#fff;font-weight:700;font-size:.92rem;padding:8px;display:grid;place-items:center;text-align:center;line-height:1.2;transition:transform .2s}
.mc.open{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.mc.en.open{font-stretch:var(--wide);font-weight:800}
.mc.done{background:var(--ok-bg);color:var(--ink);border:2px solid var(--ok)}
.mc.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* progress */
.lights{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:12px}
.lights i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.lights i.on{background:var(--sun);box-shadow:0 0 8px color-mix(in srgb,var(--sun) 70%,transparent)}
.lights i.today{outline:2px solid var(--accent);outline-offset:1px}
.topic{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.topic .bar{margin:6px 0 4px;height:8px}
.topic b{display:block;line-height:1.2}
.topic .bar>i{background:var(--ok)}
.topic .bar.mid>i{background:var(--sun)}
.topic .bar.low>i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi b{display:block;font-stretch:var(--wide);font-weight:900;font-size:1.5rem}
.kpi span{font-size:.8rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.facts-list{display:grid;gap:10px;margin-top:10px}
.facts-list div{background:var(--surface2);border-radius:12px;padding:12px}
select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px}
input[type=range]{width:100%;accent-color:var(--accent)}


/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:18px}
.chat.mini{padding-bottom:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.4;display:flex;align-items:flex-start;gap:8px}
.msg>span{flex:1}
.msg .icon-btn{width:34px;height:34px;font-size:.95rem;margin:-4px -6px -4px 0}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;font-size:1.08rem;font-weight:600}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px;font-weight:600}
.msg.note{align-self:stretch;max-width:100%;display:block;font-size:.92rem;border-radius:14px;padding:10px 12px}
.msg.note.ok{background:var(--ok-bg)}
.msg.note.bad{background:var(--bad-bg)}
.msg.note .icon-btn{width:30px;height:30px;font-size:.85rem;vertical-align:middle;margin:0 0 0 4px}
.msg.note .link{padding:2px 0;display:inline}
.msg .who{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.msg.typing{color:var(--muted);font-style:italic;font-weight:500}
.goal{background:color-mix(in srgb,var(--sun) 35%,var(--surface));color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:12px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer .inp{min-height:52px;font-size:1.05rem;padding:12px}
.composer .btn{flex:none}
.bar-actions .mic{min-height:96px}
.grow{flex:1;min-width:0}
.sess-top .grow b{display:block;line-height:1.2}

/* lists */
.list{padding:4px 12px}
.list-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row b{display:block;line-height:1.25}
.list-row .gi{width:40px;height:40px;font-size:1.25rem;border-radius:12px}
.list-row>span:last-child{color:var(--muted);font-size:1.4rem}
.talk-card .gi{width:48px;height:48px}

/* writing and interview */
.checks{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.checks li{font-weight:600;font-size:.95rem}
.checks li.ok{color:var(--ok)}
.checks li.bad{color:var(--bad)}
.tip{background:var(--surface2);border-radius:12px;padding:8px 12px}
.tip p{margin-top:4px;font-size:.95rem}
.chip-btn{border:1px solid var(--line);text-align:left;font-weight:600;padding:6px 10px}
.fb.neutral{background:var(--surface2);border:1px solid var(--line)}
.errs{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:.92rem}
label.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* onboarding */
.hero-title{font-size:2.1rem;font-weight:900;margin:18px 0 10px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
.timer{font-stretch:var(--wide);font-weight:900;font-size:1.6rem;font-variant-numeric:tabular-nums}
.flash-ok{animation:fok .35s}
.flash-bad{animation:fbad .35s}
@keyframes fok{0%{background:var(--ok-bg)}}
@keyframes fbad{0%{background:var(--bad-bg)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:600px){ .games{grid-template-columns:1fr 1fr 1fr} .game.wide{grid-column:1/-1} }

/* explicaciones */
.gloss{display:block;font-size:.82rem;font-weight:500;color:var(--muted);margin-top:4px;font-stretch:normal}
.why{margin-top:10px;padding:10px 12px;border-radius:12px;background:color-mix(in srgb,var(--surface) 70%,transparent);border:1px solid var(--line)}
.why b{display:block;font-size:.85rem;margin-bottom:4px}
.why ul{margin:0;padding-left:18px;display:grid;gap:4px;font-size:.93rem;line-height:1.4}
.why-inline{display:grid;gap:4px;margin-top:6px;font-size:.88rem}
.fcard .face.back p{font-size:.92rem;line-height:1.4}

/* pronunciación */
.ipa{font-family:"Charis SIL","Doulos SIL","Gentium Plus","Noto Sans","Segoe UI",system-ui,sans-serif;color:var(--muted);font-size:.95rem;letter-spacing:.01em}
.big-ipa{font-size:1.1rem;margin:-4px 0 6px}
.fcard .face.front .ipa{display:block;margin:4px 0 10px;font-size:1.05rem}
.pron{margin-top:10px;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:color-mix(in srgb,var(--surface) 70%,transparent)}
.pron > b{display:block;font-size:.85rem;margin-bottom:6px}
.pwords{line-height:2;margin:0 0 4px}
.pw{padding:2px 6px;border-radius:8px;font-weight:600}
.pw.ok{background:color-mix(in srgb,#1a9e6a 16%,transparent);color:inherit}
.pw.bad{background:color-mix(in srgb,#e0344f 18%,transparent);color:inherit;text-decoration:underline wavy color-mix(in srgb,#e0344f 70%,transparent);text-underline-offset:4px}
.pword{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line)}
.pword ul{margin:4px 0 0;padding-left:18px;display:grid;gap:3px;font-size:.92rem}
.icon-btn.sm{width:34px;height:34px;font-size:.95rem}
.msg.note .pron{background:transparent}
.pron > .pword:first-child{border-top:0;padding-top:0;margin-top:0}

/* confirmar lo dicho antes de enviar */
.heard-card{padding:12px;border-radius:14px;border:1px solid var(--line);background:var(--surface);margin-top:8px}
.heard-card textarea{margin-top:6px;font-size:1.05rem}
.time-inp{width:auto;min-width:120px;padding:8px 10px;font-size:1.05rem}

/* resumen: tus respuestas */
.ans-your.bad{color:var(--bad);font-weight:600}
.ans-your.ok{color:var(--ok);font-weight:600}
.ans-mark{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:50%;font-size:.8rem;font-weight:800;margin-right:8px;vertical-align:middle}
.ans-mark.ok{background:var(--ok-bg);color:var(--ok)}
.ans-mark.bad{background:var(--bad-bg);color:var(--bad)}
.ans-mark.skip{background:var(--line);color:var(--muted)}
.all-answers summary{cursor:pointer;list-style:none}
.all-answers summary::after{content:" ▾";color:var(--muted)}
.all-answers[open] summary::after{content:" ▴"}

/* canciones de la radio (LyricsTraining) */
a.btn{display:inline-flex;align-items:center;justify-content:center;text-decoration:none}
a.btn.full{display:flex}
.radio-link{font-size:.92rem;text-decoration:none}
</style>
</head>
<body>

  {s:"___ (do) he live near here?",a:["does"],o:["Does","Do","Is","Has"],l:1,x:"Pregunta en presente simple con he/she/it: Does + sujeto + verbo en forma base, sin -s (Does he live…?, no «Does he lives…?»).",xe:"Present simple question with he/she/it: Does + subject + base verb, with no -s (Does he live…?, not 'Does he lives…?')."},
  {s:"Yesterday we ___ (go) to the beach.",a:["went"],o:["went","go","goed","gone"],l:1,x:"«Go» es irregular: go – went – gone. El pasado simple es igual para todas las personas.",xe:"Go is irregular: go – went – gone. The past simple is the same for every person."},
  {s:"Look! It ___ (rain).",a:["is raining","'s raining"],o:["is raining","rains","rain","raining"],l:1,x:"Presente continuo (am/is/are + -ing) para algo que está pasando justo ahora. «Look!» indica que ocurre en este momento.",xe:"Present continuous (am/is/are + -ing) for something happening right now. 'Look!' tells you it's happening at this moment."},
  {s:"I ___ (never / be) to New York.",a:["have never been","'ve never been"],o:["have never been","never was","have never went","never be"],l:2,x:"Present perfect para experiencias: have + participio. Be es irregular: be – was/were – been. «Never» va entre have y el participio.",xe:"Present perfect for life experiences: have + past participle. Be is irregular: be – was/were – been. 'Never' goes between have and the participle."},
  {s:"If it rains, we ___ (stay) at home.",a:["will stay","'ll stay"],o:["will stay","stay","would stay","stayed"],l:2,x:"Primer condicional: if + presente, will + verbo. Se usa para situaciones posibles o probables en el futuro. Después de if no se usa will.",xe:"First conditional: if + present, will + verb. We use it for possible or likely future situations. Don't use will after if."},
  {s:"While I ___ (cook), the phone rang.",a:["was cooking"],o:["was cooking","cooked","am cooking","have cooked"],l:2,x:"Pasado continuo (was/were + -ing) para la acción larga que estaba en curso; pasado simple (rang, de ring – rang – rung) para la acción corta que la interrumpe.",xe:"Past continuous (was/were + -ing) for the longer action in progress; past simple (rang, from ring – rang – rung) for the short action that interrupts it."},
  {s:"We ___ (meet) the client tomorrow. It's all arranged.",a:["are meeting","'re meeting","are going to meet","'re going to meet"],o:["are meeting","meet","met","have met"],l:2,x:"Para planes ya organizados (con hora o lugar fijados) se usa el presente continuo; «going to» también vale para intenciones.",xe:"For fixed arrangements (with a time or place) we use the present continuous; 'going to' also works for plans and intentions."},

  {s:"I ___ (not / finish) the report yet.",a:["haven't finished","have not finished"],o:["haven't finished","didn't finish","don't finish","hasn't finished"],l:2,x:"«Yet» en negativas y preguntas va con present perfect y al final de la frase: I haven't finished yet.",xe:"'Yet' in negatives and questions goes with the present perfect, at the end of the sentence: I haven't finished yet."},
  {s:"If I ___ (have) more time, I would learn the guitar.",a:["had"],o:["had","have","would have","will have"],l:3,x:"Segundo condicional: if + pasado (have – had – had), would + verbo. Sirve para situaciones imaginarias o poco probables.",xe:"Second conditional: if + past simple (have – had – had), would + verb. It's for imaginary or unlikely situations."},
  {s:"The report ___ (write) by my manager last week.",a:["was written"],o:["was written","wrote","is written","has written"],l:3,x:"Pasiva en pasado: was/were + participio. Write es irregular: write – wrote – written. Quien hace la acción se introduce con by.",xe:"Past passive: was/were + past participle. Write is irregular: write – wrote – written. The person who does the action is introduced with by."},
  {s:"I ___ (wait) for the bus for twenty minutes.",a:["have been waiting","'ve been waiting"],o:["have been waiting","am waiting","wait","was waiting"],l:3,x:"Present perfect continuous (have/has been + -ing): la acción empezó en el pasado, sigue ahora y se destaca la duración.",xe:"Present perfect continuous (have/has been + -ing): the action started in the past, is still going on, and we focus on how long."},
  {s:"By the time we arrived, the film ___ (start).",a:["had started"],o:["had started","started","has started","was starting"],l:3,x:"Past perfect (had + participio): una acción ocurrió antes que otra del pasado. Cuando llegamos, la película ya había empezado.",xe:"Past perfect (had + past participle): one action happened before another past action. When we arrived, the film had already started."},
  {s:"She told me she ___ (be) tired.",a:["was"],o:["was","is","has been","be"],l:3,x:"En estilo indirecto el verbo retrocede un tiempo: «I am tired» → She told me she was tired.",xe:"In reported speech the verb moves one tense back: 'I am tired' → She told me she was tired."},
  {s:"We ___ (use to) live in Madrid, but now we live in Valencia.",a:["used to"],o:["used to","use to","were used to","usually"],l:3,x:"«Used to» + infinitivo describe hábitos o situaciones del pasado que ya no ocurren. No confundir con «be used to + -ing» (estar acostumbrado).",xe:"'Used to' + base verb describes past habits or situations that no longer happen. Don't confuse it with 'be used to + -ing' (to be accustomed to)."},
  {s:"If I had left earlier, I ___ (not / miss) the train.",a:["wouldn't have missed","would not have missed"],o:["wouldn't have missed","won't miss","didn't miss","wouldn't miss"],l:4,x:"Tercer condicional: if + had + participio, would have + participio. Habla de un pasado imaginario que ya no se puede cambiar.",xe:"Third conditional: if + had + past participle, would have + past participle. It's about an imaginary past that can't be changed."},
  {s:"All the documents ___ (must / sign) before Friday.",a:["must be signed"],o:["must be signed","must sign","must be sign","must to sign"],l:4,x:"Pasiva con verbo modal: modal + be + participio (must be signed, can be done). El modal nunca lleva to.",xe:"Passive with a modal verb: modal + be + past participle (must be signed, can be done). Modals are never followed by to."},
  {s:"By next year, I ___ (finish) my degree.",a:["will have finished","'ll have finished"],o:["will have finished","will finish","finish","am finishing"],l:4,x:"Futuro perfecto: will have + participio. Indica que algo estará terminado antes de un momento futuro (by next year).",xe:"Future perfect: will have + past participle. Something will be finished before a point in the future (by next year)."},
  {s:"I wish I ___ (study) harder at school.",a:["had studied","'d studied"],o:["had studied","studied","would study","have studied"],l:4,x:"Wish + past perfect expresa un lamento sobre el pasado: I wish I had studied = ojalá hubiera estudiado.",xe:"Wish + past perfect expresses regret about the past: I wish I had studied = I regret that I didn't study."},
  {s:"The new law is said ___ (be) very popular.",a:["to be"],o:["to be","being","be","that is"],l:4,x:"Pasiva impersonal: is said/thought/believed + to + infinitivo. Es muy común en noticias y textos formales.",xe:"Impersonal passive: is said/thought/believed + to + infinitive. It's very common in news and formal writing."},
  {s:"Had I known about the traffic, I ___ (take) the train.",a:["would have taken","'d have taken"],o:["would have taken","would take","had taken","will take"],l:5,x:"Inversión del tercer condicional: «Had I known» = «If I had known». Es más formal; la otra parte sigue siendo would have + participio (take – took – taken).",xe:"Inverted third conditional: 'Had I known' = 'If I had known'. It's more formal; the other part is still would have + past participle (take – took – taken)."},
  {s:"It's high time we ___ (book) our holidays.",a:["booked"],o:["booked","book","will book","have booked"],l:5,x:"«It's high time» + sujeto + pasado simple, aunque hablemos del presente: indica que algo ya debería haberse hecho.",xe:"'It's high time' + subject + past simple, even though we mean now: something should already have happened."},

  {s:"Rarely ___ (have) I seen such a beautiful place.",a:["have"],o:["have","I have","did","had been"],l:5,x:"Inversión tras adverbios negativos (rarely, never, seldom): adverbio + auxiliar + sujeto. Es formal y enfático.",xe:"Inversion after negative adverbs (rarely, never, seldom): adverb + auxiliary + subject. It's formal and emphatic."}

   m:"What attracts me most is the combination of hands-on engineering and technology evaluation. I enjoy digging into technical data and testing things myself, and I like the idea that my work would directly shape the materials and components your platforms are built with. High-altitude platforms are a genuinely new kind of infrastructure, and I'd love to help turn promising technologies into proven engineering capability."},
  {q:"How would you evaluate a new material or component?",l:3,
   tip:"Describe un proceso claro y ordenado: requisitos, revisión del datasheet, contraste con otras fuentes, muestras, ensayos propios, decisión y registro en el catálogo.",
   tipE:"Describe a clear, ordered process: requirements, datasheet review, cross-checking, samples, in-house tests, decision and a catalogue entry.",
   p:["First, I'd start from the requirements.","Then I'd compare the datasheet with…","Finally, I'd record the results in…"],
   m:"First, I'd start from the requirements: what the part has to do, in what environment, and what margins we need. Then I'd review the datasheet and the test conditions behind each figure, and compare them with independent data. If it looks promising, I'd order samples, test them in-house under realistic conditions and compare the results with the manufacturer's claims. Finally, I'd record everything in the catalogue, so the team can make a quick, informed decision."},
  {q:"How do you tell the difference between engineering reality and marketing claims?",l:3,
   tip:"Demuestra que miras las condiciones de cada dato (temperatura, velocidad de descarga, tamaño de muestra), si es un valor típico o garantizado, y que contrastas o ensayas cuando importa.",
   tipE:"Show that you check the conditions behind each figure (temperature, discharge rate, sample size), whether it's typical or guaranteed, and that you cross-check or test when it matters.",
   p:["I always look at the conditions behind the numbers.","Is this a typical or a guaranteed value?","When it matters, I test it myself."],
   m:"I always look at the conditions behind the numbers. For example, a battery might only reach its specific energy at a low discharge rate and room temperature, which isn't our case at high altitude. So I ask the supplier for the full test data, check whether the figures are typical or guaranteed, compare them with independent sources and, when it matters, test the samples myself."},
  {q:"Tell me about a time when test results didn't match the supplier's data.",l:3,
   tip:"Usa el método STAR: situación, tarea, acción y resultado. Explica cómo comprobaste primero tu propio ensayo y cómo lo resolviste con el proveedor. Cámbialo por un caso real tuyo.",
   tipE:"Use the STAR method: situation, task, action and result. Explain how you checked your own test first and how you solved it with the supplier. Replace it with a real case of yours.",
   p:["In a previous project, we were evaluating…","The results were about … lower.","It turned out that…"],
   m:"In a previous project, we were evaluating a component whose datasheet showed very good performance. When we tested the samples, the results were about fifteen percent lower. I checked our test setup first, then shared the data with the supplier and asked for their test conditions. It turned out that they had tested at a different temperature. We agreed on new tests under our conditions and added the corrected values to our internal database."},
  {q:"How would you build good relationships with specialist suppliers?",l:2,
   tip:"Habla de claridad, fiabilidad y trato justo: explicar bien los requisitos, compartir resultados de ensayos, cumplir lo prometido y visitarles en persona.",
   tipE:"Talk about clarity, reliability and fairness: explain your requirements well, share test results, keep your promises and visit them in person.",
   p:["It's about being clear and reliable.","I'd share feedback from our tests.","Visiting suppliers in person helps a lot."],
   m:"I think it's about being clear, reliable and fair. I'd explain our requirements and constraints honestly, share feedback from our tests and keep my commitments. Visiting suppliers in person also helps a lot, because you understand their processes and they understand what we really need."},
  {q:"How would you organise a technical catalogue that the whole team can trust?",l:3,
   tip:"La palabra clave es trazabilidad: cada valor con su fuente, sus condiciones de ensayo y si lo habéis verificado vosotros.",
   tipE:"The key word is traceability: every value with its source, its test conditions and whether you've verified it yourselves.",
   p:["I'd use the same structure for every entry.","The source of each value","Anyone should be able to see where a number comes from."],
   m:"I'd use the same structure for every entry: key specifications, the source of each value, the test conditions and whether we have verified it ourselves. I'd also record the supplier, the lead time and the status, and review the catalogue regularly. The most important thing is traceability: anyone should be able to see where a number comes from."},
  {q:"Which of our technology areas do you know best?",l:2,
   tip:"Sé sincero: elige tu área más fuerte (materiales, composites, baterías, fotovoltaica o propulsión eléctrica), da un ejemplo y muestra ganas de aprender las demás. Adapta el ejemplo a tu experiencia.",
   tipE:"Be honest: pick your strongest area (materials, composites, batteries, photovoltaics or electric propulsion), give an example and show you're keen to learn the others. Adapt the example to your experience.",
   p:["My strongest area is…","I'm also familiar with…","I learn quickly when…"],
   m:"My strongest area is composite materials: I've worked with carbon fibre parts and their testing. I'm also familiar with batteries and solar cells at system level, and I learn quickly when I have a clear goal. In this role, I'd start by understanding the key requirements of each subsystem and the main trade-offs between them."},
  {q:"What challenges do materials and components face at high altitude?",l:4,
   tip:"Menciona el entorno: frío extremo, ciclos térmicos día-noche, baja presión y radiación UV, y cómo afectan a composites, adhesivos, recubrimientos y baterías.",
   tipE:"Mention the environment: extreme cold, day-night thermal cycling, low pressure and UV radiation, and how they affect composites, adhesives, coatings and batteries.",
   p:["Materials have to cope with…","That can affect…","Qualification tests should reproduce…"],
   m:"At high altitude, materials have to cope with very low temperatures, large thermal cycles between day and night, low pressure and strong UV radiation. That can affect composites, adhesives and coatings, and the cold also reduces battery performance. So qualification tests should reproduce those conditions as closely as possible."},
  {q:"How would you decide which technologies to evaluate first?",l:3,
   tip:"Prioriza por impacto y riesgo, y acuérdalo con los equipos de ingeniería.",
   tipE:"Prioritise by impact and risk, and agree the priorities with the engineering teams.",
   p:["I'd prioritise by impact and risk.","The components that limit performance the most","I'd review the priorities regularly."],
   m:"I'd prioritise by impact and risk: which components limit the platform's performance the most, such as energy storage or solar cells, and which ones have the most uncertain data. I'd agree the priorities with the engineering teams and review them regularly as the design evolves."},
  {q:"How would you work with the workshop and electrical teams?",l:2,
   tip:"Muestra que te gusta el trabajo práctico, que implicas al taller desde el principio y que combinas datos con experiencia práctica.",
   tipE:"Show that you like hands-on work, involve the workshop from the start and combine data with practical experience.",
   p:["I'd work side by side with them.","I'd involve them early.","I'm comfortable getting my hands dirty."],
   m:"I'd work side by side with them. They know the practical problems, so I'd involve them early when we plan tests, agree on what we want to measure and review the results together. I'm comfortable getting my hands dirty, and I think the best decisions come from combining data with practical experience."},
  {q:"Are you comfortable working full time on site and travelling to visit suppliers?",l:1,
   tip:"Respuesta corta y clara: sí, y por qué te gusta trabajar cerca del taller.",
   tipE:"Keep it short and clear: yes, and why you like working close to the workshop.",
   p:["Yes, absolutely.","I prefer working on site.","I'm happy to travel."],
   m:"Yes, absolutely. I prefer working on site, close to the workshop and the technical teams, and I'm happy to travel, including abroad, to visit suppliers and partners."},
  {q:"Tell me about a time you had to make a technical decision with incomplete information.",l:4,
   tip:"Método STAR: qué sabías y qué no, cuál era el mayor riesgo, qué hiciste para reducirlo y el resultado. Usa un caso real tuyo.",
   tipE:"STAR method: what you knew and didn't know, the biggest risk, what you did to reduce it and the result. Use a real case of yours.",
   p:["We had to choose between…","I identified the biggest risk.","We chose the option with…"],
   m:"In a previous project, we had to choose between two components before full test data was available. I listed what we knew and what we didn't, identified the biggest risk and ran a quick test to reduce it. We chose the option with the best margin and kept a backup plan. Later tests confirmed the decision."},
  {q:"What would you do in your first three months?",l:3,
   tip:"Estructura en tres pasos: conocer equipos y requisitos, revisar el catálogo y detectar huecos, y tener un plan de evaluación con las primeras muestras.",
   tipE:"Use three steps: get to know the teams and requirements, review the catalogue and find the gaps, and have an evaluation plan with the first samples.",
   p:["First, I'd get to know…","Then I'd review…","By the end of the third month, I'd like to…"],
   m:"First, I'd get to know the teams, the platform and the key requirements. Then I'd review the current catalogue and identify the gaps and the components with the least verified data. By the end of the third month, I'd like to have a clear evaluation plan and the first samples in testing."},

   tip:"Resume en tres puntos lo que aportas: base técnica, rigor con los datos y trato con proveedores o equipos. Termina con tu motivación.",
   tipE:"Sum up what you bring in three points: technical grounding, rigour with data, and working with suppliers or teams. Finish with your motivation.",

function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, r=Math.random){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }

/* ---------- normalización y corrección ---------- */
const SPELL = {colour:"color",fibre:"fiber",aluminium:"aluminum",cancelled:"canceled",metre:"meter",metres:"meters",
  kilometre:"kilometer",kilometres:"kilometers",centre:"center",realise:"realize",organise:"organize",analyse:"analyze",
  programme:"program",grey:"gray",favourite:"favorite",neighbour:"neighbor",behaviour:"behavior",aeroplane:"airplane",
  labour:"labor",modelling:"modeling",travelling:"traveling",defence:"defense",licence:"license",okay:"ok"};
const NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine",
  "10":"ten","11":"eleven","12":"twelve","20":"twenty","30":"thirty"};
function norm(s){
  s = String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”«»"]/g," ");
  s = s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not")
       .replace(/\bshan't\b/g,"shall not").replace(/n't\b/g," not").replace(/\bi'm\b/g,"i am")
       .replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
       .replace(/\blet's\b/g,"let us").replace(/'s\b/g," is");
  s = s.replace(/[^a-z0-9áéíóúñü' ]+/g," ").replace(/'/g,"");
  return s.split(/\s+/).filter(Boolean).map(w => SPELL[w]||NUM[w]||w).join(" ");
}
function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
function isTypo(a,b){
  if(a===b) return true;
  if(Math.min(a.length,b.length)<4) return false;
  const long=a.length>b.length?a:b, short=a.length>b.length?b:a;
  if(long.startsWith(short) && /^(s|es|ed|d|ing)$/.test(long.slice(short.length))) return false;
  return lev(a,b) <= (b.length>=8?2:1);
}
function grade(input, accepted, strict){
  const ni = norm(input);
  if(!ni) return {ok:false,typo:false,best:accepted[0]};
  const wi = ni.split(" ");
  let best=accepted[0], bestD=1e9, typoHit=null;
  for(const a of accepted){
    const na = norm(a);
    if(na===ni) return {ok:true,typo:false,best:a};
    const wa = na.split(" "), d = lev(wi,wa);
    if(d<bestD){ bestD=d; best=a; }
    if(!strict && !typoHit && wa.length===wi.length){
      let diffs=0, good=true;
      for(let k=0;k<wa.length;k++){ if(wa[k]!==wi[k]){ diffs++; if(!isTypo(wi[k],wa[k])){ good=false; break; } } }
      if(good && diffs<=2) typoHit=a;
    }
  }
  if(typoHit) return {ok:true,typo:true,best:typoHit};
  return {ok:false,typo:false,best};
}
function sim(a,b){
  const wa=norm(a).split(" ").filter(Boolean), wb=norm(b).split(" ").filter(Boolean);
  if(!wa.length||!wb.length) return 0;
  return 1 - lev(wa,wb)/Math.max(wa.length,wb.length);
}
function hasKeyword(text, kws){
  const t = " "+norm(text)+" ";
  return kws.some(k => { const n = norm(k); if(!n) return false; if(t.includes(" "+n+" ")) return true;
    const last = n.split(" ").pop(); if(last.length<4) return false;
    return new RegExp(" "+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:s|es|d|ed|ing|er|ers) ").test(t); });
}

function pickItems(spec, L, n, r, used=new Set(), exact=false){
  const [topic, kind] = spec.split(":");
  const pool = (POOL[topic]||[]).filter(it => !used.has(it.id) && (!kind || it.kind===kind));
  let c = pool.filter(it => exact ? it.lvl===L : (it.lvl<=L && it.lvl>=L-1));
  if(c.length<n) c = pool.filter(it => it.lvl<=L);
  if(c.length<n) c = pool.slice();
  const today = todayKey();
  return c.map(it => { const s=S.seen[it.id]; const age = s ? Math.min(30, dayDiff(s,today)) : 40;
      return {it, sc: age + (it.lvl===L?6:0) + r()*8}; })
    .sort((a,b)=>b.sc-a.sc).slice(0,n).map(x=>x.it);
}

function record(topic, ok){
  const s = S.stats[topic] || (S.stats[topic]={c:0,t:0,r:[]});
  s.t++; if(ok) s.c++; s.r.push(ok?1:0); if(s.r.length>20) s.r.shift();
  S.rec = S.rec || []; S.rec.push([S.level, ok?1:0]); if(S.rec.length>40) S.rec.shift();
}
/* ¿El nivel actual es demasiado alto? Mira los últimos ejercicios hechos en este nivel */
function levelStruggle(){
  if(S.level<=1) return null;
  const r = (S.rec||[]).filter(x=>x[0]===S.level); if(r.length<30) return null;
  const a = r.reduce((t,x)=>t+x[1],0)/r.length; return a<0.55 ? a : null;
}
function levelDown(){
  if(S.level<=1) return;
  const to = S.level-1, lo = LEVELS[to-1], hi = LEVELS[to];
  S.level = to; S.xp = Math.min(S.xp, Math.round(lo.xp + (hi.xp-lo.xp)/2));
  S.rec = []; S.lvlSnooze = null; if(S.daily && !S.daily.done) S.daily = null; save();
}
function acc(topic){ const s=S.stats[topic]; if(!s||!s.r.length) return null; return s.r.reduce((a,b)=>a+b,0)/s.r.length; }
function topicOpen(k){ return !(TOPICS[k].min && S.level<TOPICS[k].min) && !(k==="tech" && S.settings.tech==="never"); }
function weakest(){
  let w=null, wa=2;
  for(const k in TOPICS){ if(!topicOpen(k)) continue; const s=S.stats[k]; if(!s||s.r.length<3) continue; const a=acc(k); if(a<wa){ wa=a; w=k; } }
  return wa<0.75 ? w : null;
}
function curStreak(){ if(!S.lastDaily) return 0; return dayDiff(S.lastDaily,todayKey())<=1 ? S.streak : 0; }
function addXP(n){ S.xp = Math.max(0, S.xp+Math.round(n)); }
function checkrideReady(){ return S.level<5 && S.xp>=LEVELS[S.level].xp; }
/* ---------- repaso de fallos, repartido entre los próximos retos ----------
   Cada fallo se guarda con el número de reto a partir del cual puede volver (due) y una caja:
   caja 1 = recién fallado (vuelve en uno de los próximos retos);
   caja 2 = acertado una vez (vuelve unos retos después para confirmarlo y, si se acierta, sale).
   En cada reto entran como mucho REVIEW_CAP repasos, y los más antiguos primero. */
const REVIEW_CAP = 3;
const revDue = v => (v && typeof v==="object") ? v.due : 0;
function reviewSlot(from){
  const count = {}; Object.values(S.review).forEach(v => { const d = revDue(v); count[d] = (count[d]||0)+1; });
  let d = from; while((count[d]||0) >= REVIEW_CAP) d++; return d;
}
function reviewMiss(id){ if(!ITEM[id]) return; delete S.review[id]; S.review[id] = {box:1, due: reviewSlot((S.dn||0)+1)}; }
function reviewHit(id){
  const v = S.review[id]; if(v==null) return;
  delete S.review[id];
  if(typeof v==="object" && v.box===1) S.review[id] = {box:2, due: reviewSlot((S.dn||0)+3)};
}
function dueReview(){ const n = S.dn||0; return Object.keys(S.review).filter(id => ITEM[id] && revDue(S.review[id])<=n).sort((a,b)=>revDue(S.review[a])-revDue(S.review[b])); }
function pendingReview(){ return Object.keys(S.review).filter(id => ITEM[id]).length; }
/* convierte los repasos antiguos (con fecha) al sistema por retos, repartiéndolos */
function migrateReview(){
  if(S.dn==null) S.dn = Object.keys(S.days||{}).length;
  const old = Object.entries(S.review).filter(([,v]) => typeof v!=="object" || v===null);
  if(!old.length) return;
  old.sort((a,b) => String(a[1]).localeCompare(String(b[1])));
  old.forEach(([id]) => delete S.review[id]);
  old.forEach(([id]) => { if(ITEM[id]) S.review[id] = {box:1, due: reviewSlot(S.dn)}; });
  save();
}
function levelPct(xp){
  const cur=LEVELS[S.level-1], next=LEVELS[S.level], top = next ? next.xp : TOP_XP;
  return Math.max(0, Math.min(1, (xp-cur.xp)/(top-cur.xp)));
}

const ES_STOP = new Set(["los","las","del","que","por","para","con","una","uno","unos","unas","sus","muy","como","sin","algo","ante","sobre","entre"]);
function esTokens(t){ return String(t||"").toLowerCase().replace(/\(.*?\)/g," ").split(/[^a-záéíóúüñ]+/).filter(w=>w.length>=3 && !ES_STOP.has(w)); }
function esWords(t){ return String(t||"").toLowerCase().replace(/\(.*?\)/g," ").split(/[^a-záéíóúüñ]+/).filter(w=>w.length>=2); }
function meaningOverlap(a,b){
  let A = esTokens(a), B = esTokens(b);
  if(!A.length || !B.length){ A = esWords(a); B = esWords(b); }
  const set = new Set(A); return B.some(t=>set.has(t));
}
function distract(it, n, field, r){
  const d0 = it.d;
  let pool = shuffle(POOL[it.topic].filter(x => x!==it && x.kind===it.kind), r).slice(0, 500);
  const scored = pool.map(x => { let k = Math.abs(x.lvl-it.lvl);
    if(it.kind==="c"){ if(x.d[4]!==d0[4]) k += 4; k += Math.min(3, Math.abs(x.d[5]-d0[5])/300); }
    else if((it.topic==="tech"||it.topic==="vocab") && it.kind!=="f" && x.d[3]!==d0[3]) k += 3;
    return {x, k: k + r()*1.5}; }).sort((a,b)=>a.k-b.k);
  const out = [], seen = new Set([String(d0[field]).toLowerCase()]);
  for(const {x} of scored){
    const v = x.d[field], lv = String(v).toLowerCase();
    if(seen.has(lv) || String(x.d[0]).toLowerCase()===String(d0[0]).toLowerCase() || meaningOverlap(d0[1], x.d[1])) continue;
    seen.add(lv); out.push(v); if(out.length>=n) break;
  }
  return out;
}

      accepted:uniq([w, w.replace(/^to /,""), "to "+w.replace(/^to /,"")]),sol:`${en} = ${es}`,full:w,ph:tr("La palabra en inglés","The English word")}; }
  if(x<0.32) return {it,type:"mcq",title:"Escucha: ¿qué significa?",titleH:titleHTML("Escucha: ¿qué significa?","Listen: what does it mean?"),audio:true,text:clean(en),sub,

const DAILY_PLANS = {

function planSlots(p, L, r){
  const pick = a => a[Math.floor(r()*a.length)];
  const idiom = () => (L>=2 && r()<0.5) ? "expr" : "phrasal";
  const job = () => offerOn() ? pick(["interview:o","interview:o","interview:q"]) : (L>=2 ? "interview:q" : "write:c");
  switch(p){
    case "talk": return ["vocab:c","conv","speak","conv",idiom(),"ask","conv","pron","listen","speak"];
    case "grammar": return ["vocab:c","verbs","order", L>=2?"conn":"ask","verbs","write:t","ask","conv","verbs","write:t"];
    case "voice": return ["vocab:c","listen","speak","pron","conv","listen","pron","speak","vocab:v","order"];
    case "words": return ["vocab:c","vocab:c","phrasal","vocab:v",idiom(),"vocab:c","conv","write:t","speak", r()<0.4?"vocab:f":"vocab:c"];
    case "work": return [offerOn()?"interview:w":"vocab:v","vocab:c",job(),"conv",offerOn()?"interview:w":"vocab:c","write:c","verbs","speak",job(),"listen"];
    default: return ["vocab:c","verbs","conv",idiom(),"speak",pick(["ask","order","conn","listen"]), r()<0.25?"vocab:f":"vocab:v","write:t","conv",job(),"pron"];
  }
}
/* ordena sin dejar dos ejercicios del mismo tema seguidos; empieza con algo sencillo */
function spreadOrder(ids, r){
  const rest = shuffle(ids.slice(1), r), out = [ids[0]];
  while(rest.length){
    const last = ITEM[out[out.length-1]].topic;
    let k = rest.findIndex(id => ITEM[id].topic!==last); if(k<0) k = 0;
    out.push(rest.splice(k,1)[0]);
  }
  return out;
}
function buildDaily(){
  const key = todayKey();
  if(S.daily && S.daily.date===key && (S.daily.done || S.daily.v===DAILY_V)) return S.daily;
  const r = rng(hashStr(key+"|"+S.level)), L=S.level, used=new Set(), ids=[];
  /* tipo de reto de hoy: distinto al de ayer */
  const plans = Object.keys(DAILY_PLANS).filter(p => p!=="work" || offerOn() || L>=2);
  const prev = S.planLog && S.planLog.date!==key ? S.planLog.p : (S.planLog && S.planLog.prev);
  const avail = plans.filter(p => p!==prev), wt = p => ({mix:1.5, work:0.8}[p] || 1);
  let roll = r()*avail.reduce((t,p)=>t+wt(p),0), plan = avail[avail.length-1];
  for(const p of avail){ roll -= wt(p); if(roll<=0){ plan = p; break; } }
  S.planLog = {date:key, p:plan, prev};
  const base = planSlots(plan, L, r).map(t => t==="pron" ? (micBlocked ? "pron:m" : ["pron:m","pron:w","pron:s"][Math.floor(r()*3)]) : t);
  if(S.settings.tech==="daily" || (S.settings.tech==="some" && r()<0.5)) base.splice(5,0,"tech");
  if(plan!=="work"){ if(offerOn() && r()<0.7) base.splice(2,0,"interview:w"); else if(L>=2 && r()<0.3) base.splice(2,0,"interview:v"); }
  const due = dueReview().slice(0, REVIEW_CAP);
  due.forEach(id=>used.add(id));
  const w = weakest();
  if(w && !due.length && r()<0.6) base.splice(4,0,w);
  /* evita repetir lo que salió en los últimos retos si hay alternativas */
  const recent = new Set((S.recentDaily||[]).flatMap(x => (x && x.ids) || []));
  base.forEach(t => { let it = pickItems(t,L,1,r,new Set([...used, ...recent]))[0] || pickItems(t,L,1,r,used)[0];
    if(it){ used.add(it.id); ids.push(it.id); } });
  const order = spreadOrder(ids, r);
  [2,6,10].forEach((pos,k) => { if(due[k]) order.splice(Math.min(pos, order.length), 0, due[k]); });
  S.recentDaily = [...(S.recentDaily||[]).filter(x => x && x.d && x.d!==key), {d:key, ids:order.slice()}].slice(-3);
  S.daily = {date:key, v:DAILY_V, plan, ids:order, review:due, done:false, score:null, fact:null};
  if(S.dailyRun && S.dailyRun.date!==key) S.dailyRun = null;
  save();
  return S.daily;
}

function isPP(w){ return !!(FORM[w] && FORM[w].pp) || (/^[a-z]{2,}ed$/.test(w) && !NOT_ED.has(w)); }
function isPast(w){ return !!(FORM[w] && FORM[w].past) || (/^[a-z]{2,}ed$/.test(w) && !NOT_ED.has(w)); }
function prepText(t){
  return " " + String(t||"").toLowerCase().replace(/[’`]/g,"'")
    .replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not").replace(/n't\b/g," not")
    .replace(/'ve\b/g," have").replace(/'re\b/g," are").replace(/'m\b/g," am").replace(/'ll\b/g," will").replace(/'d\b/g," 'd").replace(/'s\b/g," 's")
    .replace(/[.,!?;:«»"()]/g," ").replace(/\s+/g," ").trim() + " ";
}

function irregularNotes(s, max){
  const toks = s.trim().split(" "), out = [], seen = new Set();
  for(let i=0;i<toks.length && out.length<max;i++){
    const w = toks[i], f = FORM[w]; if(!f || IRR_SKIP.has(w) || IRREG[w] && !["have","has","had","'d","been"].includes(toks[i-1])) continue;
    if(seen.has(f.b)) continue; seen.add(f.b);
    const [pa,pp] = IRREG[f.b];
    if(f.b==="be"){ if(S.level>2) continue; out.push(w==="been" ? {forms:"be – was/were – been",es:`«been» es el participio de be, un verbo irregular: be – was/were – been.`, en:`"Been" is the past participle of be, an irregular verb: be – was/were – been.`}
      : {forms:"be – was/were – been",es:`«${w}» es el pasado de be: was con I/he/she/it y were con you/we/they (be – was/were – been).`, en:`"${w}" is the past of be: was with I/he/she/it and were with you/we/they (be – was/were – been).`}); continue; }
    const kind = f.past && f.pp ? ["el pasado y el participio","the past simple and past participle"] : f.past ? ["el pasado","the past simple"] : ["el participio","the past participle"];
    out.push({forms:`${f.b} – ${pa}`,es:`«${w}» es ${kind[0]} de ${f.b}, un verbo irregular: ${f.b} – ${pa} – ${pp}.`, en:`"${w}" is ${kind[1]} of ${f.b}, an irregular verb: ${f.b} – ${pa} – ${pp}.`});
  }
  return out;
}
function sentenceNotes(text, itemNote){
  const L = S.level, s = prepText(text), hits = new Set(), off = new Set(), out = [], item = (itemNote||"").toLowerCase();
  for(const r of RULES){
    if(off.has(r.id) || L>r.max) continue;
    let ok = false; try{ ok = r.t(s, String(text||""), hits); }catch(e){}
    if(!ok) continue;
    hits.add(r.id); (r.off||[]).forEach(o=>off.add(o));
    out.push({id:r.id, es:r.es(), en:r.en()});
  }
  const irr = L<=4 && !off.has("irr") ? irregularNotes(s, 2) : [];
  return {rules: out.filter(n => !item || !sameTopic(n.id, item)), irr};
}
function sameTopic(id, item){
  const keys = {cond3:"tercer condicional|third conditional",cond2:"segundo condicional|second conditional",cond1:"primer condicional|first conditional",
    presPerf:"present perfect",ppc:"present perfect continuous",ppPass:"pasiva|passive",pastPerf:"past perfect",passive:"pasiva|passive",passModal:"pasiva|passive",passImp:"pasiva impersonal|impersonal passive",
    presCont:"presente continuo|present continuous",pastCont:"pasado continuo|past continuous",usedTo:"used to",beUsedTo:"used to",lookFwd:"look forward",wish:"wish",
    highTime:"high time|high/about",rather:"rather",inversion:"inver",indirect:"indirecta|indirect",futPerf:"futuro perfecto|future perfect",
    did:"did",doQ:"do/does|does",doNeg:"don't|doesn't",polite:"educad|polite",wouldHave:"would have",forSince:"since",thirdS:"-s",an:"a/an",gerund:"-ing",goingTo:"going to"};
  const k = keys[id]; return !!(k && new RegExp(k).test(item));
}
const POS_NAME = {n:["sustantivo","noun"],v:["verbo","verb"],adj:["adjetivo","adjective"],adv:["adverbio","adverb"],prep:["preposición","preposition"],

  mod:["verbo modal","modal verb"],int:["interjección","interjection"]};
function edForm(w){ if(/e$/.test(w)) return w+"d"; if(/[^aeiou]y$/.test(w)) return w.slice(0,-1)+"ied"; if(/[^aeiou][aeiou][bdgkmnprt]$/.test(w)) return null; return w+"ed"; }
function vocabNotes(it){
  const d = it.d, L = S.level, out = [];
  let w = clean(d[0]).toLowerCase(), pos = it.kind==="c" ? d[4] : null;
  if(/^to /.test(w)){ pos = "v"; w = w.slice(3).split(" ")[0]; }
  if(pos && POS_NAME[pos]) out.push({es:`Tipo de palabra: ${POS_NAME[pos][0]}.`, en:`Word type: ${POS_NAME[pos][1]}.`});

const BW=[34,46,58,70,84], BH=[26,36,46,58,72];
function bubbleD(x,y,w,h){ const r=9; return `M${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x+21}L${x+8} ${y+h+9}L${x+11} ${y+h}H${x+r}Q${x} ${y+h} ${x} ${y+h-r}V${y+r}Q${x} ${y} ${x+r} ${y}Z`; }
let gid = 0;
function bubblesSVG(xp){
  let x = 10, out = "";
  const id = "cl"+(++gid), pct = levelPct(xp);
  LEVELS.forEach((l,i)=>{
    const w=BW[i], h=BH[i], y=86-h, st = i<S.level-1 ? "done" : i===S.level-1 ? "cur" : "todo", d = bubbleD(x,y,w,h);
    if(st==="done") out += `<path d="${d}" fill="#FF5A1F"/>`;
    else if(st==="todo") out += `<path d="${d}" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/>`;
    else out += `<clipPath id="${id}"><rect class="fillr" data-w="${w}" x="${x}" y="${y-2}" width="${(w*pct).toFixed(1)}" height="${h+14}"/></clipPath>
      <path d="${d}" fill="rgba(255,255,255,.14)"/><path d="${d}" fill="#FF5A1F" clip-path="url(#${id})"/><path d="${d}" fill="none" stroke="#FFC928" stroke-width="2"/>`;
    const n=i+1, step=(h-14)/n, ws=[1,.78,.94,.66,.86];
    for(let k=0;k<n;k++) out += `<rect x="${x+8}" y="${(y+8+k*step).toFixed(1)}" width="${((w-16)*ws[k]).toFixed(1)}" height="4" rx="2" fill="${st==="todo"?"rgba(255,255,255,.28)":"rgba(255,255,255,.9)"}"/>`;
    out += `<text x="${x+w/2}" y="112" text-anchor="middle" font-size="12" font-weight="800" font-family="Archivo,system-ui,sans-serif" fill="${st==="cur"?"#FFC928":st==="done"?"#fff":"rgba(255,255,255,.6)"}">${l.code}</text>`;
    x += w+8;

function animateProgress(from, to){
  const r = $(".fillr"), el = $("#xpnum"); if(!r) return;
  const w = +r.dataset.w, p0 = levelPct(from), p1 = levelPct(to);
  const set = (p,x)=>{ r.setAttribute("width",(w*p).toFixed(1)); if(el) el.textContent = fmt(x)+" XP"; };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || from===to){ set(p1,to); return; }
  set(p0,from); const start = performance.now(), dur = 1200;
  const step = now => { const k=Math.min(1,(now-start)/dur), e=1-Math.pow(1-k,3); set(p0+(p1-p0)*e, from+(to-from)*e); if(k<1) requestAnimationFrame(step); };

}

    case "input": return grade(st.answer, ex.accepted, ex.strict);

    case "order": return {ok: st.built.map(i=>ex.words[i]).join(" ").toLowerCase()===ex.answer.toLowerCase()};
    case "reply": { const cands = st.typing ? [st.answer] : (st.heard||[]); return {ok: cands.some(c=>ex.keys.every(g=>hasKeyword(c,g)))}; }

    case "compose": return checkCompose(st.answer, ex.checks, ex.min);
    case "speak": {
      const cands = st.typing ? [st.answer] : (st.heard||[]);
      if(ex.mode==="ans") return {ok: cands.some(c=>hasKeyword(c, ex.keywords))};
      if(st.typing) return grade(st.answer, ex.accepted, false);
      if(ex.mode==="rep"){ const al = bestAlign(ex.text, cands), sc = al.filter(x=>x.ok).length/Math.max(1,al.length); return {ok: sc>=0.8, typo: sc>=0.8 && sc<1, best: ex.text, score: sc}; }

}

function chatMic(append){
  if(Mic.on){ Mic.stop(); return; }
  chat.heard = null;
  const prev = append && chat.pending ? chat.pending : null;
  const ok = Mic.start({ long:false,
    onResult: alts => { chat.heard = alts; },
    onError: code => { chat.micErr = MIC_ERR[code] || MIC_ERR.start; if(micBlocked) chat.typing = true; },
    onEnd: () => { chat.listening = false; if(view!=="chat") return;
      if(chat.heard && chat.heard[0]){
        /* no se envía solo: se muestra lo que hemos entendido para que el alumno lo revise y lo envíe */
        if(prev){ const base = prev.text.trim(); chat.pending = {alts: chat.heard.map(h=>base+" "+h), text: base+" "+chat.heard[0], orig: base+" "+chat.heard[0], edited: prev.text.trim()!==prev.orig.trim()}; }
        else chat.pending = {alts: chat.heard, text: chat.heard[0], orig: chat.heard[0], edited:false};
      } else if(prev) chat.pending = prev;
      render(); scrollChat(); } });
  chat.listening = ok; if(ok) chat.micErr = null; else chat.typing = true;
  render();
}
function chatConfirm(){
  const t = $("#chatheard"), p = chat.pending; if(!p) return;
  const text = (t ? t.value : p.text).trim(); if(!text) return;
  chat.pending = null;
  const same = !p.edited && text.replace(/\s+/g," ")===p.orig.trim().replace(/\s+/g," ");
  chatSubmit(same ? p.alts : [text], same);
}
function chatSubmit(cands, voice=false){
  cands = cands.map(s=>String(s||"").trim()).filter(Boolean); if(!cands.length) return;
  chat.voice = voice; chat.pending = null;
  chat.draft = ""; chat.micErr = null;
  chat.log.push({who:"me", text:cands[0]}); chat.last = cands;
  if(chat.mode==="free") return freeTurn();
  const turn = chat.sc.turns[chat.i];
  if(cands.some(c => turn.k.every(g=>hasKeyword(c,g)))) return guidedOk(cands[0]);
  chat.tries++;
  if(chat.tries>=2){ chat.log.push({who:"note", ok:false, html:`${fb("oneWay")}: <b>${esc(turn.m)}</b> ${spk(turn.m)}${noteWhy(turn.m)}${chatPron(turn)}`}); record("conv",false); nextTurn(); }
  else chat.log.push({who:"note", ok:false, html:`${esc(fb("almost"))}${chatPron(turn)}${AI?` <button class="link" data-act="chatai">¿Mi frase vale? Preguntar a Claude</button>`:""}`});
  render(); scrollChat();
}
function guidedOk(text){
  const turn = chat.sc.turns[chat.i], first = chat.tries===0 && !chat.peek;
  if(first) chat.score++;
  record("conv", first); addXP(first?20:8);
  chat.log.push({who:"note", ok:true, html:`✓ ${fb("good")}${sim(text,turn.m)<0.9?` ${fb("other")}: <b>${esc(turn.m)}</b> ${spk(turn.m)}`:""}${noteWhy(turn.m)}${chatPron(turn)}`});
  nextTurn(); render(); scrollChat();
}
function nextTurn(){
  chat.i++; chat.tries=0; chat.peek=false;
  if(chat.i < chat.sc.turns.length){ const b = chat.sc.turns[chat.i].b; chat.log.push({who:"bot", text:b}); setTimeout(()=>speak(b), 350); }
  else { chat.done = true; addXP(30 + (chat.score===chat.sc.turns.length?20:0)); save(); }
}
async function chatAIcheck(){
  if(!AI || !chat.last || chat.busy) return;
  const turn = chat.sc.turns[chat.i];
  chat.busy = true; render(); scrollChat();
  const prompt = `You are a friendly English teacher. In a role-play (${chat.sc.title}), the other person says: "${turn.b}". The student's goal is: "${inEn()?turn.tE:turn.t}".
The student said: "${chat.last[0]}"
Did the student achieve the goal with understandable, reasonably correct English? Other natural wordings are fine.
Reply with JSON only, no markdown: {"correct": true or false, "feedback": "one short sentence in ${expLang()}", "better": "a natural way to say it"}`;
  try{
    const j = await aiJSON(prompt,"quick");
    chat.busy = false;
    if(j && j.correct===true){ chat.log.push({who:"note", ok:true, html:`Claude la da por buena. ${esc(j.feedback||"")}`}); chat.tries = 0; guidedOk(chat.last[0]); return; }
    chat.log.push({who:"note", ok:false, html:`${esc((j&&j.feedback)||"No termina de cumplir el objetivo.")}${j&&j.better?` Prueba: <b>${esc(j.better)}</b> ${spk(j.better)}`:""}`});
  }catch(e){ chat.busy = false; chat.log.push({who:"note", ok:false, html:esc(aiErr(e))}); }
  render(); scrollChat();
}
function transcript(){ return chat.log.filter(m=>m.who!=="note").slice(-20).map(m=>(m.who==="bot"?"Character":"Student")+": "+m.text).join("\n"); }
async function freeTurn(){
  chat.userTurns++; chat.busy = true; render(); scrollChat();
  const L = lvlCode();
  const prompt = `You are role-playing to help a Spanish speaker practise conversational English (CEFR level ${L}).
You are ${chat.sc.role}. The student is ${chat.sc.you}. Stay in character and never mention that you are an AI or a teacher.
Conversation so far:
${transcript()}

1. Reply in character with one or two short, natural sentences suited to level ${L}. Keep the conversation going, usually with a question.
2. Check the student's last message for grammar or vocabulary mistakes or clearly unnatural phrasing.
Return JSON only, no markdown: {"reply": "your in-character reply", "correction": "a short explanation in ${expLang()} of the main mistake, or an empty string if there was none", "better": "a more natural version of the student's last message, or an empty string if it was already natural", "end": false}
Set "end" to true only if the conversation has clearly reached its natural end.`;
  try{
    const j = await aiJSON(prompt,"quick");
    const fixed = !!(j.correction && j.correction.trim());
    if(fixed || (j.better && sim(j.better, chat.last[0])<0.9)) chat.log.push({who:"note", ok:!fixed, html:`${fixed?"💡 "+esc(j.correction):"✓ Se entiende bien."}${j.better?` Más natural: <b>${esc(j.better)}</b> ${spk(j.better)}`:""}`});
    if(j.reply){ chat.log.push({who:"bot", text:j.reply}); setTimeout(()=>speak(j.reply), 200); }
    record("conv", !fixed); addXP(12); save();
    chat.busy = false;
    if(j.end || chat.userTurns>=10){ render(); return endFree(); }
  }catch(e){ chat.busy = false; chat.log.push({who:"note", ok:false, html:esc(aiErr(e))}); }
  render(); scrollChat();
}
async function endFree(){
  Mic.abort();
  chat.done = true; chat.final = {loading:true}; render(); scrollChat();
  const prompt = `You are an English speaking coach. Below is a role-play between a Spanish-speaking learner (CEFR level ${lvlCode()}), labelled Student, and a character (${chat.sc.role}).
${transcript()}

Return JSON only, no markdown: {"score": integer 1-10, "summary": "two sentences in ${expLang()} on how the student did", "tips": ["up to 3 short, concrete tips in ${expLang()}"], "phrases": ["3 useful English phrases for this kind of conversation"]}`;
  try{ const j = await aiJSON(prompt,"default"); chat.final = Object.assign({ai:true}, j); addXP(40); save(); }
  catch(e){ chat.final = {err: aiErr(e)}; }

}

  fl.seen += fl.again.has(it.id) ? 0 : 1;
  if(known){ S.fc[it.id] = Math.min(4,(S.fc[it.id]||0)+1); if(!fl.again.has(it.id)) fl.known++; addXP(3); S.seen[it.id]=todayKey(); }
  else { S.fc[it.id] = 0; if(!fl.again.has(it.id)){ fl.again.add(it.id); fl.cards.push(it); } }
  fl.i++; fl.flip = false; save(); render();
}

/* ---------- memory ---------- */
function newMemory(){
  const pick = shuffle(POOL.phrasal.filter(it=>it.lvl<=Math.min(5,S.level+1))).slice(0,6), cards = [];
  pick.forEach((it,k)=>{ cards.push({k,t:it.d[0],en:true}); cards.push({k,t:it.d[1],en:false}); });
  mem = {items:pick, cards:shuffle(cards), open:[], done:new Set(), moves:0, lock:false, bad:[], finished:false};
}
function renderMemory(){
  let h = `<div class="wrap"><div class="top"><button class="icon-btn" data-act="tab" data-v="games" aria-label="Volver">←</button><b>Memory de phrasal verbs</b><span class="small muted">${mem.moves} jugadas</span></div>`;
  if(mem.finished) return h + `<div class="panel"><h2>¡Tablero completo!</h2><p class="muted" style="margin:6px 0 12px">${mem.moves} jugadas. Has ganado 15 XP. Repasa los ejemplos en voz alta:</p>
      <div class="miss-list">${mem.items.map(it=>`<div class="row between"><div><b>${esc(it.d[0])}</b>: ${esc(it.d[1])}<br><i class="small">${esc(it.d[3])}</i></div>${spk(it.d[3])}</div>`).join("")}</div>
      <div class="row sec" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="memnew">Nueva partida</button><button class="btn ghost" data-act="tab" data-v="games">Volver a juegos</button></div></div></div>`;
  h += `<p class="muted" style="margin-bottom:14px">Encuentra las 6 parejas: cada phrasal verb con su significado.</p><div class="mem">`;
  h += mem.cards.map((c,i)=>{ const open = mem.open.includes(i), done = mem.done.has(i);
    return `<button class="mc ${c.en?"en":""} ${open?"open":""} ${done?"done":""} ${mem.bad.includes(i)?"shake":""}" data-act="mem" data-i="${i}" aria-label="${open||done?esc(c.t):"Carta boca abajo"}" ${done?"disabled":""}>${open||done?esc(c.t):"?"}</button>`; }).join("");
  return h + `</div></div>`;
}
function memTap(i){
  if(mem.lock || mem.done.has(i) || mem.open.includes(i)) return;
  mem.bad = []; mem.open.push(i);
  if(mem.open.length===2){
    mem.moves++;
    const [a,b] = mem.open, A = mem.cards[a], B = mem.cards[b];
    if(A.k===B.k){ mem.done.add(a); mem.done.add(b); mem.open = []; speak(A.en?A.t:B.t);
      if(mem.done.size===mem.cards.length){ mem.finished = true; addXP(15); save(); } }
    else { mem.lock = true; render(); setTimeout(()=>{ if(!mem) return; mem.bad=[a,b]; mem.open=[]; mem.lock=false; if(view==="memory") render(); }, 950); return; }
  }
  render();
}

/* ---------- contrarreloj ---------- */
function tmNext(){
  const pool = [...POOL.vocab, ...POOL.phrasal, ...POOL.interview.filter(x=>x.kind==="v" || (x.kind==="w" && offerOn())), ...(S.settings.tech!=="never"?POOL.tech:[])].filter(it=>it.lvl<=S.level);
  tm.q = makeEx(pool[Math.floor(Math.random()*pool.length)], Math.random, {mcq:true});
}
function stopTimer(){ if(tmTimer){ clearInterval(tmTimer); tmTimer = null; } }
function startTimed(){
  tm = {started:true, over:false, score:0, total:0, misses:[], all:[], end:Date.now()+60000}; tmNext(); render();
  stopTimer(); tmTimer = setInterval(()=>{
    const left = Math.max(0, Math.ceil((tm.end-Date.now())/1000)), el = $("#timer");
    if(el) el.textContent = left+" s";
    if(left<=0){ stopTimer(); tm.over = true; addXP(4*tm.score); save(); if(view==="timed") render(); }
  }, 250);
}
function renderTimed(){
  let h = `<div class="wrap"><div class="top"><button class="icon-btn" data-act="tab" data-v="games" aria-label="Volver">←</button><b>Contrarreloj</b><span></span></div>`;
  if(!tm.started) return h + `<div class="panel"><h2>60 segundos</h2><p class="muted" style="margin:6px 0 14px">Vocabulario, phrasal verbs y términos de entrevista de tu nivel. Cada acierto vale 4 XP y los fallos no restan.</p><button class="btn full" data-act="tmstart">Empezar</button></div></div>`;
  if(tm.over) return h + `<div class="panel"><h2>¡Tiempo!</h2><div class="kpis sec"><div class="kpi"><b>${tm.score}</b><span>aciertos</span></div><div class="kpi"><b>${tm.total}</b><span>respondidas</span></div><div class="kpi"><b>+${fmt(4*tm.score)}</b><span>XP</span></div></div>
    ${tm.misses.length ? `<div class="sec"><h3 style="margin-bottom:10px">Tus errores (${tm.misses.length})</h3><div class="miss-list">${tm.misses.map(m=>answerRow({q:m.q, your:m.your, a:m.sol, ok:false, say:m.say},false)).join("")}</div><p class="note">Estas palabras irán volviendo poco a poco en tus próximos retos.</p></div>`
      : tm.total ? `<p class="sec">✓ Sin errores. ¡Muy bien!</p>` : ""}
    ${tm.all.length ? `<details class="sec all-answers"${tm.misses.length?"":" open"}><summary><b>Todas tus respuestas (${tm.all.length})</b></summary><div class="miss-list" style="margin-top:10px">${tm.all.map(x=>answerRow(x,true)).join("")}</div></details>` : ""}
    <div class="row sec" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="tmstart">Otra vez</button><button class="btn ghost" data-act="tab" data-v="games">Volver a juegos</button></div></div></div>`;
  const q = tm.q, left = Math.max(0, Math.ceil((tm.end-Date.now())/1000));
  return h + `<div class="row between" style="margin-bottom:12px"><span class="timer" id="timer">${left} s</span><b>${tm.score} aciertos</b></div>
    <div class="panel" id="tmpanel"><div class="q-title">${q.titleH || esc(q.title)}</div><div class="big">${esc(q.big)}</div>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-act="tmpick" data-i="${i}">${esc(o)}</button>`).join("")}</div></div></div>`;
}
function tmPick(i){
  if(tm.over) return;
  const ok = tm.q.opts[i]===tm.q.answer; tm.total++; if(ok) tm.score++;
  record(tm.q.it.topic, ok);
  tm.all.push({q:`${titleText(tm.q)} «${tm.q.big}»`, your:tm.q.opts[i], a:tm.q.sol, ok, say:tm.q.full});
  if(!ok){ tm.misses.push({q:`${titleText(tm.q)} «${tm.q.big}»`, your:tm.q.opts[i], sol:tm.q.sol, say:tm.q.full}); reviewMiss(tm.q.it.id); save(); }
  if(!ok) toast(tm.q.sol);
  tmNext(); render();
  const p = $("#tmpanel"); if(p) p.classList.add(ok?"flash-ok":"flash-bad");
}
