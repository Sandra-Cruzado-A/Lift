<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F1B4C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift">
<meta name="description" content="Aprende inglés hablando: conversaciones, entrevistas de trabajo, escritura y retos diarios.">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>Lift: inglés para hablar con soltura</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..900&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#E7F0FF; --surface:#FFFFFF; --surface2:#F2F6FF; --ink:#0F1B4C; --muted:#56628F; --line:#CAD7F3;
  --accent:#FF5A1F; --accent-press:#E24812; --on-accent:#FFFFFF; --sun:#FFC928;
  --ok:#0E9F6E; --ok-bg:#DBF5E9; --bad:#D92D4B; --bad-bg:#FDE3E8; --chip:#E9F0FF; --focus:#2B6BFF; --deep:#0F1B4C;
  --wide:125%;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0A1130; --surface:#141D46; --surface2:#19245A; --ink:#EAF0FF; --muted:#A6B2DD; --line:#27336B;
    --chip:#1C2860; --ok-bg:#0E3A2D; --bad-bg:#4A1624; --focus:#8DB2FF; --deep:#26358A; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0A1130; --surface:#141D46; --surface2:#19245A; --ink:#EAF0FF; --muted:#A6B2DD; --line:#27336B;
  --chip:#1C2860; --ok-bg:#0E3A2D; --bad-bg:#4A1624; --focus:#8DB2FF; --deep:#26358A; color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);
  font-family:"Archivo",system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px;border-radius:10px}
img,svg{max-width:100%}
h1,h2,h3{font-stretch:var(--wide);line-height:1.1;margin:0}
h1{font-size:1.65rem;font-weight:800;letter-spacing:-.01em}
h2{font-size:1.2rem;font-weight:800}
h3{font-size:1rem;font-weight:700}
p{margin:0}
.wrap{max-width:540px;margin:0 auto;padding:14px 16px 110px}
.muted{color:var(--muted)}
.small{font-size:.875rem}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.brand{font-stretch:var(--wide);font-weight:900;font-size:1.6rem;letter-spacing:-.02em;display:flex;align-items:center;gap:8px}
.brand svg{width:30px;height:27px}
.streak{display:flex;align-items:center;gap:6px;background:var(--surface);border:1px solid var(--line);padding:6px 12px;border-radius:999px;font-weight:700}
.streak.off{color:var(--muted)}

/* progress card with bubbles */
.prog-card{background:var(--surface);border-radius:22px;padding:10px 10px 14px;border:1px solid var(--line)}
.band{background:var(--deep);border-radius:16px;padding:14px 6px 6px}
.bubbles{display:block;width:100%;height:auto}
.prog-meta{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;padding:12px 6px 0}
.lvl-code{font-stretch:var(--wide);font-weight:900;font-size:2.1rem;line-height:1}
.lvl-name{font-weight:600}
.xp{font-variant-numeric:tabular-nums;font-weight:700;text-align:right}
.bar{height:10px;border-radius:99px;background:var(--chip);overflow:hidden;margin:10px 6px 0}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .6s ease}

/* sections */
.sec{margin-top:18px}
.panel{background:var(--surface);border-radius:20px;padding:18px;border:1px solid var(--line)}
.panel+.panel{margin-top:12px}
.daily{background:var(--deep);color:#fff;border:0;position:relative;overflow:hidden}
.daily .muted{color:#C3CCF2}
.daily h2{font-size:1.45rem}
.daily .chips{margin:12px 0 16px}
.daily .chip{background:rgba(255,255,255,.12);color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{background:var(--chip);border-radius:999px;padding:4px 10px;font-size:.8125rem;font-weight:600}
.row{display:flex;align-items:center;gap:12px}
.row.between{justify-content:space-between}
.stack>*+*{margin-top:8px}

/* buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:50px;padding:0 22px;border-radius:14px;
  font-weight:800;font-stretch:var(--wide);font-size:1rem;background:var(--accent);color:var(--on-accent);transition:transform .08s ease,background .15s}
.btn:active{transform:scale(.97);background:var(--accent-press)}
.btn:disabled{background:var(--line);color:var(--muted)}
.btn.ghost:disabled{background:transparent;opacity:.45}
.btn.full{width:100%}
.btn.ghost{background:transparent;color:inherit;border:2px solid var(--line)}
.btn.ghost:active{background:var(--chip)}
.daily .btn.ghost{border-color:rgba(255,255,255,.3)}
.btn.sm{min-height:36px;padding:0 14px;font-size:.875rem;border-radius:10px}
.btn.ok{background:var(--ok)}
.btn.bad{background:var(--bad)}
.link{color:var(--accent);font-weight:700;text-decoration:underline;text-underline-offset:3px;padding:6px 0}
.icon-btn{width:40px;height:40px;border-radius:12px;display:inline-grid;place-items:center;background:var(--chip);font-size:1.1rem;flex:none}

/* word of the day */
.wod-word{font-stretch:var(--wide);font-weight:800;font-size:1.35rem}

/* games */
.games{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.game{background:var(--surface);border:1px solid var(--line);border-radius:20px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;min-height:150px}
.game:active{transform:scale(.98)}
.gi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;background:var(--chip)}
.game .gi{flex:none;width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-size:1.4rem;margin-bottom:4px}
.game h3{font-size:1rem;margin-bottom:3px}
.game p{font-size:.85rem;color:var(--muted)}
.game.wide{grid-column:1/-1;min-height:0;flex-direction:row;align-items:center;gap:14px}
.game.locked{opacity:.55}

/* session */
.sess{max-width:600px;margin:0 auto;min-height:calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));min-height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;padding:10px 16px 0}
.sess-top{display:flex;align-items:center;gap:12px;padding:6px 0 14px}
.segs{flex:1;display:flex;gap:4px}
.segs i{flex:1;height:8px;border-radius:9px;background:var(--line)}
.segs i.done{background:var(--ok)}
.segs i.miss{background:var(--bad)}
.segs i.cur{background:var(--accent)}
.sess-body{flex:1;padding-bottom:24px}
.q-tag{display:inline-flex;gap:6px;align-items:center;font-size:.8125rem;font-weight:700;color:var(--muted);margin-bottom:8px}
.q-title{font-size:1.2rem;font-weight:700;margin-bottom:14px}
.big{font-stretch:var(--wide);font-weight:800;font-size:1.55rem;line-height:1.15;display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:6px 0 10px}
.sentence{font-size:1.25rem;font-weight:600;line-height:1.5;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px 16px;margin-bottom:14px}
.sentence mark{background:var(--sun);color:#0F1B4C;border-radius:6px;padding:0 4px}
.gap{display:inline-block;min-width:70px;border-bottom:3px solid var(--accent);margin:0 2px}
.sub{color:var(--muted);margin-bottom:12px}
.opts{display:grid;gap:10px}
.opt{text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px 16px;font-weight:600;font-size:1.02rem;min-height:54px}
.opt.sel{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 10%,var(--surface))}
.opt.right{border-color:var(--ok);background:var(--ok-bg)}
.opt.wrong{border-color:var(--bad);background:var(--bad-bg)}
.inp{width:100%;font:inherit;font-size:1.1rem;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:14px;padding:14px;resize:vertical;min-height:56px}
.inp:focus{outline:none;border-color:var(--accent)}
.built{min-height:64px;display:flex;flex-wrap:wrap;gap:8px;padding:10px;border-radius:14px;border:2px dashed var(--line);margin-bottom:14px;align-content:flex-start}
.bank{display:flex;flex-wrap:wrap;gap:8px}
.w{background:var(--surface);border:2px solid var(--line);border-radius:12px;padding:9px 13px;font-weight:700;font-size:1.02rem}
.w.used{visibility:hidden}
.mic{width:100%;min-height:120px;border-radius:22px;background:var(--surface);border:2px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-weight:700}
.mic .dot{width:58px;height:58px;border-radius:50%;background:var(--accent);display:grid;place-items:center;color:#fff;font-size:1.6rem}
.mic.on{border-color:var(--accent)}
.mic.on .dot{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.12)}}
.heard{margin-top:12px;background:var(--surface2);border-radius:12px;padding:10px 12px}
.note{font-size:.875rem;color:var(--muted);margin-top:10px}
.bar-actions{position:sticky;bottom:0;margin:0 -16px;padding:14px 16px calc(14px + env(safe-area-inset-bottom,0px));background:var(--bg);border-top:1px solid var(--line)}
.fb{border-radius:16px;padding:14px 16px;margin-bottom:12px}
.fb.ok{background:var(--ok-bg)}
.fb.bad{background:var(--bad-bg)}
.fb h3{margin-bottom:4px}
.fb.ok h3{color:var(--ok)}
.fb.bad h3{color:var(--bad)}
.fb p+p{margin-top:6px}
.ai-out{margin-top:8px;font-size:.92rem}

/* summary */
.summary{text-align:left}
.result-num{font-stretch:var(--wide);font-weight:900;font-size:2.6rem;line-height:1}
.fact{background:var(--sun);color:#0F1B4C;border-radius:20px;padding:18px}
.fact h3{font-size:1.1rem;margin-bottom:6px}
.miss-list{display:grid;gap:8px}
.miss-list div{background:var(--surface2);border-radius:12px;padding:10px 12px}

/* flashcards */
.card-wrap{perspective:1200px;margin:10px 0 18px}
.fcard{position:relative;width:100%;min-height:260px;transform-style:preserve-3d;transition:transform .45s ease;cursor:pointer}
.fcard.flip{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:24px;padding:22px;display:flex;flex-direction:column;justify-content:center;gap:10px;border:1px solid var(--line);background:var(--surface)}
.face.back{transform:rotateY(180deg);background:var(--deep);color:#fff}
.face .word{font-stretch:var(--wide);font-weight:900;font-size:1.8rem;line-height:1.1}
.face.back .muted{color:#C3CCF2}

/* memory */
.mem{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.mc{font-size:.92rem;aspect-ratio:1/1.05;border-radius:16px;background:var(--deep);color:#fff;font-weight:700;font-size:.92rem;padding:8px;display:grid;place-items:center;text-align:center;line-height:1.2;transition:transform .2s}
.mc.open{background:var(--surface);color:var(--ink);border:2px solid var(--accent)}
.mc.en.open{font-stretch:var(--wide);font-weight:800}
.mc.done{background:var(--ok-bg);color:var(--ink);border:2px solid var(--ok)}
.mc.shake{animation:shake .3s}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}

/* progress */
.lights{display:grid;grid-template-columns:repeat(14,1fr);gap:5px;margin-top:12px}
.lights i{aspect-ratio:1;border-radius:50%;background:var(--line)}
.lights i.on{background:var(--sun);box-shadow:0 0 8px color-mix(in srgb,var(--sun) 70%,transparent)}
.lights i.today{outline:2px solid var(--accent);outline-offset:1px}
.topic{display:grid;grid-template-columns:28px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.topic:last-child{border-bottom:0}
.topic .bar{margin:6px 0 4px;height:8px}
.topic b{display:block;line-height:1.2}
.topic .bar>i{background:var(--ok)}
.topic .bar.mid>i{background:var(--sun)}
.topic .bar.low>i{background:var(--bad)}
.kpis{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kpi b{display:block;font-stretch:var(--wide);font-weight:900;font-size:1.5rem}
.kpi span{font-size:.8rem;color:var(--muted)}
details summary{cursor:pointer;font-weight:700;padding:4px 0}
.facts-list{display:grid;gap:10px;margin-top:10px}
.facts-list div{background:var(--surface2);border-radius:12px;padding:12px}
select{font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:10px;padding:8px}
input[type=range]{width:100%;accent-color:var(--accent)}


/* chat */
.chat{display:flex;flex-direction:column;gap:10px;padding-bottom:18px}
.chat.mini{padding-bottom:12px}
.msg{max-width:88%;padding:11px 14px;border-radius:18px;line-height:1.4;display:flex;align-items:flex-start;gap:8px}
.msg>span{flex:1}
.msg .icon-btn{width:34px;height:34px;font-size:.95rem;margin:-4px -6px -4px 0}
.msg.bot{align-self:flex-start;background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:6px;font-size:1.08rem;font-weight:600}
.msg.me{align-self:flex-end;background:var(--accent);color:#fff;border-bottom-right-radius:6px;font-weight:600}
.msg.note{align-self:stretch;max-width:100%;display:block;font-size:.92rem;border-radius:14px;padding:10px 12px}
.msg.note.ok{background:var(--ok-bg)}
.msg.note.bad{background:var(--bad-bg)}
.msg.note .icon-btn{width:30px;height:30px;font-size:.85rem;vertical-align:middle;margin:0 0 0 4px}
.msg.note .link{padding:2px 0;display:inline}
.msg .who{display:block;font-size:.78rem;font-weight:600;color:var(--muted);margin-bottom:2px}
.msg.typing{color:var(--muted);font-style:italic;font-weight:500}
.goal{background:color-mix(in srgb,var(--sun) 35%,var(--surface));color:var(--ink);border-radius:14px;padding:10px 14px;font-weight:700;margin-bottom:12px}
.composer{display:flex;gap:8px;align-items:flex-end}
.composer .inp{min-height:52px;font-size:1.05rem;padding:12px}
.composer .btn{flex:none}
.bar-actions .mic{min-height:96px}
.grow{flex:1;min-width:0}
.sess-top .grow b{display:block;line-height:1.2}

/* lists */
.list{padding:4px 12px}
.list-row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:12px 4px;border-bottom:1px solid var(--line)}
.list-row:last-child{border-bottom:0}
.list-row b{display:block;line-height:1.25}
.list-row .gi{width:40px;height:40px;font-size:1.25rem;border-radius:12px}
.list-row>span:last-child{color:var(--muted);font-size:1.4rem}
.talk-card .gi{width:48px;height:48px}

/* writing and interview */
.checks{list-style:none;margin:0 0 12px;padding:0;display:grid;gap:4px}
.checks li{font-weight:600;font-size:.95rem}
.checks li.ok{color:var(--ok)}
.checks li.bad{color:var(--bad)}
.tip{background:var(--surface2);border-radius:12px;padding:8px 12px}
.tip p{margin-top:4px;font-size:.95rem}
.chip-btn{border:1px solid var(--line);text-align:left;font-weight:600;padding:6px 10px}
.fb.neutral{background:var(--surface2);border:1px solid var(--line)}
.errs{margin:8px 0 0;padding-left:20px;display:grid;gap:4px;font-size:.92rem}
label.row input[type=checkbox]{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs-in{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:9px 0 10px;font-size:.78rem;font-weight:700;color:var(--muted)}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* onboarding */
.hero-title{font-size:2.1rem;font-weight:900;margin:18px 0 10px;letter-spacing:-.02em}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:700;z-index:50;max-width:90vw}
.timer{font-stretch:var(--wide);font-weight:900;font-size:1.6rem;font-variant-numeric:tabular-nums}
.flash-ok{animation:fok .35s}
.flash-bad{animation:fbad .35s}
@keyframes fok{0%{background:var(--ok-bg)}}
@keyframes fbad{0%{background:var(--bad-bg)}}
@media (prefers-reduced-motion: reduce){
  *{animation:none!important;transition:none!important}
}
@media (min-width:600px){ .games{grid-template-columns:1fr 1fr 1fr} .game.wide{grid-column:1/-1} }
</style>
</head>
<body>
<main id="app" aria-live="polite"></main>
<nav class="tabs" id="tabs" aria-label="Secciones">
  <div class="tabs-in">
    <button class="tab" data-act="tab" data-v="home"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M8 2v4M16 2v4M3 10h18"/><path d="m9 15 2 2 4-4"/></svg>Hoy</button>
    <button class="tab" data-act="tab" data-v="talk"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H10l-5 4v-4H4a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1z"/><path d="M8 10h8M8 13h5"/></svg>Conversar</button>
    <button class="tab" data-act="tab" data-v="games"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="7" width="20" height="11" rx="5"/><path d="M7 11v3M5.5 12.5h3"/><circle cx="16" cy="11.5" r=".6" fill="currentColor"/><circle cx="18" cy="13.5" r=".6" fill="currentColor"/></svg>Juegos</button>
    <button class="tab" data-act="tab" data-v="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 21h18"/><path d="M6 17v-5M11 17V6M16 17v-8M20 17v-3"/></svg>Progreso</button>
  </div>
</nav>
<script>
var STANDALONE = true;
/* ================= CONTENIDO ================= */
const LEVELS = [
  { n:1, code:"A1", name:"Primeras frases", xp:0 },
  { n:2, code:"A2", name:"Me defiendo", xp:800 },
  { n:3, code:"B1", name:"Conversación", xp:2000 },
  { n:4, code:"B2", name:"Soltura", xp:3600 },
  { n:5, code:"C1", name:"Fluidez", xp:5200 }
];
const TOP_XP = 6500;

const VSUBS = { dia:"Día a día", viaje:"Viajes", comida:"Comida y restaurantes", compras:"Compras y dinero",
  salud:"Salud", emoc:"Personas y emociones", trabajo:"Trabajo y oficina" };
const TSUBS = { avio:"Aviónica", aero:"Aeronáutica", elec:"Electrónica" };

/* [inglés, español, nivel, situación] */
const VOCAB = [
  ["weather","tiempo (atmosférico)",1,"dia"],["neighbour","vecino",1,"dia"],["to rent","alquilar",1,"dia"],
  ["washing machine","lavadora",1,"dia"],["to do the shopping","hacer la compra",1,"dia"],["early","temprano",1,"dia"],
  ["to be late","llegar tarde",1,"dia"],["busy","ocupado",1,"dia"],["to borrow","pedir prestado",2,"dia"],
  ["to lend","prestar",2,"dia"],["bill","factura",2,"dia"],["to do the washing-up","fregar los platos",2,"dia"],

  ["Goodbye","«Goodbye» viene de «God be with ye» (Dios sea contigo), una despedida del siglo XVI que se fue acortando con el uso."],
  ["Hello","«Hello» se hizo popular con el teléfono: Thomas Edison lo propuso como saludo para contestar las llamadas a finales del siglo XIX."],
  ["Actually no es actualmente","«Actually» significa «en realidad». Para «actualmente» di «currently» o «nowadays». Es uno de los false friends más frecuentes entre hispanohablantes."],

  ["OK","«OK» nació en 1839 en un periódico de Boston como broma: era la abreviatura de «oll korrect», una forma deliberadamente mal escrita de «all correct»."],
  ["Nice","En su origen latino, «nescius», «nice» significaba «ignorante». Con los siglos pasó por «tonto», «tímido» y «preciso» hasta llegar a «agradable»."],

  ["Queue","«Queue» (cola) se pronuncia exactamente como la letra Q. Las otras cuatro letras están ahí casi de adorno."],

  ["Pineapple","«Pineapple» se usaba para llamar a la piña de los pinos. Cuando los europeos conocieron la fruta tropical, le pusieron el mismo nombre por su parecido."],

function hashStr(s){ let h=1779033703^s.length; for(let i=0;i<s.length;i++){ h=Math.imul(h^s.charCodeAt(i),3432918353); h=h<<13|h>>>19; } return h>>>0; }
function rng(seed){ let a=seed>>>0; return function(){ a|=0; a=a+0x6D2B79F5|0; let t=Math.imul(a^a>>>15,1|a); t=t+Math.imul(t^t>>>7,61|t)^t; return ((t^t>>>14)>>>0)/4294967296; }; }
function shuffle(arr, r=Math.random){ const a=arr.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(r()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
function todayKey(d=new Date()){ return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }

/* ---------- normalización y corrección ---------- */
const SPELL = {colour:"color",fibre:"fiber",aluminium:"aluminum",cancelled:"canceled",metre:"meter",metres:"meters",
  kilometre:"kilometer",kilometres:"kilometers",centre:"center",realise:"realize",organise:"organize",analyse:"analyze",
  programme:"program",grey:"gray",favourite:"favorite",neighbour:"neighbor",behaviour:"behavior",aeroplane:"airplane",
  labour:"labor",modelling:"modeling",travelling:"traveling",defence:"defense",licence:"license",okay:"ok"};
const NUM = {"0":"zero","1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine",
  "10":"ten","11":"eleven","12":"twelve","20":"twenty","30":"thirty"};
function norm(s){
  s = String(s||"").toLowerCase().replace(/[’‘`´]/g,"'").replace(/[“”«»"]/g," ");
  s = s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not")
       .replace(/\bshan't\b/g,"shall not").replace(/n't\b/g," not").replace(/\bi'm\b/g,"i am")
       .replace(/'re\b/g," are").replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
       .replace(/\blet's\b/g,"let us").replace(/'s\b/g," is");
  s = s.replace(/[^a-z0-9áéíóúñü' ]+/g," ").replace(/'/g,"");
  return s.split(/\s+/).filter(Boolean).map(w => SPELL[w]||NUM[w]||w).join(" ");
}
function lev(a,b){
  const m=a.length, n=b.length; if(!m) return n; if(!n) return m;
  let prev=Array.from({length:n+1},(_,j)=>j), cur=new Array(n+1);
  for(let i=1;i<=m;i++){ cur[0]=i;
    for(let j=1;j<=n;j++) cur[j]=Math.min(prev[j]+1, cur[j-1]+1, prev[j-1]+(a[i-1]===b[j-1]?0:1));
    [prev,cur]=[cur,prev]; }
  return prev[n];
}
function isTypo(a,b){
  if(a===b) return true;
  if(Math.min(a.length,b.length)<4) return false;
  const long=a.length>b.length?a:b, short=a.length>b.length?b:a;
  if(long.startsWith(short) && /^(s|es|ed|d|ing)$/.test(long.slice(short.length))) return false;
  return lev(a,b) <= (b.length>=8?2:1);
}
function grade(input, accepted, strict){
  const ni = norm(input);
  if(!ni) return {ok:false,typo:false,best:accepted[0]};
  const wi = ni.split(" ");
  let best=accepted[0], bestD=1e9, typoHit=null;
  for(const a of accepted){
    const na = norm(a);
    if(na===ni) return {ok:true,typo:false,best:a};
    const wa = na.split(" "), d = lev(wi,wa);
    if(d<bestD){ bestD=d; best=a; }
    if(!strict && !typoHit && wa.length===wi.length){
      let diffs=0, good=true;
      for(let k=0;k<wa.length;k++){ if(wa[k]!==wi[k]){ diffs++; if(!isTypo(wi[k],wa[k])){ good=false; break; } } }
      if(good && diffs<=2) typoHit=a;
    }
  }
  if(typoHit) return {ok:true,typo:true,best:typoHit};
  return {ok:false,typo:false,best};
}
function sim(a,b){
  const wa=norm(a).split(" ").filter(Boolean), wb=norm(b).split(" ").filter(Boolean);
  if(!wa.length||!wb.length) return 0;
  return 1 - lev(wa,wb)/Math.max(wa.length,wb.length);
}
function hasKeyword(text, kws){
  const t = " "+norm(text)+" ";
  return kws.some(k => { const n = norm(k); if(!n) return false; if(t.includes(" "+n+" ")) return true;
    const last = n.split(" ").pop(); if(last.length<4) return false;
    return new RegExp(" "+n.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"(?:s|es|d|ed|ing|er|ers) ").test(t); });
}

function pickItems(spec, L, n, r, used=new Set(), exact=false){
  const [topic, kind] = spec.split(":");
  const pool = (POOL[topic]||[]).filter(it => !used.has(it.id) && (!kind || it.kind===kind));
  let c = pool.filter(it => exact ? it.lvl===L : (it.lvl<=L && it.lvl>=L-1));
  if(c.length<n) c = pool.filter(it => it.lvl<=L);
  if(c.length<n) c = pool.slice();
  const today = todayKey();
  return c.map(it => { const s=S.seen[it.id]; const age = s ? Math.min(30, dayDiff(s,today)) : 40;
      return {it, sc: age + (it.lvl===L?6:0) + r()*8}; })
    .sort((a,b)=>b.sc-a.sc).slice(0,n).map(x=>x.it);
}

}
function acc(topic){ const s=S.stats[topic]; if(!s||!s.r.length) return null; return s.r.reduce((a,b)=>a+b,0)/s.r.length; }
function topicOpen(k){ return !(TOPICS[k].min && S.level<TOPICS[k].min) && !(k==="tech" && S.settings.tech==="never"); }
function weakest(){
  let w=null, wa=2;
  for(const k in TOPICS){ if(!topicOpen(k)) continue; const s=S.stats[k]; if(!s||s.r.length<3) continue; const a=acc(k); if(a<wa){ wa=a; w=k; } }
  return wa<0.75 ? w : null;
}

function levelPct(xp){

  return Math.max(0, Math.min(1, (xp-cur.xp)/(top-cur.xp)));
}

function distract(it, n, field, r){
  let pool = shuffle(POOL[it.topic].filter(x => x!==it && x.kind===it.kind), r);
  const sub = x => x.d[3];
  const key = x => ((it.topic==="tech"||it.topic==="vocab") && it.kind!=="f" && sub(x)!==sub(it) ? 3 : 0) + Math.abs(x.lvl-it.lvl);
  pool.sort((a,b)=>key(a)-key(b));
  const out=[], seen=new Set([it.d[field]]);
  for(const x of pool){ const v=x.d[field]; if(!seen.has(v)){ seen.add(v); out.push(v); } if(out.length>=n) break; }
  return out;
}

function wordCount(t){ return (String(t||"").trim().match(/[A-Za-zÀ-ÿ0-9'’-]+/g)||[]).length; }
function checkCompose(text, checks, min){
  const hits = checks.map(([label,k]) => ({label, ok: hasKeyword(text,k)}));

}

/* ---------- reto diario ---------- */
function buildDaily(){
  const key = todayKey();
  if(S.daily && S.daily.date===key) return S.daily;
  const r = rng(hashStr(key+"|"+S.level)), L=S.level, used=new Set(), ids=[];
  const rot = ["ask","order","conn","listen"][Math.floor(r()*4)];
  const base = ["vocab","verbs","conv", (L>=2 && r()<0.5)?"expr":"phrasal","speak",rot,"write:t","conv",
    (L>=2 && r()<0.5) ? "interview:q" : "write:c"];
  if(S.settings.tech==="daily" || (S.settings.tech==="some" && r()<0.5)) base.splice(5,0,"tech");
  if(L>=2 && r()<0.35) base.splice(1,0,"interview:v");
  const due = shuffle(dueReview(), r).slice(0,2);
  due.forEach(id=>used.add(id));
  const w = weakest();
  if(w && !due.length) base.splice(3,0,w);
  base.forEach(t => { const it=pickItems(t,L,1,r,used)[0]; if(it){ used.add(it.id); ids.push(it.id); } });
  if(due[0]) ids.splice(2,0,due[0]);
  if(due[1]) ids.splice(6,0,due[1]);
  S.daily = {date:key, ids, review:due, done:false, score:null, fact:null};
  save();
  return S.daily;
}

      else { const res=ev.results[0], alts=[]; for(let i=0;i<res.length;i++) alts.push(res[i].transcript); o.onResult(alts); }

async function aiJSON(prompt, tier="quick", signal){
  if(!AI) throw {code:"not_granted"};
  try{ return await AI.json(prompt, signal ? {modelTier:tier, signal} : {modelTier:tier}); }
  catch(e){ if(e && e.code==="not_granted"){ AI = null; } throw e; }
}
function aiErr(e){
  if(e && e.code==="not_granted") return "Claude necesita tu permiso para revisar respuestas. Puedes darlo la próxima vez que abras la app.";
  if(e && e.code==="cancelled") return "Revisión cancelada.";
  if(e && e.code==="rate_limited") return "Demasiadas consultas seguidas. Espera un momento y vuelve a intentarlo.";
  return "No se pudo consultar a Claude ahora. Inténtalo más tarde.";
}

/* ---------- progreso en burbujas ---------- */
const BW=[34,46,58,70,84], BH=[26,36,46,58,72];
function bubbleD(x,y,w,h){ const r=9; return `M${x+r} ${y}H${x+w-r}Q${x+w} ${y} ${x+w} ${y+r}V${y+h-r}Q${x+w} ${y+h} ${x+w-r} ${y+h}H${x+21}L${x+8} ${y+h+9}L${x+11} ${y+h}H${x+r}Q${x} ${y+h} ${x} ${y+h-r}V${y+r}Q${x} ${y} ${x+r} ${y}Z`; }
let gid = 0;
function bubblesSVG(xp){
  let x = 10, out = "";
  const id = "cl"+(++gid), pct = levelPct(xp);
  LEVELS.forEach((l,i)=>{
    const w=BW[i], h=BH[i], y=86-h, st = i<S.level-1 ? "done" : i===S.level-1 ? "cur" : "todo", d = bubbleD(x,y,w,h);
    if(st==="done") out += `<path d="${d}" fill="#FF5A1F"/>`;
    else if(st==="todo") out += `<path d="${d}" fill="rgba(255,255,255,.06)" stroke="rgba(255,255,255,.35)" stroke-width="1.4"/>`;
    else out += `<clipPath id="${id}"><rect class="fillr" data-w="${w}" x="${x}" y="${y-2}" width="${(w*pct).toFixed(1)}" height="${h+14}"/></clipPath>
      <path d="${d}" fill="rgba(255,255,255,.14)"/><path d="${d}" fill="#FF5A1F" clip-path="url(#${id})"/><path d="${d}" fill="none" stroke="#FFC928" stroke-width="2"/>`;
    const n=i+1, step=(h-14)/n, ws=[1,.78,.94,.66,.86];
    for(let k=0;k<n;k++) out += `<rect x="${x+8}" y="${(y+8+k*step).toFixed(1)}" width="${((w-16)*ws[k]).toFixed(1)}" height="4" rx="2" fill="${st==="todo"?"rgba(255,255,255,.28)":"rgba(255,255,255,.9)"}"/>`;
    out += `<text x="${x+w/2}" y="112" text-anchor="middle" font-size="12" font-weight="800" font-family="Archivo,system-ui,sans-serif" fill="${st==="cur"?"#FFC928":st==="done"?"#fff":"rgba(255,255,255,.6)"}">${l.code}</text>`;
    x += w+8;
  });
  return `<svg class="bubbles" viewBox="0 0 344 120" role="img" aria-label="Nivel ${lvlCode()}, ${Math.round(pct*100)} % completado">${out}</svg>`;
}
function progressCard(xp=S.xp){
  const cur=LEVELS[S.level-1], next=LEVELS[S.level];
  const line = next ? (checkrideReady() ? `Listo para el examen de ${next.code}` : `Faltan ${fmt(next.xp-xp)} XP para ${next.code}`)
                    : (xp>=TOP_XP ? "Nivel máximo completado" : `Faltan ${fmt(TOP_XP-xp)} XP para completar C1`);
  return `<div class="prog-card"><div class="band">${bubblesSVG(xp)}</div>
    <div class="prog-meta"><div><div class="lvl-code">${cur.code}</div><div class="lvl-name">${cur.name}</div></div>
    <div class="xp"><div id="xpnum">${fmt(xp)} XP</div><div class="small muted">${line}</div></div></div></div>`;
}
function animateProgress(from, to){
  const r = $(".fillr"), el = $("#xpnum"); if(!r) return;
  const w = +r.dataset.w, p0 = levelPct(from), p1 = levelPct(to);
  const set = (p,x)=>{ r.setAttribute("width",(w*p).toFixed(1)); if(el) el.textContent = fmt(x)+" XP"; };
  if(matchMedia("(prefers-reduced-motion: reduce)").matches || from===to){ set(p1,to); return; }
  set(p0,from); const start = performance.now(), dur = 1200;
  const step = now => { const k=Math.min(1,(now-start)/dur), e=1-Math.pow(1-k,3); set(p0+(p1-p0)*e, from+(to-from)*e); if(k<1) requestAnimationFrame(step); };
  setTimeout(()=>requestAnimationFrame(step), 250);
}
function topBar(showStreak=true){
  const st = curStreak();
  return `<div class="top"><div class="brand">${LOGO}Lift</div>${showStreak?`<div class="streak ${st?"":"off"}" aria-label="Racha: ${st} días">🔥 ${st} ${st===1?"día":"días"}</div>`:""}</div>`;
}

function startSession(cfg){
  const r = rng(hashStr(cfg.seed || String(Date.now())));
  sess = Object.assign({mul:1, exOpt:{}}, cfg, {i:0, res:[], xp0:S.xp, lvl0:S.level});
  sess.exs = cfg.items.filter(Boolean).map(it => { const ex = makeEx(it, r, sess.exOpt); ex.isReview = !!(cfg.review && cfg.review.includes(it.id)); return ex; });
  if(!sess.exs.length){ toast("No hay ejercicios disponibles."); return; }
  resetEx(); view = "session"; render(); scrollTo(0,0);
}
function resetEx(){ Mic.abort(); sess.st = {answer:null, checked:false, result:null, built:[], heard:null, typing:micBlocked, listening:false, micErr:null, aiBusy:false, aiDone:false, aiMsg:null}; }
const cur = () => sess.exs[sess.i];
const LONG_TYPES = ["open","compose"];
function canCheck(ex, st){
  if(ex.type==="mcq") return st.answer!=null;
  if(ex.type==="order") return st.built.length===ex.words.length;
  if((ex.type==="speak"||ex.type==="reply") && !st.typing) return !!st.heard;
  return !!(st.answer||"").trim();
}
function micBlock(st, long){
  let h = "";
  if(long){
    h += `<div class="row" style="gap:10px;margin-top:10px;flex-wrap:wrap">${SRC && !micBlocked ? `<button class="btn sm ${st.listening?"":"ghost"}" data-act="dictate" ${st.checked?"disabled":""}>${st.listening?"⏹ Parar de dictar":"🎙️ Dictar con la voz"}</button>`:""}<span class="small muted" id="wc">${wordCount(st.answer)} palabras</span></div>`;
  } else if(!st.typing){
    h += `<button class="mic ${st.listening?"on":""}" data-act="mic" ${st.checked?"disabled":""}><span class="dot">🎙️</span>${st.listening?"Te escucho. Toca para parar":(st.heard?"Toca para repetir":"Toca y habla")}</button>`;
    if(st.heard) h += `<div class="heard"><span class="muted small">Hemos oído</span><br><b>${esc(st.heard[0])}</b></div>`;
    if(!st.checked) h += `<button class="link" data-act="typeInstead">Prefiero escribirlo</button>`;
  } else {
    h += inputHTML(false,"Escribe tu respuesta en inglés",st);
    if(SRC && !st.checked && !micBlocked) h += `<button class="link" data-act="useMic">Usar el micrófono</button>`;
  }
  if(st.micErr) h += `<p class="note">${esc(st.micErr)}</p>`;
  return h;
}
function renderSession(){
  const ex = cur(), st = sess.st, n = sess.exs.length, T = TOPICS[ex.it.topic];
  const segs = sess.exs.map((_,i)=>{ const r=sess.res[i]; return `<i class="${r ? (r.skip?"":(r.ok?"done":"miss")) : (i===sess.i?"cur":"")}"></i>`; }).join("");
  let tag = `<span>${T.icon} ${T.name}</span>`;
  if(ex.sub) tag += `<span class="chip">${esc(ex.sub)}</span>`;
  if(ex.isReview) tag += `<span class="chip">Repaso</span>`;
  let body = "";
  if(ex.pre) body += `<p class="sub">${esc(ex.pre)}</p>`;
  if(ex.sentence) body += `<div class="sentence">${ex.sentence}</div>`;
  switch(ex.type){
    case "mcq":
      if(ex.big) body += `<div class="big">${esc(ex.big)}${ex.say?spk(ex.say):""}</div>`;
      if(ex.quote) body += `<p class="sub"><i>${esc(ex.quote)}</i> ${spk(ex.quote)}</p>`;
      body += `<div class="opts">` + ex.opts.map((o,i)=>{ let c="";
        if(st.checked){ if(o===ex.answer) c="right"; else if(o===st.answer) c="wrong"; } else if(o===st.answer) c="sel";
        return `<button class="opt ${c}" data-act="pick" data-i="${i}" aria-pressed="${o===st.answer}" ${st.checked?"disabled":""}>${esc(o)}</button>`; }).join("") + `</div>`;
      break;
    case "input":
      if(ex.big) body += `<div class="big">${esc(ex.big)}</div>`;
      body += inputHTML(ex.single, ex.ph, st); break;
    case "order": {
      const used = new Set(st.built);
      body += `<p class="sub">«${esc(ex.es)}»</p><div class="built" aria-label="Tu frase">${st.built.map((wi,k)=>`<button class="w" data-act="unword" data-k="${k}" ${st.checked?"disabled":""}>${esc(ex.words[wi])}</button>`).join("") || '<span class="muted small">Toca las palabras en orden</span>'}</div>
        <div class="bank">${ex.words.map((w,i)=>`<button class="w ${used.has(i)?"used":""}" data-act="word" data-i="${i}" ${st.checked||used.has(i)?"disabled":""}>${esc(w)}</button>`).join("")}</div>`;
      break; }
    case "listen":
      body += `<div class="row" style="gap:10px;margin-bottom:14px;flex-wrap:wrap"><button class="btn" data-act="play">🔊 Escuchar</button><button class="btn ghost" data-act="playslow">Más despacio</button></div>` + inputHTML(false,"Escribe la frase en inglés",st);
      break;
    case "speak":
      body += ex.mode==="say" ? `<div class="big">«${esc(ex.big)}»</div>` : `<div class="big">${esc(ex.big)}${spk(ex.big)}</div>${ex.hint?`<p class="sub">Pista: ${esc(ex.hint)}</p>`:""}`;
      body += micBlock(st,false); break;
    case "reply":
      body += `<div class="chat mini"><div class="msg bot"><span>${esc(ex.bot)}</span>${spk(ex.bot)}</div></div><div class="goal">🎯 ${esc(ex.task)}</div>` + micBlock(st,false);
      break;
    case "open":
      body += `<div class="chat mini"><div class="msg bot"><span><small class="who">Entrevistadora</small>${esc(ex.big)}</span>${spk(ex.big)}</div></div>
        <details class="tip"><summary>Consejo para responder</summary><p>${esc(ex.tip)}</p></details>
        <p class="small muted" style="margin:10px 0 6px">Frases útiles (toca para escucharlas)</p><div class="chips">${ex.phrases.map(p=>`<button class="chip chip-btn" data-act="say" data-t="${esc(p)}">${esc(p)}</button>`).join("")}</div>
        <div style="margin-top:12px">${inputHTML(false,"Escribe o dicta tu respuesta en inglés",st,4)}</div>` + micBlock(st,true);
      break;
    case "compose":
      body += `<p style="margin-bottom:10px">${esc(ex.task)}</p>${ex.from?`<div class="chat mini"><div class="msg bot"><span>${esc(ex.from)}</span>${spk(ex.from)}</div></div>`:""}
        <ul class="checks">${ex.checks.map(([label],i)=>{ const h = st.result && st.result.hits ? st.result.hits[i].ok : null; return `<li class="${h===true?"ok":h===false?"bad":""}">${h===true?"✓":h===false?"✗":"○"} ${esc(label)}</li>`; }).join("")}<li class="small muted">Unas ${ex.min} palabras</li></ul>
        ${inputHTML(false,"Escribe aquí en inglés",st,6)}` + micBlock(st,true);
      break;
  }
  let actions;
  if(!st.checked) actions = `<button class="btn full" data-act="check" ${canCheck(ex,st)?"":"disabled"}>${LONG_TYPES.includes(ex.type)?"Enviar":"Comprobar"}</button>` + ((ex.type==="speak"||ex.type==="reply") ? `<div style="text-align:center;margin-top:4px"><button class="link" data-act="skip">Ahora no puedo hablar</button></div>` : "");
  else if(st.result.ok===null) actions = fbHTML(ex,st) + `<div class="row" style="gap:10px"><button class="btn ghost" style="flex:1" data-act="selfbad">Tengo que mejorarla</button><button class="btn ok" style="flex:1" data-act="selfok">Me ha salido bien</button></div>`;
  else actions = fbHTML(ex,st) + `<button class="btn full ${st.result.ok?"ok":""}" data-act="cont">${sess.i<n-1?"Continuar":"Terminar"}</button>`;
  return `<div class="sess"><div class="sess-top"><button class="icon-btn" data-act="quit" aria-label="Salir">✕</button><div class="segs">${segs}</div></div>
    <div class="sess-body"><div class="q-tag">${tag}</div><div class="q-title">${esc(ex.title)}</div>${body}</div>
    <div class="bar-actions">${actions}</div></div>`;
}
function inputHTML(single, ph, st, rows=3){
  const common = `id="ans" class="inp" placeholder="${esc(ph||"")}" autocomplete="off" autocorrect="off" spellcheck="false" ${st.checked?"disabled":""}`;
  return single ? `<input ${common} type="text" autocapitalize="none" value="${esc(st.answer||"")}">`
                : `<textarea ${common} rows="${rows}" autocapitalize="sentences">${esc(st.answer||"")}</textarea>`;
}
function gradeEx(ex, st){
  switch(ex.type){
    case "mcq": return {ok: st.answer===ex.answer};
    case "input": return grade(st.answer, ex.accepted, ex.strict);
    case "listen": { const g = grade(st.answer, ex.accepted, false); return {ok:g.ok, typo:g.typo, best:ex.text}; }
    case "order": return {ok: st.built.map(i=>ex.words[i]).join(" ").toLowerCase()===ex.answer.toLowerCase()};
    case "reply": { const cands = st.typing ? [st.answer] : (st.heard||[]); return {ok: cands.some(c=>ex.keys.every(g=>hasKeyword(c,g)))}; }
    case "open": return {ok:null, used: phrasesUsed(st.answer, ex.phrases), words: wordCount(st.answer)};
    case "compose": return checkCompose(st.answer, ex.checks, ex.min);
    case "speak": {
      const cands = st.typing ? [st.answer] : (st.heard||[]);
      if(ex.mode==="ans") return {ok: cands.some(c=>hasKeyword(c, ex.keywords))};
      if(st.typing) return grade(st.answer, ex.accepted, false);
      let bs=0, best=ex.accepted[0];
      for(const c of cands) for(const a of ex.accepted){ const s=sim(c,a); if(s>bs){ bs=s; best=a; } }
      return {ok: bs>=0.8, typo: bs>=0.8 && bs<1, best, score: bs};
    }
  }
}
function userText(ex, st){ return st.typing || !["speak","reply"].includes(ex.type) ? st.answer : (st.heard||[])[0]; }
function fbHTML(ex, st){
  const r = st.result, ok = r.ok;
  let h;
  if(ex.type==="open"){
    h = `<div class="fb neutral" role="status"><h3>${r.ai?(ok?"Buena respuesta":"Se puede mejorar"):"Compara con una respuesta modelo"}</h3>`;
    if(!r.ai){ h += `<p class="small">${r.words} palabras${r.used.length?`. Has usado: ${r.used.map(esc).join(", ")}`:". Prueba a incluir alguna de las frases útiles"}.</p>`;
      h += `<p><i>${esc(ex.sol)}</i> ${spk(ex.sol)}</p>`; }
  } else if(ex.type==="compose"){
    h = `<div class="fb ${ok?"ok":"bad"}" role="status"><h3>${r.ai?(ok?"¡Buen texto!":"Revisa la corrección"):ok?"¡Has cubierto todos los puntos!":"Te falta algún punto"}</h3>
      <p class="small">${r.words} palabras (unas ${ex.min} recomendadas).</p>
      <details${ok?"":" open"}><summary>Ver un ejemplo</summary><p style="white-space:pre-line;margin-top:6px"><i>${esc(ex.sol)}</i></p></details>`;
  } else {
    const head = r.ai ? "¡Válida!" : ok ? (r.typo ? "¡Bien! Revisa un detalle" : "¡Correcto!") : "No es correcto";
    const sol = (["input","speak"].includes(ex.type)) && r.best && ex.mode!=="ans" ? r.best : ex.sol;
    h = `<div class="fb ${ok?"ok":"bad"}" role="status"><h3>${head}</h3>`;
    if(ex.type==="reply") h += `<p>${ok?"Otra forma natural":"Una forma de decirlo"}: <b>${esc(ex.sol)}</b> ${spk(ex.sol)}</p>`;
    else if(!ok || r.typo) h += `<p>${ok?"Forma correcta":"Solución"}: <b>${esc(sol)}</b> ${spk(ex.type==="mcq"||ex.mode==="ans"?ex.full:sol)}</p>`;
    else if(ex.full) h += `<p><b>${esc(ex.sol)}</b> ${spk(ex.full)}</p>`;
    if(ex.expl) h += `<p>${esc(ex.expl)}</p>`;

function aiPromptFor(ex, student){
  const d = ex.it.d, L = lvlCode();
  if(ex.ai==="compose") return `You are an English teacher correcting a short written task by a Spanish speaker (CEFR level ${L}).
Task (in Spanish): ${ex.task}${ex.from?`\nMessage the student is replying to: "${ex.from}"`:""}
Student text: """${student}"""
Return JSON only, no markdown: {"score": integer 1-10, "comment": "1-2 sentences in Spanish about content and tone", "errors": ["up to 5 items like 'wrong → right (nota breve en español)'"], "corrected": "the student's text corrected and made natural, keeping their ideas"}`;
  if(ex.ai==="interview") return `You are an experienced HR interviewer and English coach. The candidate is a Spanish-speaking engineer (CEFR level ${L}) practising job interviews in English.
Question: "${ex.big}"
Candidate's answer (it may come from speech recognition, so ignore punctuation): "${student}"
Evaluate both the English and the content (structure, relevance, concrete examples, confidence).
Return JSON only, no markdown: {"score": integer 1-10, "good": "what went well, 1-2 sentences in Spanish", "improve": "the most important improvement, 1-2 sentences in Spanish", "errors": ["up to 3 language mistakes like 'wrong → right'"], "better": "an improved version of the answer in natural English, keeping the candidate's ideas, max 80 words"}`;
  const task = ex.ai==="translate" ? `Translate this Spanish sentence into English: "${ex.big}"`
    : ex.ai==="question" ? `The student sees the answer "${d.a}" and must write the English question that asks for the part "${d.h}". ${d.pre?"Extra instruction (in Spanish): "+d.pre:""}`
    : ex.ai==="speak" ? `Say this Spanish sentence in English: "${ex.big}". The answer came from speech recognition, so ignore capitalization and punctuation.`
    : ex.ai==="reply" ? `In a role-play (${ex.sub}), the other person says: "${ex.bot}". The student's goal (in Spanish) is: "${ex.task}". Any natural reply that achieves the goal is correct.`
    : `Answer this question in English: "${ex.big}"`;
  return `You are a friendly but rigorous English teacher for a Spanish speaker (CEFR level ${L}).
Task: ${task}
Reference answers: ${(ex.accepted||ex.keywords||[ex.sol]).join(" | ")}
Student answer: "${student}"
Decide whether the student's answer is correct, understandable English that fulfils the task. Minor typos and British or American spelling are acceptable. Other natural wordings are fine.
Reply with JSON only, no markdown: {"correct": true or false, "feedback": "one or two short sentences in Spanish", "better": "a correct, natural English version"}`;
}
async function askAI(){

const XP_OK = {open:25, compose:30, reply:20};
function doContinue(skip, selfOk){
  const ex = cur(), st = sess.st, today = todayKey();
  if(selfOk!=null) st.result.ok = selfOk;
  const ok = !skip && !!(st.result && st.result.ok);
  if(!skip && sess.kind!=="placement"){
    record(ex.it.topic, ok);
    S.seen[ex.it.id] = today;
    if(!ok) S.review[ex.it.id] = addDays(today,1); else delete S.review[ex.it.id];
    addXP((ok ? (XP_OK[ex.type]||15)*(st.result.typo?0.75:1) : (XP_OK[ex.type]?8:1)) * sess.mul);
  }
  sess.res.push({ex, ok, skip:!!skip});
  if(sess.i < sess.exs.length-1){ sess.i++; resetEx(); save(); render(); scrollTo(0,0); }
  else finishSession();
}
function finishSession(){
  Mic.abort();

  const m = {kind:s.kind, xp0:s.xp0, correct, total, fact:null, title:"Sesión terminada", sub:"",
    misses: s.res.filter(x=>!x.ok && !x.skip).map(x=>({q: x.ex.big || x.ex.bot || x.ex.task || x.ex.es || (x.ex.sentence||"").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim(), a: x.ex.sol}))};
  if(s.kind==="daily"){
    if(S.lastDaily!==key){ S.streak = (S.lastDaily && dayDiff(S.lastDaily,key)===1) ? S.streak+1 : 1; S.lastDaily = key; }
    S.best = Math.max(S.best, S.streak); S.days[key] = 1;
    addXP(40 + (correct===total ? 20 : 0));
    const r = rng(hashStr("fact"+key));
    if(r()<0.7 || !S.facts.length){
      const avail = FACTS.map((_,i)=>i).filter(i=>!S.facts.includes(i)), pool = avail.length?avail:FACTS.map((_,i)=>i);
      const idx = pool[Math.floor(r()*pool.length)]; if(!S.facts.includes(idx)) S.facts.push(idx);
      m.fact = FACTS[idx]; if(S.daily) S.daily.fact = idx;
    }
    if(S.daily){ S.daily.done = true; S.daily.score = [correct,total]; }
    m.title = "Reto de hoy completado"; m.sub = correct===total ? "Pleno: +20 XP de bonificación." : "Mañana tendrás un reto nuevo.";
  } else if(s.kind==="checkride"){
    const need = Math.ceil(total*0.7);
    if(correct>=need){ S.level = Math.min(5, S.level+1); const L=LEVELS[S.level-1]; m.xp0 = L.xp; m.title = `¡Nivel ${L.code}!`; m.sub = `Ahora estás en «${L.name}». Llegan conversaciones, estructuras y expresiones nuevas${S.level===2?", incluido el inglés coloquial":""}.`; S.daily = null; }
    else { m.title = "Casi"; m.sub = `Necesitabas ${need} aciertos y has conseguido ${correct}. Repasa tus fallos y vuelve a intentarlo cuando quieras.`; }
  } else if(s.kind==="placement"){
    let start = 1;
    for(let L=1; L<=4; L++){ const g = s.res.filter(x=>x.ex.it.lvl===L); if(g.filter(x=>x.ok).length>=2) start=L+1; else break; }
    start = Math.min(5,start);
    if(!S.started || start>S.level){ S.level = start; S.xp = Math.max(S.xp, LEVELS[start-1].xp); S.daily = null; }
    S.started = true;
    const L = LEVELS[S.level-1];
    m.title = `Empiezas en ${L.code}`; m.sub = `«${L.name}»: la app te irá subiendo de nivel según avances.`; m.xp0 = L.xp;
  } else { m.title = "Práctica terminada"; m.sub = "Tus resultados ya cuentan en Progreso."; }
  save(); summ = m; sess = null; view = "summary"; pendingAnim = [m.xp0, S.xp]; render(); scrollTo(0,0);
}

  else chat.log.push({who:"note", ok:false, html:`Casi. Revisa tu objetivo y vuelve a intentarlo, o toca «Ver ejemplo».${AI?` <button class="link" data-act="chatai">¿Mi frase vale? Preguntar a Claude</button>`:""}`});
  render(); scrollChat();
}
function guidedOk(text){
  const turn = chat.sc.turns[chat.i], first = chat.tries===0 && !chat.peek;
  if(first) chat.score++;
  record("conv", first); addXP(first?20:8);
  chat.log.push({who:"note", ok:true, html:`✓ ¡Bien!${sim(text,turn.m)<0.9?` Otra forma natural: <b>${esc(turn.m)}</b> ${spk(turn.m)}`:""}`});
  nextTurn(); render(); scrollChat();
}
function nextTurn(){
  chat.i++; chat.tries=0; chat.peek=false;
  if(chat.i < chat.sc.turns.length){ const b = chat.sc.turns[chat.i].b; chat.log.push({who:"bot", text:b}); setTimeout(()=>speak(b), 350); }
  else { chat.done = true; addXP(30 + (chat.score===chat.sc.turns.length?20:0)); save(); }
}
async function chatAIcheck(){
  if(!AI || !chat.last || chat.busy) return;
  const turn = chat.sc.turns[chat.i];
  chat.busy = true; render(); scrollChat();
  const prompt = `You are a friendly English teacher. In a role-play (${chat.sc.title}), the other person says: "${turn.b}". The student's goal (in Spanish) is: "${turn.t}".
The student said: "${chat.last[0]}"
Did the student achieve the goal with understandable, reasonably correct English? Other natural wordings are fine.
Reply with JSON only, no markdown: {"correct": true or false, "feedback": "one short sentence in Spanish", "better": "a natural way to say it"}`;
  try{
    const j = await aiJSON(prompt,"quick");
    chat.busy = false;
    if(j && j.correct===true){ chat.log.push({who:"note", ok:true, html:`Claude la da por buena. ${esc(j.feedback||"")}`}); chat.tries = 0; guidedOk(chat.last[0]); return; }
    chat.log.push({who:"note", ok:false, html:`${esc((j&&j.feedback)||"No termina de cumplir el objetivo.")}${j&&j.better?` Prueba: <b>${esc(j.better)}</b> ${spk(j.better)}`:""}`});
  }catch(e){ chat.busy = false; chat.log.push({who:"note", ok:false, html:esc(aiErr(e))}); }
  render(); scrollChat();
}
function transcript(){ return chat.log.filter(m=>m.who!=="note").slice(-20).map(m=>(m.who==="bot"?"Character":"Student")+": "+m.text).join("\n"); }
async function freeTurn(){
  chat.userTurns++; chat.busy = true; render(); scrollChat();
  const L = lvlCode();
  const prompt = `You are role-playing to help a Spanish speaker practise conversational English (CEFR level ${L}).
You are ${chat.sc.role}. The student is ${chat.sc.you}. Stay in character and never mention that you are an AI or a teacher.
Conversation so far:
${transcript()}

1. Reply in character with one or two short, natural sentences suited to level ${L}. Keep the conversation going, usually with a question.
2. Check the student's last message for grammar or vocabulary mistakes or clearly unnatural phrasing.
Return JSON only, no markdown: {"reply": "your in-character reply", "correction": "a short explanation in Spanish of the main mistake, or an empty string if there was none", "better": "a more natural version of the student's last message, or an empty string if it was already natural", "end": false}
Set "end" to true only if the conversation has clearly reached its natural end.`;
  try{
    const j = await aiJSON(prompt,"quick");
    const fixed = !!(j.correction && j.correction.trim());
    if(fixed || (j.better && sim(j.better, chat.last[0])<0.9)) chat.log.push({who:"note", ok:!fixed, html:`${fixed?"💡 "+esc(j.correction):"✓ Se entiende bien."}${j.better?` Más natural: <b>${esc(j.better)}</b> ${spk(j.better)}`:""}`});
    if(j.reply){ chat.log.push({who:"bot", text:j.reply}); setTimeout(()=>speak(j.reply), 200); }
    record("conv", !fixed); addXP(12); save();
    chat.busy = false;
    if(j.end || chat.userTurns>=10){ render(); return endFree(); }
  }catch(e){ chat.busy = false; chat.log.push({who:"note", ok:false, html:esc(aiErr(e))}); }
  render(); scrollChat();
}
async function endFree(){
  Mic.abort();
  chat.done = true; chat.final = {loading:true}; render(); scrollChat();
  const prompt = `You are an English speaking coach. Below is a role-play between a Spanish-speaking learner (CEFR level ${lvlCode()}), labelled Student, and a character (${chat.sc.role}).
${transcript()}

Return JSON only, no markdown: {"score": integer 1-10, "summary": "two sentences in Spanish on how the student did", "tips": ["up to 3 short, concrete tips in Spanish"], "phrases": ["3 useful English phrases for this kind of conversation"]}`;
  try{ const j = await aiJSON(prompt,"default"); chat.final = Object.assign({ai:true}, j); addXP(40); save(); }
  catch(e){ chat.final = {err: aiErr(e)}; }
  if(view==="chat") { render(); scrollChat(); }
}

function dictateInto(obj, field, elId){
  if(Mic.on){ Mic.stop(); return; }
  const base = (obj[field]||"").trim();
  const ok = Mic.start({ long:true,
    onResult: (fin, interim) => { obj[field] = (base?base+" ":"") + fin; const a=$("#"+elId); if(a) a.value = obj[field] + (interim?" "+interim:""); const wc=$("#wc"); if(wc) wc.textContent = wordCount(a?a.value:obj[field])+" palabras"; },

    onEnd: () => { obj.listening = false; render(); } });
  obj.listening = ok; if(ok) obj.micErr = null; render();
}

function deckItems(k){
  const max = Math.min(5, S.level+1), [a,b] = k.split(":");

    <div class="panel">${deckList().map(d=>{ const locked = d.min && S.level<d.min, items = deckItems(d.k), known = items.filter(x=>(S.fc[x.id]||0)>=3).length;
      return `<div class="topic"><span aria-hidden="true">${d.icon}</span><div><b>${esc(d.n)}</b><span class="small muted">${locked?"Se desbloquea en A2":`${items.length} términos${flash?`, dominas ${known}`:""}`}</span></div>
        <button class="btn sm" data-act="deck" data-k="${d.k}" ${locked?"disabled":""}>${flash?"Abrir":"Empezar"}</button></div>`; }).join("")}</div></div>`;
}
function openDeck(k){
  const items = deckItems(k), name = (deckList().find(d=>d.k===k)||{n:""}).n;
  if(deckMode==="quiz"){
    const r = rng(Date.now());
    const pick = items.map(it=>({it, sc:(S.seen[it.id]?Math.min(30,dayDiff(S.seen[it.id],todayKey())):40)+r()*10})).sort((a,b)=>b.sc-a.sc).slice(0,8).map(x=>x.it);
    return startSession({kind:"game", mul:0.5, items:pick});
  }
  const cards = shuffle(items).sort((a,b)=>(S.fc[a.id]||0)-(S.fc[b.id]||0)).slice(0,12);
  fl = {k, name, cards, i:0, flip:false, known:0, seen:0, again:new Set()}; view = "flash"; render();
}
function cardFaces(it){
  const d = it.d;
  if(it.topic==="vocab" && it.kind==="f") return {front:d[0], back:d[1], extra:`No confundir con «${d[2]}».`, say:clean(d[0]), label:"False friend"};
  if(it.topic==="phrasal"||it.topic==="expr") return {front:d[0], back:d[1], extra:d[3], say:d[0], ex:d[3], label:TOPICS[it.topic].name};
  if(it.topic==="tech") return {front:d[0], back:d[1], extra:"", say:clean(d[0]), label:TSUBS[d[3]]};
  if(it.topic==="vocab") return {front:d[0], back:d[1], extra:"", say:clean(d[0]), label:VSUBS[d[3]]};
  return {front:d[0], back:d[1], extra:"", say:clean(d[0]), label:"Entrevistas"};
}
function renderFlash(){
  const back = `<div class="top"><button class="icon-btn" data-act="deckback" aria-label="Volver">←</button><b>${esc(fl.name)}</b><span class="small muted">${Math.min(fl.i+1,fl.cards.length)}/${fl.cards.length}</span></div>`;
  if(fl.i>=fl.cards.length) return `<div class="wrap">${back}<div class="panel"><h2>Mazo repasado</h2><p class="muted" style="margin:6px 0 14px">Te sabías ${fl.known} de ${fl.seen} tarjetas. Las demás volverán primero la próxima vez.</p>
    <div class="row" style="flex-wrap:wrap;gap:10px"><button class="btn" data-act="deckagain">Otra ronda</button><button class="btn ghost" data-act="deckback">Elegir otro mazo</button></div></div></div>`;
  const it = fl.cards[fl.i], f = cardFaces(it);
  return `<div class="wrap">${back}<div class="card-wrap"><div class="fcard ${fl.flip?"flip":""}" data-act="flip" role="button" tabindex="0" aria-label="Girar tarjeta">
      <div class="face front"><span class="small muted">${LEVELS[it.lvl-1].code}, ${esc(f.label)}</span><div class="word" lang="en">${esc(f.front)}</div><span class="small muted">Toca para ver el significado</span></div>
      <div class="face back"><div class="word">${esc(f.back)}</div>${f.extra?`<p class="muted">${esc(f.extra)}</p>`:""}</div></div></div>
    <div class="row" style="gap:10px;flex-wrap:wrap">${spk(f.say)}${f.ex?`<button class="btn sm ghost" data-act="say" data-t="${esc(f.ex)}">Escuchar ejemplo</button>`:""}</div>
    <div class="row sec" style="gap:10px">${fl.flip
      ? `<button class="btn ghost" style="flex:1" data-act="fcagain">Repasar otra vez</button><button class="btn ok" style="flex:1" data-act="fcknow">Me la sé</button>`
      : `<button class="btn full" data-act="flip">Girar tarjeta</button>`}</div></div>`;
}
function fcNext(known){
  const it = fl.cards[fl.i];
  fl.seen += fl.again.has(it.id) ? 0 : 1;
  if(known){ S.fc[it.id] = Math.min(4,(S.fc[it.id]||0)+1); if(!fl.again.has(it.id)) fl.known++; addXP(3); S.seen[it.id]=todayKey(); }
  else { S.fc[it.id] = 0; if(!fl.again.has(it.id)){ fl.again.add(it.id); fl.cards.push(it); } }
  fl.i++; fl.flip = false; save(); render();
}

/* ---------- memory ---------- */
function newMemory(){
  const pick = shuffle(POOL.phrasal.filter(it=>it.lvl<=Math.min(5,S.level+1))).slice(0,6), cards = [];
  pick.forEach((it,k)=>{ cards.push({k,t:it.d[0],en:true}); cards.push({k,t:it.d[1],en:false}); });
  mem = {items:pick, cards:shuffle(cards), open:[], done:new Set(), moves:0, lock:false, bad:[], finished:false};
}
function renderMemory(){
  let h = `<div class="wrap"><div class="top"><button class="icon-btn" data-act="tab" data-v="games" aria-label="Volver">←</button><b>Memory de phrasal verbs</b><span class="small muted">${mem.moves} jugadas</span></div>`;
  if(mem.finished) return h + `<div class="panel"><h2>¡Tablero completo!</h2><p class="muted" style="margin:6px 0 12px">${mem.moves} jugadas. Has ganado 15 XP. Repasa los ejemplos en voz alta:</p>
      <div class="miss-list">${mem.items.map(it=>`<div class="row between"><div><b>${esc(it.d[0])}</b>: ${esc(it.d[1])}<br><i class="small">${esc(it.d[3])}</i></div>${spk(it.d[3])}</div>`).join("")}</div>
      <div class="row sec" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="memnew">Nueva partida</button><button class="btn ghost" data-act="tab" data-v="games">Volver a juegos</button></div></div></div>`;
  h += `<p class="muted" style="margin-bottom:14px">Encuentra las 6 parejas: cada phrasal verb con su significado.</p><div class="mem">`;
  h += mem.cards.map((c,i)=>{ const open = mem.open.includes(i), done = mem.done.has(i);
    return `<button class="mc ${c.en?"en":""} ${open?"open":""} ${done?"done":""} ${mem.bad.includes(i)?"shake":""}" data-act="mem" data-i="${i}" aria-label="${open||done?esc(c.t):"Carta boca abajo"}" ${done?"disabled":""}>${open||done?esc(c.t):"?"}</button>`; }).join("");
  return h + `</div></div>`;
}
function memTap(i){
  if(mem.lock || mem.done.has(i) || mem.open.includes(i)) return;
  mem.bad = []; mem.open.push(i);
  if(mem.open.length===2){
    mem.moves++;
    const [a,b] = mem.open, A = mem.cards[a], B = mem.cards[b];
    if(A.k===B.k){ mem.done.add(a); mem.done.add(b); mem.open = []; speak(A.en?A.t:B.t);
      if(mem.done.size===mem.cards.length){ mem.finished = true; addXP(15); save(); } }
    else { mem.lock = true; render(); setTimeout(()=>{ if(!mem) return; mem.bad=[a,b]; mem.open=[]; mem.lock=false; if(view==="memory") render(); }, 950); return; }
  }
  render();
}

/* ---------- contrarreloj ---------- */
function tmNext(){
  const pool = [...POOL.vocab, ...POOL.phrasal, ...POOL.interview.filter(x=>x.kind==="v"), ...(S.settings.tech!=="never"?POOL.tech:[])].filter(it=>it.lvl<=S.level);
  tm.q = makeEx(pool[Math.floor(Math.random()*pool.length)], Math.random);
}
function stopTimer(){ if(tmTimer){ clearInterval(tmTimer); tmTimer = null; } }
function startTimed(){
  tm = {started:true, over:false, score:0, total:0, end:Date.now()+60000}; tmNext(); render();
  stopTimer(); tmTimer = setInterval(()=>{
    const left = Math.max(0, Math.ceil((tm.end-Date.now())/1000)), el = $("#timer");
    if(el) el.textContent = left+" s";
    if(left<=0){ stopTimer(); tm.over = true; addXP(4*tm.score); save(); if(view==="timed") render(); }
  }, 250);
}
function renderTimed(){
  let h = `<div class="wrap"><div class="top"><button class="icon-btn" data-act="tab" data-v="games" aria-label="Volver">←</button><b>Contrarreloj</b><span></span></div>`;
  if(!tm.started) return h + `<div class="panel"><h2>60 segundos</h2><p class="muted" style="margin:6px 0 14px">Vocabulario, phrasal verbs y términos de entrevista de tu nivel. Cada acierto vale 4 XP y los fallos no restan.</p><button class="btn full" data-act="tmstart">Empezar</button></div></div>`;
  if(tm.over) return h + `<div class="panel"><h2>¡Tiempo!</h2><div class="kpis sec"><div class="kpi"><b>${tm.score}</b><span>aciertos</span></div><div class="kpi"><b>${tm.total}</b><span>respondidas</span></div><div class="kpi"><b>+${fmt(4*tm.score)}</b><span>XP</span></div></div>
    <div class="row sec" style="gap:10px;flex-wrap:wrap"><button class="btn" data-act="tmstart">Otra vez</button><button class="btn ghost" data-act="tab" data-v="games">Volver a juegos</button></div></div></div>`;
  const q = tm.q, left = Math.max(0, Math.ceil((tm.end-Date.now())/1000));
  return h + `<div class="row between" style="margin-bottom:12px"><span class="timer" id="timer">${left} s</span><b>${tm.score} aciertos</b></div>
    <div class="panel" id="tmpanel"><div class="q-title">${esc(q.title)}</div><div class="big">${esc(q.big)}</div>
    <div class="opts">${q.opts.map((o,i)=>`<button class="opt" data-act="tmpick" data-i="${i}">${esc(o)}</button>`).join("")}</div></div></div>`;
}
function tmPick(i){
  if(tm.over) return;
  const ok = tm.q.opts[i]===tm.q.answer; tm.total++; if(ok) tm.score++;
  record(tm.q.it.topic, ok);
  if(!ok) toast(tm.q.sol);
  tmNext(); render();
  const p = $("#tmpanel"); if(p) p.classList.add(ok?"flash-ok":"flash-bad");
}

  if(installEvt) return `<div style="margin-top:10px"><button class="btn sm" data-act="install">Instalar en este móvil</button></div>`;
  if(isIOS()) return `<p class="note">Para instalarla en el iPhone, toca el botón Compartir de Safari y elige «Añadir a pantalla de inicio».</p>`;
  return `<p class="note">Para instalarla, abre el menú del navegador y elige «Añadir a pantalla de inicio» o «Instalar app».</p>`;
}
ACT.install = async () => { if(!installEvt) return; const e = installEvt; installEvt = null; try{ e.prompt(); await e.userChoice; }catch(err){} render(); };
ACT.hideInstall = () => { S.hideInstall = true; save(); render(); };
if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost")){
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(()=>{}); });
}
</script>
